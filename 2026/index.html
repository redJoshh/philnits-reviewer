}

  --bg: #0f1216; --surface: #171b21; --surface-2: #1f242c; --border: #2c333d;
  --text: #e6e9ee; --muted: #9aa4b2; --accent: #7b9cff; --accent-soft: #1e2a4a;
  --ok: #6fd18f; --ok-bg: #13301e; --ok-border: #2f7046;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {

}
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
.topbar .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 0; }
.brand { font-weight: 650; font-size: 1.02rem; margin-right: auto; }
.brand small { display: block; font-weight: 450; color: var(--muted); font-size: .78rem; }
.brand .home { display: block; font-weight: 500; font-size: .78rem; color: var(--accent); text-decoration: none; margin-bottom: 2px; }
.brand .home:hover { text-decoration: underline; }

.progress { height: 3px; background: var(--surface-2); }

.btn {

.btn:hover { background: var(--surface-2); }

.btn.danger:hover { color: var(--bad); border-color: var(--bad-border); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: .88rem; }
.seg button + button { border-left: 1px solid var(--border); }

main { padding-bottom: 64px; }

.prompt th { background: var(--surface-2); }
.note-fig { font-size: .82rem; color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 6px 10px; margin: 4px 0 10px; }

.opts { display: grid; gap: 8px; margin-top: 8px; }
.opt {
  display: flex; align-items: flex-start; gap: 10px; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
}
.opt:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt .k {
  flex: none; width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); font-size: .82rem; font-weight: 600;
}
.opt .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .m { flex: none; }
.opt.correct { background: var(--ok-bg); border-color: var(--ok-border); }
.opt.correct .k { background: var(--ok); color: var(--surface); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad-border); }
.opt.wrong .k { background: var(--bad); color: var(--surface); }
.opt.dim { opacity: .62; }

.q-foot { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 2px 0; font-size: .88rem; }

.explain {

.doc .doc-ans { font-size: .94rem; }

.empty { text-align: center; color: var(--muted); padding: 48px 0; }
.toast {

  transition: .2s; pointer-events: none; z-index: 20;

.toast.show { opacity: 1; transform: translateX(-50%); }
footer { color: var(--muted); font-size: .8rem; text-align: center; padding: 8px 0 32px; }
.katex { font-size: 1.05em; }
code { font: .92em ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; background: var(--surface-2); border-radius: 4px; padding: 1px 5px; }

@media (max-width: 640px) {
  .stats { gap: 12px; width: 100%; order: 3; }
  .q { padding: 14px 14px; }
  .brand { flex-basis: 100%; }
}

sses on the server side, and the performing of user interface processes on the client side."},{"key":"d","text":"It is the division of processing time for a single CPU into short units, and the sequential allocation of these to multiple applications for execution."}],"correctAnswer":"a","explanation":"a) It is the division of a series of processing into processing units that can be executed simultaneously, and the execution of these on multiple CPUs."},{"id":"2026S-Q15","session":"Spring 2026","category":null,"questionNumber":15,"prompt":"Which of the following includes all the appropriate measures to enable the normal execution of processing even in the event of a failure in part of a system?\n\n(1) Configuring HDDs with mirroring\n(2) Minimizing the frequency of maintenance and inspections after stable operation starts\n(3) Grouping multiple redundant network lines into a single high-speed line\n(4) Making power supply redundant with the use of an uninterruptible power supply (UPS), etc.","hasDiagram":false,"options":[{"key":"a","text":"(1), (3)"},{"key":"b","text":"(1), (4)"},{"key":"c","text":"(2), (3)"},{"key":"d","text":"(2), (4)"}],"correctAnswer":"b","explanation":"b) (1), (4)"},{"id":"2026S-Q16","session":"Spring 2026","category":null,"questionNumber":16,"prompt":"In the specification of the capacity of a battery that is embedded in a device such as an IoT device or a smartphone, which of the following is the appropriate meaning of “100mAh”?","hasDiagram":false,"options":[{"key":"a","text":"It can discharge a current of 100mA for one (1) hour."},{"key":"b","text":"After it is charged for 100 minutes, it can discharge a current for one (1) hour."},{"key":"c","text":"It can discharge a current of 1A for 100 minutes."},{"key":"d","text":"After it is charged for one (1) hour, it can discharge a current for 100 minutes."}],"correctAnswer":"a","explanation":"a) It can discharge a current of 100mA for one (1) hour."},{"id":"2026S-Q17","session":"Spring 2026","category":null,"questionNumber":17,"prompt":"When a record in a file is modified, which of the following is an appropriate way of identifying the modified contents?","hasDiagram":false,"options":[{"key":"a","text":"Keeping a record of the size and the modified date of a file"},{"key":"b","text":"Keeping a copy of a file and comparing it to the modified one later"},{"key":"c","text":"Keeping a record of the number of records into the file"},{"key":"d","text":"Keeping records sorted in ascending order of the key field"}],"correctAnswer":"b","explanation":"b) Keeping a copy of a file and comparing it to the modified one later"},{"id":"2026S-Q18","session":"Spring 2026","category":null,"questionNumber":18,"prompt":"Which of the following is an OS function that executes multiple application programs concurrently on a single PC by alternating between them?","hasDiagram":false,"options":[{"key":"a","text":"Virtual reality"},{"key":"b","text":"Dual core"},{"key":"c","text":"Dual system"},{"key":"d","text":"Multitasking"}],"correctAnswer":"d","explanation":"d) Multitasking"},{"id":"2026S-Q19","session":"Spring 2026","category":null,"questionNumber":19,"prompt":"Which of the following is an appropriate description about the function keys of a PC?","hasDiagram":false,"options":[{"key":"a","text":"They are the keys where specific functions are assigned for each application and OS."},{"key":"b","text":"They display a keyboard shape on a screen and enable input processing with software."},{"key":"c","text":"They have a security role and are keys for performing encryption and decryption."},{"key":"d","text":"They are information to uniquely identify a specific row in a database."}],"correctAnswer":"a","explanation":"a) They are the keys where specific functions are assigned for each application and OS."},{"id":"2026S-Q20","session":"Spring 2026","category":null,"questionNumber":20,"prompt":"When directories d1 and d2 are placed on a web server, which of the following descriptions specifies the reference of the web page file f2.html on directory d2 from the web page file f1.html on directory d1 (current directory)?","hasDiagram":false,"options":[{"key":"a","text":"`./d2/f2.html`"},{"key":"b","text":"`./f2.html`"},{"key":"c","text":"`../d2/f2.html`"},{"key":"d","text":"`d2/../f2.html`"}],"correctAnswer":"c","explanation":"c) `../d2/f2.html`"},{"id":"2026S-Q21","session":"Spring 2026","category":null,"questionNumber":21,"prompt":"Which of the following is a technology that is also used in measures against tampering of software in IoT devices and verifies the digital signature of the OS, firmware, or other such software when it is started, and only executes the software if the verification is successful?","hasDiagram":false,"options":[{"key":"a","text":"GPU"},{"key":"b","text":"RAID"},{"key":"c","text":"Secure boot"},{"key":"d","text":"Reboot"}],"correctAnswer":"c","explanation":"c) Secure boot"},{"id":"2026S-Q22","session":"Spring 2026","category":null,"questionNumber":22,"prompt":"Among the descriptions below concerning Open Source Software (OSS), which of the following lists all and only the appropriate descriptions?\n\nA: Software that is created by using OSS can be sold.\nB: All software with publicly available source code is OSS.\nC: It is software the copyright of which has been waived.","hasDiagram":false,"options":[{"key":"a","text":"A"},{"key":"b","text":"A, B"},{"key":"c","text":"B, C"},{"key":"d","text":"C"}],"correctAnswer":"a","explanation":"a) A"},{"id":"2026S-Q23","session":"Spring 2026","category":null,"questionNumber":23,"prompt":"Which of the following is the description of a 3D printer?","hasDiagram":false,"options":[{"key":"a","text":"It prints an image with a 3D effect on a flat surface."},{"key":"b","text":"It uses three-dimensional data to form a stereoscopic (three-dimensional) object."},{"key":"c","text":"It prints an image on a curved surface, etc. of a stereoscopic object."},{"key":"d","text":"It uses a laser to display a stereoscopic image in space."}],"correctAnswer":"b","explanation":"b) It uses three-dimensional data to form a stereoscopic (three-dimensional) object."},{"id":"2026S-Q24","session":"Spring 2026","category":null,"questionNumber":24,"prompt":"Which of the following is an appropriate description of AR (Augmented Reality)?","hasDiagram":false,"options":[{"key":"a","text":"A technology that creates memory space beyond the amount of memory actually installed."},{"key":"b","text":"A technology that overlays and displays computer-generated information on live video or other content that captures real environments."},{"key":"c","text":"A technology that analyzes and digitizes the human voice by using a computer."},{"key":"d","text":"A science or a technology for emulating human intellectual activity such as inference, learning, and ability to understand language."}],"correctAnswer":"b","explanation":"b) A technology that overlays and displays computer-generated information on live video or other content that captures real environments."},{"id":"2026S-Q25","session":"Spring 2026","category":null,"questionNumber":25,"prompt":"On a display screen, various colors are created through additive color mixing with three colors, namely red, green, and blue. When the red, green, and blue are mixed evenly, which of the following colors is formed?","hasDiagram":false,"options":[{"key":"a","text":"Red-violet"},{"key":"b","text":"Yellow"},{"key":"c","text":"White"},{"key":"d","text":"Green rust"}],"correctAnswer":"c","explanation":"c) White"},{"id":"2026S-Q26","session":"Spring 2026","category":null,"questionNumber":26,"prompt":"Which of the following is an appropriate effect obtained through the normalization of data in a relational database?","hasDiagram":false,"options":[{"key":"a","text":"Securing of data compatibility between different types of computers"},{"key":"b","text":"Improvement of storage efficiency through data compression"},{"key":"c","text":"Elimination of redundancy and inconsistency of data"},{"key":"d","text":"Elimination of the need for backups that are necessary in preparation for the failure of devices"}],"correctAnswer":"c","explanation":"c) Elimination of redundancy and inconsistency of data"},{"id":"2026S-Q27","session":"Spring 2026","category":null,"questionNumber":27,"prompt":"Which of the following is an appropriate description concerning foreign keys in a relational database?","hasDiagram":false,"options":[{"key":"a","text":"A property held by the foreign key is called a unique constraint."},{"key":"b","text":"Duplicate values cannot be set in the fields that are set as foreign keys."},{"key":"c","text":"Multiple foreign keys can be defined in a single table."},{"key":"d","text":"Multiple fields cannot be collectively set as a single foreign key."}],"correctAnswer":"c","explanation":"c) Multiple foreign keys can be defined in a single table."},{"id":"2026S-Q29","session":"Spring 2026","category":null,"questionNumber":29,"prompt":"Which of the following is the appropriate explanation of commit in transaction processing?","hasDiagram":false,"options":[{"key":"a","text":"When a transaction attempts to update shared data, other transactions are blocked from updating this data."},{"key":"b","text":"The update is confirmed in the database. It is used when a transaction is processed normally."},{"key":"c","text":"The database is returned to the status prior to the start of a transaction. It is used when the transaction is not processed normally."},{"key":"d","text":"Multiple tables are made into one (1) table by using the columns as keys that relate the tables to each other."}],"correctAnswer":"b","explanation":"b) The update is confirmed in the database. It is used when a transaction is processed normally."},{"id":"2026S-Q30","session":"Spring 2026","category":null,"questionNumber":30,"prompt":"Which of the following is an appropriate explanation of the routing function of a router?","hasDiagram":false,"options":[{"key":"a","text":"It performs centralized monitoring of the status and the system settings for mobile devices."},{"key":"b","text":"It connects different networks to each other and chooses the optimal path to relay packets."},{"key":"c","text":"It connects optical fiber with copper wire cable, and physically performs two-way conversion of signals."},{"key":"d","text":"It manages host name and IP address correspondence and responds to inquiries from devices."}],"correctAnswer":"b","explanation":"b) It connects different networks to each other and chooses the optimal path to relay packets."},{"id":"2026S-Q31","session":"Spring 2026","category":null,"questionNumber":31,"prompt":"Which of the following is **not** an appropriate description of online storage?","hasDiagram":false,"options":[{"key":"a","text":"It can be used not only from a computer, but also from a smartphone or a tablet."},{"key":"b","text":"There is a free service that can be used with limited capacity and functionalities."},{"key":"c","text":"There is a service that allows multiple registered users to share and edit the same file."},{"key":"d","text":"If the capacity of the auxiliary storage unit built into the user’s computer is increased, the capacity of online storage will also increase automatically."}],"correctAnswer":"d","explanation":"d) If the capacity of the auxiliary storage unit built into the user’s computer is increased, the capacity of online storage will also increase automatically."},{"id":"2026S-Q32","session":"Spring 2026","category":null,"questionNumber":32,"prompt":"Which of the following is used for communication in activities such as the gathering of data from IoT devices, and has wide range and power saving characteristics that enable wireless communication over a distance of tens of kilometers?","hasDiagram":false,"options":[{"key":"a","text":"BLE"},{"key":"b","text":"LPWA"},{"key":"c","text":"MDM"},{"key":"d","text":"MVNO"}],"correctAnswer":"b","explanation":"b) LPWA"},{"id":"2026S-Q33","session":"Spring 2026","category":null,"questionNumber":33,"prompt":"Which of the following is a communications protocol that is in a lower layer than application layer protocols, and is commonly used to implement basic communications functions?","hasDiagram":false,"options":[{"key":"a","text":"FTP"},{"key":"b","text":"POP"},{"key":"c","text":"SMTP"},{"key":"d","text":"TCP/IP"}],"correctAnswer":"d","explanation":"d) TCP/IP"},{"id":"2026S-Q34","session":"Spring 2026","category":null,"questionNumber":34,"prompt":"Mr. A specified destination addresses as below and sent an e-mail. Among the descriptions concerning recipients, which lists all and only the appropriate descriptions?\n\n[Destinations] To: Mr. B, Cc: Mr. C, Bcc: Mr. D, Mr. E\n(1) Mr. C can find out Mr. D’s e-mail address.\n(2) Mr. D can find out Mr. C’s e-mail address.\n(3) Mr. E can find out Mr. D’s e-mail address.","hasDiagram":false,"options":[{"key":"a","text":"(1)"},{"key":"b","text":"(1), (3)"},{"key":"c","text":"(2)"},{"key":"d","text":"(2), (3)"}],"correctAnswer":"c","explanation":"c) (2)"},{"id":"2026S-Q35","session":"Spring 2026","category":null,"questionNumber":35,"prompt":"Among the descriptions A through C concerning PKI, which is the list that contains all and only the appropriate descriptions concerning a digital signature in e-mail?\n\nA: The recipient can check whether the sender is the intended person.\nB: It is possible to prevent e-mail from being read before it reaches the recipient.\nC: The recipient can confirm that the e-mail has not been tampered with.","hasDiagram":false,"options":[{"key":"a","text":"A, B"},{"key":"b","text":"A, C"},{"key":"c","text":"B, C"},{"key":"d","text":"A, B, C"}],"correctAnswer":"b","explanation":"b) A, C"},{"id":"2026S-Q36","session":"Spring 2026","category":null,"questionNumber":36,"prompt":"In the description below concerning risk management, which is the appropriate combination of words to be inserted into blanks A through C?\n\n\"In information security, a [A] in an information asset of an organization can be exploited by a [B]. The potential for damage is called a [C].\"","hasDiagram":false,"options":[{"key":"a","text":"A: Threat, B: Risk, C: Vulnerability"},{"key":"b","text":"A: Vulnerability, B: Threat, C: Risk"},{"key":"c","text":"A: Risk, B: Threat, C: Vulnerability"},{"key":"d","text":"A: Risk, B: Vulnerability, C: Threat"}],"correctAnswer":"b","explanation":"b) A: Vulnerability, B: Threat, C: Risk"},{"id":"2026S-Q37","session":"Spring 2026","category":null,"questionNumber":37,"prompt":"Among the following attacks, which can be prevented by stopping the use of a given ID when mistakes are made during the entry of a password for the ID more than the preset number of times?","hasDiagram":false,"options":[{"key":"a","text":"DoS (Denial of Service) attack"},{"key":"b","text":"SQL injection"},{"key":"c","text":"Brute force attack"},{"key":"d","text":"Phishing"}],"correctAnswer":"c","explanation":"c) Brute force attack"},{"id":"2026S-Q38","session":"Spring 2026","category":null,"questionNumber":38,"prompt":"Which of the following is an authentication method where a user uses information that differs each time and is generated with a device called a token?","hasDiagram":false,"options":[{"key":"a","text":"Digital signature"},{"key":"b","text":"Password cracking"},{"key":"c","text":"Password policy"},{"key":"d","text":"One time password"}],"correctAnswer":"d","explanation":"d) One time password"},{"id":"2026S-Q39","session":"Spring 2026","category":null,"questionNumber":39,"prompt":"Which of the following is an explanation of spyware?","hasDiagram":false,"options":[{"key":"a","text":"It is a scam where money is demanded just by viewing a web site."},{"key":"b","text":"It is a mechanism where an attacker packages attack tools and hides them in a PC."},{"key":"c","text":"It is a program that infects a large number of PCs and performs simultaneous attacks."},{"key":"d","text":"It is a program that is installed without the user knowing and collects information such as personal information and access history."}],"correctAnswer":"d","explanation":"d) It is a program that is installed without the user knowing and collects information such as personal information and access history."},{"id":"2026S-Q40","session":"Spring 2026","category":null,"questionNumber":40,"prompt":"When a PC is connected directly to the Internet during a business trip, which of the following is appropriate to use in order to prevent unauthorized access from the Internet?","hasDiagram":false,"options":[{"key":"a","text":"IC card authentication"},{"key":"b","text":"Personal firewall"},{"key":"c","text":"Hard disk password"},{"key":"d","text":"File encryption software"}],"correctAnswer":"b","explanation":"b) Personal firewall"},{"id":"2026S-Q41","session":"Spring 2026","category":null,"questionNumber":41,"prompt":"Which of the following is appropriate as the characteristic of single sign-on?","hasDiagram":false,"options":[{"key":"a","text":"It is an effective countermeasure for information leakage because data is processed and stored on a server side."},{"key":"b","text":"It implements high availability because when the data is saved, it is automatically distributed."},{"key":"c","text":"It implements high confidentiality because it employs authentication that uses fingerprint and iris."},{"key":"d","text":"It implements high convenience because once a user is authenticated, he or she is allowed to use multiple services without any more authentication."}],"correctAnswer":"d","explanation":"d) It implements high convenience because once a user is authenticated, he or she is allowed to use multiple services without any more authentication."},{"id":"2026S-Q42","session":"Spring 2026","category":null,"questionNumber":42,"prompt":"Which of the following is an appropriate description concerning the characteristics of the authentication method below?\n\n• Users memorize only the positions and their order on the matrix table used for authentication.\n• Numbers are randomly allocated on the matrix table every time authentication is performed.\n• A user enters numbers that are shown in memorized positions, in order, as a password.\n• Authentication succeeds when input of numbers displayed in the correct positions has been confirmed.","hasDiagram":false,"options":[{"key":"a","text":"Positions and their order do not have to be changed regularly."},{"key":"b","text":"It is safe to tell positions and their order to other people."},{"key":"c","text":"The method is effective in preventing spoofing through the use of tapped passwords."},{"key":"d","text":"The method is a type of biometric authentication."}],"correctAnswer":"c","explanation":"c) The method is effective in preventing spoofing through the use of tapped passwords."},{"id":"2026S-Q43","session":"Spring 2026","category":null,"questionNumber":43,"prompt":"Which of the following is a security standard that is used in a wireless LAN?","hasDiagram":false,"options":[{"key":"a","text":"Cookie"},{"key":"b","text":"ESSID"},{"key":"c","text":"MIME"},{"key":"d","text":"WPA2"}],"correctAnswer":"d","explanation":"d) WPA2"},{"id":"2026S-Q44","session":"Spring 2026","category":null,"questionNumber":44,"prompt":"Among the descriptions from A through C, which is the list that contains all and only appropriate features of VPN?\n\nA: Devices can communicate with each other by using a VPN wirelessly without passing through any access point.\nB: A VPN uses a public network, etc., but it can be used like a private network of one’s own company.\nC: The security status of computers can be checked by connecting them to a VPN.","hasDiagram":false,"options":[{"key":"a","text":"A"},{"key":"b","text":"A, C"},{"key":"c","text":"B"},{"key":"d","text":"C"}],"correctAnswer":"c","explanation":"c) B"},{"id":"2026S-Q45","session":"Spring 2026","category":null,"questionNumber":45,"prompt":"A user who specifies a correct URL and attempts to access the website is connected to a fake website. It was found that there was a vulnerability on the server that matches a domain name with an IP address, and the information was overwritten. Which of the following is the attack against this server?","hasDiagram":false,"options":[{"key":"a","text":"DDoS attack"},{"key":"b","text":"DNS cache poisoning"},{"key":"c","text":"Social engineering"},{"key":"d","text":"Drive by download"}],"correctAnswer":"b","explanation":"b) DNS cache poisoning"},{"id":"2026S-Q46","session":"Spring 2026","category":null,"questionNumber":46,"prompt":"Among the requirements for the design of screens A through D below, which is the list that contains all the items that are to be considered for easy-to-use for system users?\n\nA: The time to repair from a failure\nB: The ease of learning of operation\nC: The layout of pushbuttons\nD: The size and color of text","hasDiagram":false,"options":[{"key":"a","text":"A, B, C"},{"key":"b","text":"A, B, D"},{"key":"c","text":"A, C, D"},{"key":"d","text":"B, C, D"}],"correctAnswer":"d","explanation":"d) B, C, D"},{"id":"2026S-Q47","session":"Spring 2026","category":null,"questionNumber":47,"prompt":"Among a series of tests of software, which of the following is conducted mainly by the user who orders the development of the software?","hasDiagram":false,"options":[{"key":"a","text":"Acceptance test"},{"key":"b","text":"Integration test"},{"key":"c","text":"System test"},{"key":"d","text":"Unit test"}],"correctAnswer":"a","explanation":"a) Acceptance test"},{"id":"2026S-Q48","session":"Spring 2026","category":null,"questionNumber":48,"prompt":"A system migration plan was created for the migration from an existing system to a new system. Which of the following is an appropriate item to be described in the system migration plan?","hasDiagram":false,"options":[{"key":"a","text":"System selection policy"},{"key":"b","text":"Schedule for parallel operation of the existing and new systems"},{"key":"c","text":"Evaluation criteria for the quality of the deliverables of the new system"},{"key":"d","text":"The work history of project members"}],"correctAnswer":"b","explanation":"b) Schedule for parallel operation of the existing and new systems"},{"id":"2026S-Q49","session":"Spring 2026","category":null,"questionNumber":49,"prompt":"Which of the following is an activity that is performed in software maintenance?","hasDiagram":false,"options":[{"key":"a","text":"Issuing an initial password for a system user"},{"key":"b","text":"Investigating how to implement system requirements including the ease of maintenance during development"},{"key":"c","text":"Conducting an acceptance test for a new system for which development was outsourced"},{"key":"d","text":"Modifying the program of a system that is in operation in order to make the system conform to law revisions"}],"correctAnswer":"d","explanation":"d) Modifying the program of a system that is in operation in order to make the system conform to law revisions"},{"id":"2026S-Q50","session":"Spring 2026","category":null,"questionNumber":50,"prompt":"Which of the following is the most appropriate activity of improving the internal structure of an existing program without changing the external behavior of the software?","hasDiagram":false,"options":[{"key":"a","text":"Test driven development"},{"key":"b","text":"Pair programming"},{"key":"c","text":"Reverse engineering"},{"key":"d","text":"Refactoring"}],"correctAnswer":"d","explanation":"d) Refactoring"},{"id":"2026S-Q51","session":"Spring 2026","category":null,"questionNumber":51,"prompt":"Which of the following is an appropriate characteristic of a project?","hasDiagram":false,"options":[{"key":"a","text":"It achieves a specific goal for a limited period of time."},{"key":"b","text":"It consists of a team of fixed members, and the team is in charge of all the processes."},{"key":"c","text":"It starts without defining the end of the project, and the end is determined according to the progress status."},{"key":"d","text":"It is repeatedly performed as a routine task."}],"correctAnswer":"a","explanation":"a) It achieves a specific goal for a limited period of time."},{"id":"2026S-Q52","session":"Spring 2026","category":null,"questionNumber":52,"prompt":"There are negative and positive risks in a project. Among the treatment of risks in scheduling, which of the following corresponds to a treatment of a positive risk?","hasDiagram":false,"options":[{"key":"a","text":"Having all members receive vaccination before influenza spreads"},{"key":"b","text":"Reducing the entire project duration by carrying out tasks for creating software programs in parallel when the overall cost can be reduced by advancing the schedule"},{"key":"c","text":"Securing replacement staff in advance in preparation for delay due to unexpected withdrawal of staff"},{"key":"d","text":"Purchasing insurance in preparation for payment of a penalty due to delivery delay"}],"correctAnswer":"b","explanation":"b) Reducing the entire project duration by carrying out tasks for creating software programs in parallel when the overall cost can be reduced by advancing the schedule"},{"id":"2026S-Q53","session":"Spring 2026","category":null,"questionNumber":53,"prompt":"In a development project, there is a plan to create 36 programs. It was first planned to assign only Mr. A who can create 6 programs per week (cost: 300k/week). The plan changed to assign Mr. A and Mr. B (half the productivity of Mr. A, cost: 200k/week). How much is the change in the cost as compared to the original plan?","hasDiagram":false,"options":[{"key":"a","text":"A decrease of 800 thousand yen"},{"key":"b","text":"A decrease of 300 thousand yen"},{"key":"c","text":"An increase of 200 thousand yen"},{"key":"d","text":"An increase of 1,200 thousand yen"}],"correctAnswer":"c","explanation":"c) An increase of 200 thousand yen"},{"id":"2026S-Q54","session":"Spring 2026","category":null,"questionNumber":54,"prompt":"When the management of a project is divided into progress management, quality management, and cost management, which of the following is most appropriate to be checked in progress management?","hasDiagram":false,"options":[{"key":"a","text":"Whether an integration test is conducted exhaustively from a variety of viewpoints"},{"key":"b","text":"The degree of an increase in cost in the future"},{"key":"c","text":"The degree of the impact on the entire schedule by a delay in an activity"},{"key":"d","text":"Whether a procedure has been established for a design review for finding defects"}],"correctAnswer":"c","explanation":"c) The degree of the impact on the entire schedule by a delay in an activity"},{"id":"2026S-Q55","session":"Spring 2026","category":null,"questionNumber":55,"prompt":"Which of the following is the appropriate explanation of a master schedule in a system development project?","hasDiagram":false,"options":[{"key":"a","text":"A schedule that describes in detail the activities of one (1) week"},{"key":"b","text":"A schedule that describes the activities of one (1) day, the start and end time, and the persons in charge"},{"key":"c","text":"A schedule that describes in detail the activities of the main processes"},{"key":"d","text":"A schedule that aggregates the main deliverables and activities of the entire project"}],"correctAnswer":"d","explanation":"d) A schedule that aggregates the main deliverables and activities of the entire project"},{"id":"2026S-Q56","session":"Spring 2026","category":null,"questionNumber":56,"prompt":"Which of the following is the appropriate description concerning WBS created in a project?","hasDiagram":false,"options":[{"key":"a","text":"A WBS defines the details of activities to be implemented in a project and the deliverables, and can therefore be used as a basis for estimating the number of person-days."},{"key":"b","text":"Activities outside the scope of the project are also examined and included in the WBS."},{"key":"c","text":"The WBS breaks down the deliverables and the details of activities up to the same hierarchy in all projects."},{"key":"d","text":"When a project member performs similar activities within the scope, the activities need not be described in the WBS."}],"correctAnswer":"a","explanation":"a) A WBS defines the details of activities to be implemented in a project and the deliverables, and can therefore be used as a basis for estimating the number of person-days."},{"id":"2026S-Q57","session":"Spring 2026","category":null,"questionNumber":57,"prompt":"Company A orders the development of a system to Company B. Among (i) through (iv) below, which lists all and only the stakeholders of the project?\n\n(i) Company A’s management executives\n(ii) Company A’s user department\n(iii) Company B’s project manager\n(iv) Company B’s business partner that provides technical support","hasDiagram":false,"options":[{"key":"a","text":"(i), (ii), (iv)"},{"key":"b","text":"(i), (ii), (iii), (iv)"},{"key":"c","text":"(ii), (iii), (iv)"},{"key":"d","text":"(ii), (iv)"}],"correctAnswer":"b","explanation":"b) (i), (ii), (iii), (iv)"},{"id":"2026S-Q58","session":"Spring 2026","category":null,"questionNumber":58,"prompt":"When the operation of an information system is outsourced, which of the following is created in order to agree on the quality level for the service to be provided between the outsourcing party and the contractor?","hasDiagram":false,"options":[{"key":"a","text":"ASP"},{"key":"b","text":"ISP"},{"key":"c","text":"RFP"},{"key":"d","text":"SLA"}],"correctAnswer":"d","explanation":"d) SLA"},{"id":"2026S-Q59","session":"Spring 2026","category":null,"questionNumber":59,"prompt":"In order to automatically respond to queries from users of an IT service, it was decided to install a chatbot. Which of the following is the most appropriate management process where such automation by a chatbot is effective?","hasDiagram":false,"options":[{"key":"a","text":"Incident management"},{"key":"b","text":"Configuration management"},{"key":"c","text":"Change management"},{"key":"d","text":"Problem management"}],"correctAnswer":"a","explanation":"a) Incident management"},{"id":"2026S-Q60","session":"Spring 2026","category":null,"questionNumber":60,"prompt":"A satellite office is constructed in a company that promotes telework. Measures to prevent overcurrent caused by lightning strikes were examined. Which of the following is the most appropriate effective measure?","hasDiagram":false,"options":[{"key":"a","text":"Installation of devices supporting green IT"},{"key":"b","text":"Installation of devices supporting surge protection"},{"key":"c","text":"Installation of a wireless LAN router"},{"key":"d","text":"Installation of an uninterruptible power supply"}],"correctAnswer":"b","explanation":"b) Installation of devices supporting surge protection"},{"id":"2026S-Q61","session":"Spring 2026","category":null,"questionNumber":61,"prompt":"In IT service management, which of the following is the case where a person in charge of the service desk entrusts the resolution of a high-difficulty incident reported to the service desk to secondary support with specialized skills?","hasDiagram":false,"options":[{"key":"a","text":"FAQ"},{"key":"b","text":"SLA"},{"key":"c","text":"Escalation"},{"key":"d","text":"Workaround"}],"correctAnswer":"c","explanation":"c) Escalation"},{"id":"2026S-Q62","session":"Spring 2026","category":null,"questionNumber":62,"prompt":"Which of the following is the most appropriate description concerning business improvement for a service desk?","hasDiagram":false,"options":[{"key":"a","text":"Regarding the inquiries that the service desk receives, information such as their content, responses, and time consumed for response, is recorded and analyzed."},{"key":"b","text":"A team is formed that does not present a temporary workaround for inquiries regarding system failures but focuses on investigation of their root cause."},{"key":"c","text":"In order to enable users to make inquiries (function () {

  const RE_MATH = /(^|[^\\A-Za-z0-9$])\$([^$\n]+?)\$(?![A-Za-z0-9$])/g;

  function extractMath(s, store) {
    return s.replace(RE_MATH, (m, pre, tex) => {
      if (/^\s|\s$/.test(tex)) return m;
      store.push(tex);

  function renderTex(tex) {

    const map = { times: "×", rightarrow: "→", leftarrow: "←", Rightarrow: "⇒", leftrightarrow: "↔", checkmark: "✓", div: "÷", le: "≤", leq: "≤", ge: "≥", geq: "≥", ne: "≠", neq: "≠", cdot: "·", pm: "±", infty: "∞", approx: "≈", sqrt: "√" };

    s = s.replace(/\uE001(\d+)\uE001/g, (_, i) => htmlEsc(escs[+i]));
    s = s.replace(/\uE000(\d+)\uE000/g, (_, i) => renderTex(math[+i]));
    return s.replace(/\uE002(\d+)\uE002/g, (_, i) => "<code>" + htmlEsc(code[+i]) + "</code>");
  }

  function plain(src) {
    const math = [], code = [];
    let s = src.replace(/`([^`\n]+)`/g, (_, c) => (code.push(c), "\uE002" + (code.length - 1) + "\uE002"));
    s = extractMath(normalise(s), math);
    s = s.replace(/\*\*(.+?)\*\*/g, "$1").replace(/(^|[^*\\])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1$2");
    s = s.replace(/\\(.)/g, (m, c) => (ESC_CHARS.includes(c) ? c : m));
    s = s.replace(/\uE000(\d+)\uE000/g, (_, i) => texToPlain(math[+i]));
    return s.replace(/\uE002(\d+)\uE002/g, (_, i) => code[+i]);
  }

  const RE_BULLET = /^\s*[*-]\s+/, RE_NUM = /^\s*\d+\.\s+/, RE_TABLE = /^\s*\|/;
  function block(src) {
    const lines = src.split("\n"), out = [];
    let i = 0;
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) { i++; continue; }
      if (RE_TABLE.test(l)) {
        const rows = [];
        while (i < lines.length && RE_TABLE.test(lines[i])) rows.push(lines[i++]);
        out.push(table(rows));
      } else if (RE_BULLET.test(l) || RE_NUM.test(l)) {
        const ordered = RE_NUM.test(l), re = ordered ? RE_NUM : RE_BULLET, items = [];
        while (i < lines.length && re.test(lines[i])) items.push(lines[i++].replace(re, ""));
        const tag = ordered ? "ol" : "ul";
        out.push("<" + tag + ">" + items.map((t) => "<li>" + inline(t) + "</li>").join("") + "</" + tag + ">");
      } else {
        const para = [];
        while (i < lines.length && lines[i].trim() && !RE_TABLE.test(lines[i]) && !RE_BULLET.test(lines[i]) && !RE_NUM.test(lines[i])) para.push(lines[i++]);
        out.push("<p>" + para.map((t) => inline(t.trim())).join("<br>") + "</p>");
      }
    }
    return out.join("");
  }

  function table(rows) {
    const cells = (r) => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
    const body = rows.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r)).map(cells);
    if (!body.length) return "";
    const [head, ...rest] = body;
    return "<table><thead><tr>" + head.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
      rest.map((r) => "<tr>" + r.map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
  }

  const cache = new Map();
  function rendered(q) {
    let r = cache.get(q.id);
    if (!r) {
      r = {
        prompt: block(q.prompt),
        options: q.options.map((o) => inline(o.text)),
        explanation: inline(q.explanation || ""),
        search: ("#" + q.questionNumber + " " + q.id + " " + plain(q.prompt) + " " + q.options.map((o) => plain(o.text)).join(" ")).toLowerCase(),
      };
      cache.set(q.id, r);
    }
    return r;
  }

  // ---------- filtering ----------
  function ordered() {
    if (!state.order) return QS;
    const list = state.order.map((id) => BY_ID.get(id)).filter(Boolean);
    return list.length === QS.length ? list : QS;
  }

  function visible() {
    const f = state.filters, term = f.q.trim().toLowerCase();
    const num = /^#?(\d+)$/.exec(term);
    return ordered().filter((q) => {
      if (f.session && q.session !== f.session) return false;
      const a = state.answers[q.id];
      if (f.status === "unanswered" && a) return false;
      if (f.status === "incorrect" && (!a || a === q.correctAnswer)) return false;
      if (f.status === "bookmarked" && !state.bookmarks[q.id]) return false;
      if (!term) return true;
      if (num) return q.questionNumber === +num[1];
      return rendered(q).search.includes(term);
    });
  }

  // ---------- views ----------
  function quizCard(q) {
    const r = rendered(q), a = state.answers[q.id], revealed = !a && state.revealed[q.id];
    const done = !!a || revealed;
    const status = a ? (a === q.correctAnswer ? '<span class="tag ok">Correct</span>' : '<span class="tag bad">Incorrect</span>') : "";
    const opts = q.options.map((o, i) => {
      let cls = "", mark = "";
      if (done && o.key === q.correctAnswer) { cls = "correct"; mark = "✅"; }
      else if (a && o.key === a) { cls = "wrong"; mark = "❌"; }
      else if (done) cls = "dim";
      return '<button type="button" class="opt ' + cls + '" data-act="pick" data-key="' + o.key + '"' + (done ? " disabled" : "") + ">" +
        '<span class="k">' + o.key + '</span><span class="t">' + r.options[i] + '</span><span class="m">' + mark + "</span></button>";
    }).join("");
    const foot = done
      ? '<button type="button" class="linkbtn" data-act="clear">' + (a ? "Try again" : "Hide answer") + "</button>"
      : '<button type="button" class="linkbtn" data-act="reveal">Reveal answer</button>';
    return '<article class="q" data-id="' + q.id + '">' + head(q, status) +
      '<div class="prompt">' + r.prompt + "</div>" + figNote(q) +
      '<div class="opts">' + opts + "</div>" +
      '<div class="q-foot">' + foot + "</div>" +
      (done && r.explanation ? '<div class="explain"><strong>Answer:</strong> ' + r.explanation + "</div>" : "") +
      "</article>";
  }

  function docCard(q) {
    const r = rendered(q);
    const opts = q.options.map((o, i) => {
      const ok = o.key === q.correctAnswer;
      return '<li class="' + (ok ? "correct" : "") + '">[' + (ok ? "x" : "&nbsp;") + "] " + o.key + ") " + r.options[i] + (ok ? " ✅" : "") + "</li>";
    }).join("");
    return '<article class="q" data-id="' + q.id + '">' + head(q, "") +
      '<div class="prompt">' + r.prompt + "</div>" + figNote(q) +
      '<ul class="doc-opts">' + opts + "</ul>" +
      '<div class="doc-ans"><strong>Answer:</strong> ' + r.explanation + "</div></article>";
  }

  function head(q, status) {
    const bm = !!state.bookmarks[q.id];
    return '<div class="q-head"><span class="q-num">Question ' + q.questionNumber + '</span><span class="tag">' + htmlEsc(q.session || "") + "</span>" + status +
      '<button type="button" class="bm" data-act="bookmark" aria-pressed="' + bm + '" aria-label="Bookmark question ' + q.questionNumber + '" title="Bookmark">' + (bm ? "★" : "☆") + "</button></div>";
  }

  const figNote = (q) => (q.hasDiagram ? '<div class="note-fig">This question refers to a figure, graph or table that is not included in the source.</div>' : "");

  function render() {
    const list = visible(), box = $("#list"), doc = state.view === "doc";
    box.className = doc ? "doc" : "quiz";
    box.innerHTML = list.length ? list.map(doc ? docCard : quizCard).join("") : '<p class="empty">No questions match these filters.</p>';
    $("#count-line").textContent = "Showing " + list.length + " of " + QS.length + " questions" + (state.order ? " · shuffled" : "");
    $("#btn-copy").hidden = !doc || !list.length;
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
    $("#btn-shuffle").setAttribute("aria-pressed", String(!!state.order));
    stats();
  }

  function rerenderCard(id) {
    const el = document.querySelector('.q[data-id="' + id + '"]');
    if (!el) return;
    const q = BY_ID.get(id);
    el.outerHTML = state.view === "doc" ? docCard(q) : quizCard(q);
  }

  function stats() {
    let answered = 0, correct = 0;
    for (const q of QS) {
      const a = state.answers[q.id];
      if (a) { answered++; if (a === q.correctAnswer) correct++; }
    }
    $("#st-answered").textContent = answered + "/" + QS.length;
    $("#st-score").textContent = answered ? Math.round((correct / answered) * 100) + "%" : "–";
    $("#st-remaining").textContent = QS.length - answered;
    $("#progress-bar").style.width = (answered / QS.length) * 100 + "%";
    // Summary for the home page's year cards.
    try { localStorage.setItem("philnits:" + EXAM.year + ":summary", JSON.stringify({ answered, correct, total: QS.length })); } catch (e) {}
  }

  // ---------- copy (document view) ----------
  function copyText(list) {
    return list.map((q) => {
      const opts = q.options.map((o) => (o.key === q.correctAnswer ? "[x] " : "[ ] ") + o.key + ") " + plain(o.text) + (o.key === q.correctAnswer ? " ✅" : "")).join("\n");
      return "Question " + q.questionNumber + " (" + q.session + ")\n" + plain(q.prompt) + "\n\n" + opts + "\n\nAnswer: " + plain(q.explanation || "");
    }).join("\n\n");
  }

  async function copyVisible() {
    const text = copyText(visible());
    try {
      await navigator.clipboard.writeText(text);
      toast("Copied " + visible().length + " questions");
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Copied"); } catch (e2) { toast("Copy failed"); }
      ta.remove();
    }
  }

  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  // ---------- theme ----------
  function currentTheme() {
    return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function themeLabel() { $("#btn-theme").textContent = currentTheme() === "dark" ? "☀ Light" : "☾ Dark"; }

  // ---------- events ----------
  $("#list").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const id = btn.closest(".q").dataset.id;
    const act = btn.dataset.act;
    if (act === "pick") { state.answers[id] = btn.dataset.key; delete state.revealed[id]; }
    else if (act === "reveal") state.revealed[id] = true;
    else if (act === "clear") { delete state.answers[id]; delete state.revealed[id]; }
    else if (act === "bookmark") { if (state.bookmarks[id]) delete state.bookmarks[id]; else state.bookmarks[id] = true; }
    save(); rerenderCard(id); stats();
  });

  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => {
    state.view = b.dataset.view; save(); render();
  }));

  let searchTimer;
  $("#f-search").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.filters.q = e.target.value; save(); render(); }, 120);
  });
  $("#f-session").addEventListener("change", (e) => { state.filters.session = e.target.value; save(); render(); });
  $("#f-status").addEventListener("change", (e) => { state.filters.status = e.target.value; save(); render(); });

  $("#btn-shuffle").addEventListener("click", () => {
    if (state.order) state.order = null;
    else {
      const ids = QS.map((q) => q.id);
      for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
      state.order = ids;
    }
    save(); render(); window.scrollTo({ top: 0 });
  });

  $("#btn-reset").addEventListener("click", () => {
    if (!confirm("Clear all your answers and revealed answers for this exam? Bookmarks are kept.")) return;
    state.answers = {}; state.revealed = {}; state.order = null;
    save(); render(); toast("Progress cleared");
  });

  $("#btn-theme").addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("philnits:theme", next); } catch (e) {}
    themeLabel();
  });

  $("#btn-copy").addEventListener("click", copyVisible);

  // ---------- init ----------
  function init() {
    const sessions = [...new Set(QS.map((q) => q.session).filter(Boolean))];
    $("#f-session").insertAdjacentHTML("beforeend", sessions.map((s) => '<option value="' + htmlEsc(s) + '">' + htmlEsc(s) + "</option>").join(""));
    if (!sessions.includes(state.filters.session)) state.filters.session = "";
    $("#f-search").value = state.filters.q;
    $("#f-session").value = state.filters.session;
    $("#f-status").value = state.filters.status;
    $("#foot").textContent = QS.length + " questions · source: examQA-md · built " + EXAM.generatedAt.slice(0, 10);
    themeLabel();
    render();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
