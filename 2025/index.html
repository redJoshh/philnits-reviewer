:root {

    --ok: #6fd18f; --ok-bg: #13301e; --ok-border: #2f7046;
    --bad: #ff8b8b; --bad-bg: #3a1717; --bad-border: #8a3434;
    --warn: #f0c060; --warn-bg: #33280f; --star: #f2c14e;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --surface-2: #1f242c; --border: #2c333d;
  --text: #e6e9ee; --muted: #9aa4b2; --accent: #7b9cff; --accent-soft: #1e2a4a;
  --ok: #6fd18f; --ok-bg: #13301e; --ok-border: #2f7046;
  --bad: #ff8b8b; --bad-bg: #3a1717; --bad-border: #8a3434;
  --warn: #f0c060; --warn-bg: #33280f; --star: #f2c14e;

}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.55 var(--font);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.topbar {
  position: sticky; top: 0; z-index: 10;

}
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
.topbar .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 0; }
.brand { font-weight: 650; font-size: 1.02rem; margin-right: auto; }
.brand small { display: block; font-weight: 450; color: var(--muted); font-size: .78rem; }
.brand .home { display: block; font-weight: 500; font-size: .78rem; color: var(--accent); text-decoration: none; margin-bottom: 2px; }
.brand .home:hover { text-decoration: underline; }
.stats { display: flex; gap: 16px; font-size: .85rem; color: var(--muted); }
.stats b { color: var(--text); font-variant-numeric: tabular-nums; font-size: .98rem; }
.progress { height: 3px; background: var(--surface-2); }
.progress > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
  padding: 6px 12px; font-size: .88rem; line-height: 1.3; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.danger:hover { color: var(--bad); border-color: var(--bad-border); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: .88rem; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Filters */
.filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 0 6px; }
.filters input[type="search"] { flex: 1 1 240px; min-width: 0; }
.filters input, .filters select {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 10px; font-size: .92rem;
}
.meta-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; padding: 4px 0 12px; flex-wrap: wrap; }

main { padding-bottom: 64px; }

.tag.bad { background: var(--bad-bg); color: var(--bad); }
.bm { margin-left: auto; border: 0; background: none; font-size: 1.25rem; line-height: 1; color: var(--muted); padding: 2px 4px; }

.prompt ul, .prompt ol { margin: .2em 0 .7em; padding-left: 1.4em; }
.prompt table { border-collapse: collapse; margin: .4em 0 .8em; font-size: .9rem; display: block; overflow-x: auto; max-width: 100%; }
.prompt th, .prompt td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
.prompt th { background: var(--surface-2); }
.prompt pre.code {
  margin: .4em 0 .8em; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border);

}
.prompt pre.code code { background: none; padding: 0; font: inherit; }
.note-fig { font-size: .82rem; color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 6px 10px; margin: 4px 0 10px; }
.hint {
  margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--warn);
  background: var(--warn-bg); border-radius: 0 8px 8px 0; font-size: .92rem;
}

.opts { display: grid; gap: 8px; margin-top: 8px; }
.opt {
  display: flex; align-items: flex-start; gap: 10px; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
}
.opt:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt .k {
  flex: none; width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); font-size: .82rem; font-weight: 600;
}
.opt .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .m { flex: none; }
.opt.correct { background: var(--ok-bg); border-color: var(--ok-border); }
.opt.correct .k { background: var(--ok); color: var(--surface); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad-border); }
.opt.wrong .k { background: var(--bad); color: var(--surface); }
.opt.dim { opacity: .62; }

.q-foot { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 2px 0; font-size: .88rem; }
.linkbtn + .linkbtn { margin-left: 12px; }
.explain {
  margin-top: 12px; padding: 10px 12px; border-left: 3px solid var(--ok-border);
  background: var(--surface-2); border-radius: 0 8px 8px 0; font-size: .94rem;
}

/* Document view */
.doc .q { box-shadow: none; padding: 16px 20px; }
.doc .doc-opts { list-style: none; padding: 0; margin: 6px 0 8px; }
.doc .doc-opts li { padding: 2px 0; }
.doc .doc-opts li.correct { font-weight: 600; color: var(--ok); }
.doc .doc-ans { font-size: .94rem; }

.empty { text-align: center; color: var(--muted); padding: 48px 0; }
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); opacity: 0;

.toast.show { opacity: 1; transform: translateX(-50%); }
footer { color: var(--muted); font-size: .8rem; text-align: center; padding: 8px 0 32px; }
.katex { font-size: 1.05em; }
code { font: .92em ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; background: var(--surface-2); border-radius: 4px; padding: 1px 5px; }

@media (max-width: 640px) {
  .stats { gap: 12px; width: 100%; order: 3; }
  .q { padding: 14px 14px; }
  .brand { flex-basis: 100%; }
}
</style>

"key":"d","text":"125/216"}],"correctAnswer":"d","explanation":"d) 125/216"},{"id":"2025S-Q05","session":"Spring 2025","category":null,"questionNumber":5,"prompt":"Which of the following is a term for a list of instructions to a computer that are written in a human-readable programming language?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"PIN code"},{"key":"b","text":"Source code"},{"key":"c","text":"Binary code"},{"key":"d","text":"Character code"}],"correctAnswer":"b","explanation":"b) Source code"},{"id":"2025S-Q06","session":"Spring 2025","category":null,"questionNumber":6,"prompt":"The procedure `calculateElectricBill` receives electricity usage that accepts the units (non-negative value) and returns the amount of electricity bills. The pricing structure is given as: For the first 100 units, the cost is $10 per unit. Any units exceeding 100 are charged at $15 per unit. Which of the following is an appropriate piece of code to be inserted into `_______` in the program?\n\n**[Program]**\n\n```text\ninteger: calculateElectricBill(integer: units)\ninteger: payAmount ← 0\nif (units ≤ 100)\n    payAmount ← units × 10\nelse\n    payAmount ← _______\nendif\nreturn payAmount\n```","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"`(units - 100) × 10 + 100 × 15`"},{"key":"b","text":"`(units - 100) × 15 + 100 × 10`"},{"key":"c","text":"`units × 15`"},{"key":"d","text":"`units × 15 + 100 × 10`"}],"correctAnswer":"b","explanation":"b) `(units - 100) × 15 + 100 × 10`"},{"id":"2025S-Q07","session":"Spring 2025","category":null,"questionNumber":7,"prompt":"A program uses loops to display results based on whether the cycle numbers are odd or even. The execution result of the program is shown below.\n\n```text\n0+0+0+0\n+++++++\n2+2+2+2\n+++++++\n4+4+4+4\n+++++++\n6+6+6+6\n```\n\nWhich of the following is an appropriate combination of pieces of code to be inserted into `___A___` through `___C___` in the program?\n\n**[Program]**\n\n```text\ninteger: i, j\nfor (increase i from 0 to 6 by 1)\n    for (increase j from 0 to 6 by 1)\n        if (____A____)\n            output ____B____\n        else\n            output ____C____\n        endif\n    endfor\n    output a new line\nendfor\n```","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A: `(i mod 2 ≠ 0) and (j mod 2 ≠ 0)` · B: `\"+\"` · C: `i`"},{"key":"b","text":"A: `(i mod 2 ≠ 0) and (j mod 2 ≠ 0)` · B: `i` · C: `\"+\"`"},{"key":"c","text":"A: `(i mod 2 = 0) and (j mod 2 = 0)` · B: `\"+\"` · C: `i`"},{"key":"d","text":"A: `(i mod 2 = 0) and (j mod 2 = 0)` · B: `i` · C: `\"+\"`"}],"correctAnswer":"d","explanation":"d) A: `(i mod 2 = 0) and (j mod 2 = 0)` · B: `i` · C: `\"+\"`"},{"id":"2025S-Q08","session":"Spring 2025","category":null,"questionNumber":8,"prompt":"In the data structure called a queue that is suitable for performing first-in first-out (FIFO) processing, values are stored in the order of “8”, “1”, “6”, and “3”, and then two (2) values are removed consecutively. Which of the following is the last value that is removed?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"1"},{"key":"b","text":"3"},{"key":"c","text":"6"},{"key":"d","text":"8"}],"correctAnswer":"a","explanation":"a) 1"},{"id":"2025S-Q09","session":"Spring 2025","category":null,"questionNumber":9,"prompt":"As shown in Figure 1, there is a box that generates two (2) numerical values B1 and B2 when two (2) positive integers A1 and A2 are entered. B1 has the same value as A2, and B2 is the remainder of A1 divided by A2. In Figure 2, when two (2) boxes are connected, and 49 is entered as A1 and 11 is entered as A2 in the left box, what is the value of B2 generated from the right box?","hasDiagram":true,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"1"},{"key":"b","text":"2"},{"key":"c","text":"4"},{"key":"d","text":"5"}],"correctAnswer":"a","explanation":"a) 1"},{"id":"2025S-Q10","session":"Spring 2025","category":null,"questionNumber":10,"prompt":"Which of the following is an appropriate combination of words that are inserted into A and B in the description below concerning the execution sequence of instructions in a computer?\n\nIn a computer, the instructions are executed in the sequence shown below.\n(1) Refer to the program counter.\n(2) `___A___` the instruction.\n(3) Set the program counter to the main memory address of the next instruction.\n(4) `___B___` the instruction.\n(5) Execute processing according to the instruction.\n(6) Return to (1).","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A: Decode · B: Read"},{"key":"b","text":"A: Read · B: Decode"},{"key":"c","text":"A: Read · B: Write"},{"key":"d","text":"A: Write · B: Decode"}],"correctAnswer":"b","explanation":"b) A: Read · B: Decode"},{"id":"2025S-Q11","session":"Spring 2025","category":null,"questionNumber":11,"prompt":"Which of the following is an appropriate description concerning the primary and secondary cache memory that a CPU is equipped with?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"The primary cache memory has larger capacity than the secondary cache memory."},{"key":"b","text":"The secondary cache memory is slower than the main memory in writing and reading."},{"key":"c","text":"When the CPU reads data, it first accesses the primary cache memory, and then it accesses the secondary cache memory if the data is not available."},{"key":"d","text":"All of the data that is required for a process needs to be present on the primary or secondary cache memory when a program starts."}],"correctAnswer":"c","explanation":"c) When the CPU reads data, it first accesses the primary cache memory, and then it accesses the secondary cache memory if the data is not available."},{"id":"2025S-Q12","session":"Spring 2025","category":null,"questionNumber":12,"prompt":"Which of the following is a type of device that is also used as a memory device in IoT devices, and has a lower power consumption and higher impact resistance than an HDD as it has memory media that is made of semiconductors and does not have any moving components?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"DRM"},{"key":"b","text":"DVD"},{"key":"c","text":"HDMI"},{"key":"d","text":"SSD"}],"correctAnswer":"d","explanation":"d) SSD"},{"id":"2025S-Q13","session":"Spring 2025","category":null,"questionNumber":13,"prompt":"Which of the following is the appropriate description concerning the performance of a CPU?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Between a 32-bit CPU and a 64-bit CPU, the length of data that a 64-bit CPU can process at once can be greater."},{"key":"b","text":"The smaller the amount of cache memory in a CPU, the higher the processing speed of the CPU."},{"key":"c","text":"In CPUs with the same structure, when the clock frequency is decreased, the processing speed increases."},{"key":"d","text":"Between a dual core CPU and a quad core CPU, a dual core CPU can execute a greater number of processes simultaneously."}],"correctAnswer":"a","explanation":"a) Between a 32-bit CPU and a 64-bit CPU, the length of data that a 64-bit CPU can process at once can be greater."},{"id":"2025S-Q14","session":"Spring 2025","category":null,"questionNumber":14,"prompt":"Which of the following is an appropriate characteristic of a dual system?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"It provides two (2) sets of systems that perform the same processing and checks the correctness of the processing by comparing the results. If one of the systems fails, it isolates the failed system and continues the processing."},{"key":"b","text":"The same two (2) devices are used, so that the processing capability can be increased to double that of a simplex system."},{"key":"c","text":"It provides a currently used system for performing online processing and also a backup system that is made on standby while performing batch processing. In the event of a failure in the currently used system, it switches to the backup system, starts the online processing on it, and continues the service."},{"key":"d","text":"It connects multiple devices in series and configures them in such a way that the load of each function is distributed among them, so that processing capability is high. But if any one of the devices fails, it becomes unable to provide the service."}],"correctAnswer":"a","explanation":"a) It provides two (2) sets of systems that perform the same processing and checks the correctness of the processing by comparing the results. If one of the systems fails, it isolates the failed system and continues the processing."},{"id":"2025S-Q15","session":"Spring 2025","category":null,"questionNumber":15,"prompt":"Among the changes A through D in a client/server system, which of the following is the list that contains all and only the appropriate changes for reducing the response time?\n\n- **A:** Establishing a high-speed line between the client and the server, and reducing the time taken to transmit data.\n- **B:** Increasing the number of clients, and reducing the waiting time for users before using clients.\n- **C:** Reducing the time taken for data entry by users on the client’s input screen.\n- **D:** Making the server high-performance, and reducing the server’s processing time.","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A, B, C"},{"key":"b","text":"A, D"},{"key":"c","text":"B, C"},{"key":"d","text":"C, D"}],"correctAnswer":"b","explanation":"b) A, D"},{"id":"2025S-Q16","session":"Spring 2025","category":null,"questionNumber":16,"prompt":"There is a web system that is composed of two (2) web servers and one (1) database server as shown in the figure. When the availability of each Web server is 0.8 and the availability of the Database server is 0.9, which of the following is the availability of this system rounded off to two (2) decimal places? Here, if at least one (1) of the two (2) Web servers are operating and the Database server is operating, it is considered that the system is operating. Also, a fault occurs randomly on each server.","hasDiagram":true,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"0.04"},{"key":"b","text":"0.58"},{"key":"c","text":"0.86"},{"key":"d","text":"0.96"}],"correctAnswer":"c","explanation":"c) 0.86"},{"id":"2025S-Q17","session":"Spring 2025","category":null,"questionNumber":17,"prompt":"Which of the following is an appropriate explanation of multitasking?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Several computers connected via a network work together to achieve a high-performance system."},{"key":"b","text":"Several processor cores composed of arithmetic circuits and other control circuits are implemented in a single CPU."},{"key":"c","text":"The CPU processing time is allocated to several processes in turn so that the processes can be executed concurrently."},{"key":"d","text":"The same processing is performed for multiple data items by executing a single instruction."}],"correctAnswer":"c","explanation":"c) The CPU processing time is allocated to several processes in turn so that the processes can be executed concurrently."},{"id":"2025S-Q18","session":"Spring 2025","category":null,"questionNumber":18,"prompt":"The types of programs that are running when a PC is started are broadly classified into three (3) categories, namely BIOS (Basic Input Output System), OS, and resident application programs. Which of the following is the order of execution of the programs?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"BIOS, OS, resident application programs"},{"key":"b","text":"OS, BIOS, resident application programs"},{"key":"c","text":"OS, resident application programs, BIOS"},{"key":"d","text":"Resident application programs, BIOS, OS"}],"correctAnswer":"a","explanation":"a) BIOS, OS, resident application programs"},{"id":"2025S-Q19","session":"Spring 2025","category":null,"questionNumber":19,"prompt":"Multiple files stored on a hard disk are used in work, from Monday to Friday. In order to handle failure of the hard disk, the data is backed up to another hard disk after the end of each day’s work. When the backup has following conditions, what is the total time required (in minutes) to perform backups of data from Monday to Friday?\n\n**[Conditions for backups]**\n\n1. There are 6,000 files used in work, each with a size of 3 Mbytes.\n2. In each day’s work, 1,000 files are modified. Modifications do not change the size of the files.\n3. Files are copied to the other hard disk at a speed of 10 Mbytes/second. One (1) file is backed up at a time; backup continues without interruption.\n4. From Monday to Thursday, only files modified that day are backed up. On Friday, all files are backed up, whether or not they have been modified.","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"25"},{"key":"b","text":"35"},{"key":"c","text":"50"},{"key":"d","text":"150"}],"correctAnswer":"c","explanation":"c) 50"},{"id":"2025S-Q20","session":"Spring 2025","category":null,"questionNumber":20,"prompt":"Spreadsheet software is to be used to perform a calculation with the monthly sales data for each product shown in the worksheet below. When the expression `COUNTIF(B2:D2, \">15000\")` is entered in cell E2 and then copied to cell E3 and cell E4, which of the following is the value that is displayed in cell E4?\n\n|       | A            | B             | C              | D           | E                 |\n| ----- | ------------ | ------------- | -------------- | ----------- | ----------------- |\n| **1** | Product name | January sales | February sales | March sales | Conditional count |\n| **2** | Product A    | 10,000        | 15,000         | 20,000      |                   |\n| **3** | Product B    | 5,000         | 10,000         | 5,000       |                   |\n| **4** | Product C    | 10,000        | 20,000         | 30,000      |                   |","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"0"},{"key":"b","text":"1"},{"key":"c","text":"2"},{"key":"d","text":"3"}],"correctAnswer":"c","explanation":"c) 2"},{"id":"2025S-Q21","session":"Spring 2025","category":null,"questionNumber":21,"prompt":"Which of the following is an Open Source Software (OSS) OS that is used in mobile devices such as smartphones and tablets?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Android"},{"key":"b","text":"iOS"},{"key":"c","text":"Safari"},{"key":"d","text":"Windows"}],"correctAnswer":"a","explanation":"a) Android"},{"id":"2025S-Q22","session":"Spring 2025","category":null,"questionNumber":22,"prompt":"In document creation software, spreadsheet software, and other such software, which of the following is a function that predefines and executes a series of operation procedures?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Autocomplete"},{"key":"b","text":"Source code"},{"key":"c","text":"Plug and play"},{"key":"d","text":"Macro"}],"correctAnswer":"d","explanation":"d) Macro"},{"id":"2025S-Q23","session":"Spring 2025","category":null,"questionNumber":23,"prompt":"Which of the following is a space-saving server where computer components including the CPU, main memory, and storage are installed on a single circuit board and multiple circuit boards are mounted in racks?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"DNS server"},{"key":"b","text":"FTP server"},{"key":"c","text":"Web server"},{"key":"d","text":"Blade server"}],"correctAnswer":"d","explanation":"d) Blade server"},{"id":"2025S-Q24","session":"Spring 2025","category":null,"questionNumber":24,"prompt":"Which of the following is a technology that projects things such as video made with computer graphics on to buildings, objects, and other such three-dimensional things, and produces a variety of visual effects?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Digital signage"},{"key":"b","text":"Virtual reality"},{"key":"c","text":"Projection mapping"},{"key":"d","text":"Polygon"}],"correctAnswer":"c","explanation":"c) Projection mapping"},{"id":"2025S-Q25","session":"Spring 2025","category":null,"questionNumber":25,"prompt":"Which of the following is a data format that can be used to compress both video and audio data?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"BMP"},{"key":"b","text":"GIF"},{"key":"c","text":"JPEG"},{"key":"d","text":"MPEG"}],"correctAnswer":"d","explanation":"d) MPEG"},{"id":"2025S-Q26","session":"Spring 2025","category":null,"questionNumber":26,"prompt":"By joining tables “Employees in charge”, “Regions”, and “Customers” that are managed in a relational database, the table A that is shown below is obtained. Which of the following is the table “Customers” that is used for the joining? Here, a solid underline indicates a primary key and a dotted underline indicates a foreign key.\n\n**Table A (Joined Result):** Customer code, Customer name, Employee name, Region name, Representative name","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Customer code, Customer name, Representative name"},{"key":"b","text":"Customer code, Customer name, Representative name, Employee code"},{"key":"c","text":"Customer code, Customer name, Representative name, Region code"},{"key":"d","text":"Customer code, Customer name, Representative name, Employee code, Region code"}],"correctAnswer":"d","explanation":"d) Customer code, Customer name, Representative name, Employee code, Region code"},{"id":"2025S-Q27","session":"Spring 2025","category":null,"questionNumber":27,"prompt":"Which of the following is an appropriate purpose of conducting data normalization when a relational database is constructed?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Providing redundancy to data in order to detect data errors"},{"key":"b","text":"Eliminating data inconsistencies and duplications in order to make it easy to maintain and manage the data"},{"key":"c","text":"Unifying the character code of data in order to improve data reliability and storage efficiency"},{"key":"d","text":"Losslessly compressing data in order to improve access efficiency"}],"correctAnswer":"b","explanation":"b) Eliminating data inconsistencies and duplications in order to make it easy to maintain and manage the data"},{"id":"2025S-Q28","session":"Spring 2025","category":null,"questionNumber":28,"prompt":"An “Employee” table and a “Department” table that are to be managed with a relational database were created on the basis of the conditions (i) through (v). Which of the following is the most appropriate primary key for the “Employee” table?\n\n**[Conditions]**\n(i) Each employee has one (1) employee number that is not duplicated.\n(ii) There can be employees with the same first name and family name.\n(iii) Each department has one (1) department code that is not duplicated.\n(iv) Each department has multiple employees.\n(v) Each employee belongs to only one (1) department.","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"“EmployeeNumber”"},{"key":"b","text":"“EmployeeNumber” and “DepartmentCode”"},{"key":"c","text":"“EmployeeName”"},{"key":"d","text":"“DepartmentCode”"}],"correctAnswer":"a","explanation":"a) “EmployeeNumber”"},{"id":"2025S-Q29","session":"Spring 2025","category":null,"questionNumber":29,"prompt":"Which of the following is the appropriate description concerning transaction processing?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Commit is the reversion of a database to the status prior to the start of the transaction when a transaction is not processed successfully."},{"key":"b","text":"Exclusive control is the confirmation of the content of a database when a transaction is processed successfully."},{"key":"c","text":"Rollback ensures that there are no inconsistencies in data when multiple transactions attempt to update data simultaneously."},{"key":"d","text":"Log is a file that records transaction history of a database."}],"correctAnswer":"d","explanation":"d) Log is a file that records transaction history of a database."},{"id":"2025S-Q30","session":"Spring 2025","category":null,"questionNumber":30,"prompt":"Three (3) PCs and an Internet-capable TV (television) set are to be connected to the Internet by using a hub and a router that has a firewall function. Which of the following is an appropriate connection that enables the firewall function of the router to be used for all the traffic between the devices and the Internet? Here, “FW” in each figure indicates the firewall function.","hasDiagram":true,"figureMissing":true,"figureHint":"Figure A is the correct connection: the three PCs and the TV all connect to the hub, and the hub reaches the Internet only through the router with the FW function, so every packet between a device and the Internet passes through the firewall. In the other figures, some device or link reaches the Internet without going through the router, so its traffic bypasses the firewall.","options":[{"key":"a","text":"[Figure A]"},{"key":"b","text":"[Figure B]"},{"key":"c","text":"[Figure C]"},{"key":"d","text":"[Figure D]"}],"correctAnswer":"a","explanation":"a) [Figure A]"},{"id":"2025S-Q31","session":"Spring 2025","category":null,"questionNumber":31,"prompt":"Which of the following is the appropriate role of a DNS in a network?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"In response to a request from a client for the allocation of an IP address, it allocates an unused IP address from a pool of IP addresses."},{"key":"b","text":"It receives requests for file transfers from clients and transfers files to clients, and stores files that it receives from clients."},{"key":"c","text":"It links domain names to IP addresses."},{"key":"d","text":"It receives a request for retrieval from an e-mail recipient and transfers e-mail received by a mail server."}],"correctAnswer":"c","explanation":"c) It links domain names to IP addresses."},{"id":"2025S-Q32","session":"Spring 2025","category":null,"questionNumber":32,"prompt":"Which of the following is an appropriate example of an IPv4 IP address that is assigned to a PC?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"00.00.11.aa.bb.cc"},{"key":"b","text":"050-1234-5678"},{"key":"c","text":"10.123.45.67"},{"key":"d","text":"http://www.example.co.jp/"}],"correctAnswer":"c","explanation":"c) 10.123.45.67"},{"id":"2025S-Q33","session":"Spring 2025","category":null,"questionNumber":33,"prompt":"Mr. A sent an e-mail to the three (3) people Mr. P, Mr. Q, and Mr. R. He entered Mr. P’s e-mail address in the To field, Mr. Q’s e-mail address in the CC field, and Mr. R’s e-mail address in the BCC field. Which of the following is the appropriate description concerning the three (3) recipients of the e-mail?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Mr. P and Mr. Q can see that the same e-mail was also sent to Mr. R."},{"key":"b","text":"Mr. P cannot see that the same e-mail was also sent to Mr. Q."},{"key":"c","text":"Mr. Q can see that the same e-mail was also sent to Mr. P."},{"key":"d","text":"Mr. R cannot see that the same e-mail was also sent to Mr. P and Mr. Q."}],"correctAnswer":"c","explanation":"c) Mr. Q can see that the same e-mail was also sent to Mr. P."},{"id":"2025S-Q34","session":"Spring 2025","category":null,"questionNumber":34,"prompt":"Which of the following is a technology that is used to make voice calls over the Internet by two (2) parties using the same application on their smartphones or other devices?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"MVNO"},{"key":"b","text":"NFC"},{"key":"c","text":"NTP"},{"key":"d","text":"VoIP"}],"correctAnswer":"d","explanation":"d) VoIP"},{"id":"2025S-Q35","session":"Spring 2025","category":null,"questionNumber":35,"prompt":"Among descriptions A through D concerning how to conduct information security education to employees, which of the following contains all and only the appropriate descriptions?\n\n- **A:** The re-education of one who has committed an information security breach includes preventive actions to avoid the same fault being repeated.\n- **B:** One way to conduct it is to incorporate it in a training program for new employees.\n- **C:** It is restricted to employees in the information systems department.\n- **D:** It is conducted after an incident or an accident concerning information security as well as on a regular basis.","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A, B, D"},{"key":"b","text":"A, C, D"},{"key":"c","text":"A, D"},{"key":"d","text":"B, C"}],"correctAnswer":"a","explanation":"a) A, B, D"},{"id":"2025S-Q36","session":"Spring 2025","category":null,"questionNumber":36,"prompt":"Among the descriptions A through D of how to handle a contact list that includes customer names, addresses, and other information, which of the following contains all and only the appropriate descriptions in terms of personal information protection?\n\n- **A:** Even if a customer asks to check his/her own registration information, this cannot be disclosed on the grounds of information protection.\n- **B:** A list of all names and addresses is extracted from the contact list and is sent to all the customers to have them check for errors.\n- **C:** A CD-ROM that includes contact list data is to be shredded before it is discarded.\n- **D:** Contact list data is to be encrypted when it is stored in a file.","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A, C, D"},{"key":"b","text":"A, D"},{"key":"c","text":"B, C"},{"key":"d","text":"C, D"}],"correctAnswer":"d","explanation":"d) C, D"},{"id":"2025S-Q37","session":"Spring 2025","category":null,"questionNumber":37,"prompt":"Among the threats and vulnerabilities in information security, which of the following is a vulnerability?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Computer virus"},{"key":"b","text":"Social engineering"},{"key":"c","text":"Tapping of communications data"},{"key":"d","text":"Inappropriate password management"}],"correctAnswer":"d","explanation":"d) Inappropriate password management"},{"id":"2025S-Q38","session":"Spring 2025","category":null,"questionNumber":38,"prompt":"Which of the following is an appropriate disposal method for media that stores confidential information to ensure that information leakage does not occur?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"CDs and DVDs are destroyed and then are disposed of."},{"key":"b","text":"A PC is disposed of with its CPU being destroyed."},{"key":"c","text":"USB memory is disposed of with its files and folders being deleted."},{"key":"d","text":"Paper documentation is not reused as memo paper and is sealed in a confidential envelope and then is disposed of together with general trash."}],"correctAnswer":"a","explanation":"a) CDs and DVDs are destroyed and then are disposed of."},{"id":"2025S-Q39","session":"Spring 2025","category":null,"questionNumber":39,"prompt":"Which of the following is a term for software that encrypts files on a computer in order to make them unusable, and demands money or other valuables in exchange for the decryption key?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Keylogger"},{"key":"b","text":"Ransomware"},{"key":"c","text":"Rootkit"},{"key":"d","text":"Worm"}],"correctAnswer":"b","explanation":"b) Ransomware"},{"id":"2025S-Q40","session":"Spring 2025","category":null,"questionNumber":40,"prompt":"Which of the following is an appropriate example of biometric authentication?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Authentication with a fingerprint"},{"key":"b","text":"Authentication with a digital certificate"},{"key":"c","text":"Authentication with a personal ID card"},{"key":"d","text":"Authentication with a one-time password"}],"correctAnswer":"a","explanation":"a) Authentication with a fingerprint"},{"id":"2025S-Q41","session":"Spring 2025","category":null,"questionNumber":41,"prompt":"During the use of a PC in workplace, a message was displayed stating that antivirus software had detected a virus. Which of the following is an appropriate action that should be taken immediately?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Reboot of the PC"},{"key":"b","text":"Notification to the workplace by e-mail from the PC"},{"key":"c","text":"Disconnection of the PC from networks"},{"key":"d","text":"Backup of files on the PC"}],"correctAnswer":"c","explanation":"c) Disconnection of the PC from networks"},{"id":"2025S-Q42","session":"Spring 2025","category":null,"questionNumber":42,"prompt":"There is an IoT system that is composed of IoT devices and an IoT server that manages them. Which of the following is the appropriate combination of information security incidents (i) through (iii) in this system, and confidentiality, integrity, and availability that are compromised because of the incidents?\n\n**[Incident]**\n\n- (i) An IoT device stopped working because its battery ran out.\n- (ii) Communication between the IoT devices and the IoT server was not encrypted, so an information leakage occurred.\n- (iii) Incorrect data was recorded because of a system fault.","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"(i): Availability · (ii): Integrity · (iii): Confidentiality"},{"key":"b","text":"(i): Availability · (ii): Confidentiality · (iii): Integrity"},{"key":"c","text":"(i): Integrity · (ii): Availability · (iii): Confidentiality"},{"key":"d","text":"(i): Confidentiality · (ii): Availability · (iii): Integrity"}],"correctAnswer":"b","explanation":"b) (i): Availability · (ii): Confidentiality · (iii): Integrity"},{"id":"2025S-Q43","session":"Spring 2025","category":null,"questionNumber":43,"prompt":"In the activities of an organization that runs an ISMS on the basis of the PDCA cycle, improvements and corrective measures are decided from the results of monitoring of the risk management activities and other such information. In which process of the PDCA cycle is this activity performed?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"P (Plan)"},{"key":"b","text":"D (Do)"},{"key":"c","text":"C (Check)"},{"key":"d","text":"A (Act)"}],"correctAnswer":"d","explanation":"d) A (Act)"},{"id":"2025S-Q44","session":"Spring 2025","category":null,"questionNumber":44,"prompt":"When risk treatment in risk management for information security is divided into the four (4) categories of risk avoidance, risk sharing, risk mitigation, and risk retention, which of the following is the appropriate explanation of risk sharing?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Halting activities that involve risk and fundamentally eliminating risk factors, for example, by not handling personal information."},{"key":"b","text":"Implementing measures to reduce the probability of risk occurrence and reduce damage, such as distributing a data center over multiple locations that are geographically far away from each other in preparation for a disaster."},{"key":"c","text":"Reducing damage that may occur when a risk materializes by transferring or distributing risk to a separate organization on the basis of an agreement, such as the purchasing of an insurance policy."},{"key":"d","text":"If the probability of risk occurrence or the damage in the event of occurrence is considered to be small, recognizing the risk, and then accepting it without taking any particular measures."}],"correctAnswer":"c","explanation":"c) Reducing damage that may occur when a risk materializes by transferring or distributing risk to a separate organization on the basis of an agreement, such as the purchasing of an insurance policy."},{"id":"2025S-Q45","session":"Spring 2025","category":null,"questionNumber":45,"prompt":"Which of the following is an appropriate description concerning user authentication of a system?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A mechanism that achieves login to multiple servers, applications, and other such things with a single authentication is called challenge-response authentication."},{"key":"b","text":"A mechanism that authenticates a user by using fingerprints, voice prints, and other characteristics of a body is called single sign-on."},{"key":"c","text":"A code number that is used in order to authenticate a user of an information system is called a PIN."},{"key":"d","text":"A method where, instead of the order of specific numbers or characters, the positions in a grid are memorized, and during authentication, a person enters the numbers and characters in the positions that he/she remembers in a grid that is displayed on the screen is called multi-factor authentication."}],"correctAnswer":"c","explanation":"c) A code number that is used in order to authenticate a user of an information system is called a PIN."},{"id":"2025S-Q46","session":"Spring 2025","category":null,"questionNumber":46,"prompt":"Mr. A, a participant in system testing, has no access to the design of the internal structure of the system or software and prepares input data and output data to be used in verification of the transaction functions commonly used in the department. Which of the following is the testing technique that Mr. A is going to implement?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Inspection"},{"key":"b","text":"Walk-through"},{"key":"c","text":"Black-box testing"},{"key":"d","text":"White-box testing"}],"correctAnswer":"c","explanation":"c) Black-box testing"},{"id":"2025S-Q47","session":"Spring 2025","category":null,"questionNumber":47,"prompt":"The processes of system development include system requirements definition, systems architecture design, system integration testing, and software acceptance. Which of the following is an activity that is performed in system requirements definition?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"The party to which development is outsourced uses the software under the same conditions as the actual production environment in order to determine if it runs correctly."},{"key":"b","text":"A system test plan is created, and a test environment is prepared."},{"key":"c","text":"The functions and performance required of the system are clarified."},{"key":"d","text":"A program is created and test results are reviewed according to the evaluation criteria."}],"correctAnswer":"c","explanation":"c) The functions and performance required of the system are clarified."},{"id":"2025S-Q48","session":"Spring 2025","category":null,"questionNumber":48,"prompt":"What is the term for revising and changing programs after system development?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Computerization planning"},{"key":"b","text":"System operation"},{"key":"c","text":"Software maintenance"},{"key":"d","text":"Requirements definition"}],"correctAnswer":"c","explanation":"c) Software maintenance"},{"id":"2025S-Q49","session":"Spring 2025","category":null,"questionNumber":49,"prompt":"Which of the following is the most appropriate description concerning the usability of RPA software when the quality characteristics of software are classified into portability, functional suitability, compatibility, usability, reliability, performance efficiency, security, and maintainability?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"It operates even if the OS of the PC that RPA runs on changes."},{"key":"b","text":"Automatic processing is executed at the time and on the conditions that are specified with RPA."},{"key":"c","text":"Even if the version of the application software that is the subject of operation by RPA is upgraded, RPA will work with a simple change of the settings."},{"key":"d","text":"People who have never used RPA can use it with only simple education."}],"correctAnswer":"d","explanation":"d) People who have never used RPA can use it with only simple education."},{"id":"2025S-Q50","session":"Spring 2025","category":null,"questionNumber":50,"prompt":"Which of the following is the most appropriate case example of DevOps in software development?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"The developer prepares a prototype of important functions, and evaluates its adequacy by measuring the performance together with the customer."},{"key":"b","text":"The developer moves on to the next development phase only after it is judged that the current phase is complete, and handovers the system to the operation side only after the system test where users participating in a system test confirm the operability."},{"key":"c","text":"The developer and the operator work in close cooperation and quickly proceed with the implementation and update of functions, etc., by using automation tools and other such tools."},{"key":"d","text":"The programs are added one by one while fixed short-period cycles are repeated in order to expand the functions in the development of a system."}],"correctAnswer":"c","explanation":"c) The developer and the operator work in close cooperation and quickly proceed with the implementation and update of functions, etc., by using automation tools and other such tools."},{"id":"2025A-Q01","session":"Autumn 2025","category":null,"questionNumber":1,"prompt":"Which of the following is always true for two (2) sets A and B?\n\nHere, (X ∩ Y) represents the set that contains only the elements that are in both X and Y (intersection set), and (X ∪ Y) represents the set that contains all of the elements that are in at least one of X or Y (union set).","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"(A ∩ B) is a subset of the complement of (A ∪ B)."},{"key":"b","text":"(A ∪ B) is a subset of A."},{"key":"c","text":"(A ∩ B) is a subset of (A ∪ B)."},{"key":"d","text":"(A ∪ B) is a subset of the complement of A."}],"correctAnswer":"c","explanation":"c) (A ∩ B) is a subset of (A ∪ B)."},{"id":"2025A-Q02","session":"Autumn 2025","category":null,"questionNumber":2,"prompt":"Which of the following is the binary number that is obtained by adding the binary numbers 01011010 and 01101011?\n\nHere, the binary numbers are expressed as positive 8-bit values.","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"00110001"},{"key":"b","text":"01111011"},{"key":"c","text":"10000100"},{"key":"d","text":"11000101"}],"correctAnswer":"d","explanation":"d) 11000101"},{"id":"2025A-Q03","session":"Autumn 2025","category":null,"questionNumber":3,"prompt":"Which of the following is the combination of the mean and median of the data?\n\n**[Data]** 10, 20, 20, 20, 40, 50, 100, 440, 2000","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Mean: 20 · Median: 40"},{"key":"b","text":"Mean: 40 · Median: 20"},{"key":"c","text":"Mean: 300 · Median: 20"},{"key":"d","text":"Mean: 300 · Median: 40"}],"correctAnswer":"d","explanation":"d) Mean: 300 · Median: 40"},{"id":"2025A-Q04","session":"Autumn 2025","category":null,"questionNumber":4,"prompt":"Which of the following is the appropriate description concerning the prefix of the International System of Units (SI) that is used to indicate CPU clock frequency, communication speed, and other such things?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"G multiplied by 10 to the power of 6 is T."},{"key":"b","text":"M multiplied by 10 to the power of 3 is G."},{"key":"c","text":"M multiplied by 10 to the power of 6 is G."},{"key":"d","text":"T multiplied by 10 to the power of 3 is G."}],"correctAnswer":"b","explanation":"b) M multiplied by 10 to the power of 3 is G."},{"id":"2025A-Q05","session":"Autumn 2025","category":null,"questionNumber":5,"prompt":"There is a desk that can hold at most four (4) files. On this desk, six (6) files A through F are used for a job. When the fifth file needs to be put on the desk, the file with the longest time since the last use among the four (4) will be put in a drawer. If the files are put on the desk and referenced in order of A, B, C, D, E, C, B, D, F, B, which of the following is the last file to be put in the drawer?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A"},{"key":"b","text":"B"},{"key":"c","text":"D"},{"key":"d","text":"E"}],"correctAnswer":"d","explanation":"d) E"},{"id":"2025A-Q06","session":"Autumn 2025","category":null,"questionNumber":6,"prompt":"At a certain company, employees get a medical allowance equal to 5% of their monthly base salary in addition to their monthly base salary. If the total of the monthly base salary and medical allowance is more than 5,000, a 20% tax is deducted from the total. In the program below, the function `calculateTotalSal` receives the monthly base salary as an argument and returns the monthly total salary after tax deduction. Which of the following is the correct combination of pieces of code to be inserted into **_A_** and **_B_** in the program? Here, the monthly base salary is a multiple of 100.\n\n**[Program]**\n\n```text\ninteger: calculateTotalSal(integer: monthlyBaseSal)\ninteger: monthlyTotalSal\nmonthlyTotalSal ← integer part of (monthlyBaseSal × 1.05)\nif (monthlyTotalSal > ___A___)\n    monthlyTotalSal ← integer part of (monthlyTotalSal × ___B___)\nendif\nreturn monthlyTotalSal\n```","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A: 5000 · B: 0.2"},{"key":"b","text":"A: 5000 · B: 0.8"},{"key":"c","text":"A: 5250 · B: 0.2"},{"key":"d","text":"A: 5250 · B: 0.8"}],"correctAnswer":"b","explanation":"b) A: 5000 · B: 0.8"},{"id":"2025A-Q07","session":"Autumn 2025","category":null,"questionNumber":7,"prompt":"Which of the following is the appropriate way for extracting data from a stack that stores multiple data?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Data is extracted from an arbitrary location that is specified, regardless of the sequence that data is stored in."},{"key":"b","text":"Data that was stored last is extracted first."},{"key":"c","text":"Data that was stored first is extracted first."},{"key":"d","text":"Data has a key, and it is extracted according to the priority of the key."}],"correctAnswer":"b","explanation":"b) Data that was stored last is extracted first."},{"id":"2025A-Q08","session":"Autumn 2025","category":null,"questionNumber":8,"prompt":"In the program below, the function `subTotal` receives an integer array `inputarr` as an argument, returns an array `arr` in which the sum of all elements of original array `inputarr` up to that location is stored in the same location. Which of the following is the correct combination of pieces of code to be inserted into **_A_** and **_B_** in the program? Here, the size of the array `inputarr` is greater than 1, and elements outside the bounds of the array must not be accessed, and the array index starts at 1.\n\n**[Program]**\n\n```text\ninteger[]: subTotal(integer[]: inputarr)\ninteger: i\ninteger: n ← the number of elements in inputarr\ninteger[]: arr ← {0, ..., 0} // Number of elements is n. All the elements of the array are 0.\narr[1] ← inputarr[1]\nfor (increase i from ___A___ to n by 1)\n    arr[i] ← inputarr[i] + ___B___\nendfor\nreturn arr\n```","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A: 1 · B: arr[i + 1]"},{"key":"b","text":"A: 1 · B: arr[i - 1]"},{"key":"c","text":"A: 2 · B: arr[i + 1]"},{"key":"d","text":"A: 2 · B: arr[i - 1]"}],"correctAnswer":"d","explanation":"d) A: 2 · B: arr[i - 1]"},{"id":"2025A-Q09","session":"Autumn 2025","category":null,"questionNumber":9,"prompt":"Which of the following is the explanation of a characteristic of hypertext?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"It has a function for the creation and editing of a range of expressions."},{"key":"b","text":"It has a function for the creation and editing of a range of shapes."},{"key":"c","text":"It provides a range of templates, and enables their use."},{"key":"d","text":"It has a mechanism that enables relevant information to be accessed by embedding a link in any position in a text."}],"correctAnswer":"d","explanation":"d) It has a mechanism that enables relevant information to be accessed by embedding a link in any position in a text."},{"id":"2025A-Q10","session":"Autumn 2025","category":null,"questionNumber":10,"prompt":"Which of the following is designed to virtually reduce the time for the CPU to access the main memory, in order to improve the processing efficiency of a PC?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"SSD"},{"key":"b","text":"Virtual memory"},{"key":"c","text":"Cache memory"},{"key":"d","text":"Defragmentation"}],"correctAnswer":"c","explanation":"c) Cache memory"},{"id":"2025A-Q11","session":"Autumn 2025","category":null,"questionNumber":11,"prompt":"Which of the following is the most appropriate description concerning a compatible CPU?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"It can run the same OS or the application software that can be run on the original CPU."},{"key":"b","text":"It must not be developed nor manufactured as long as the patents of the original CPU are valid."},{"key":"c","text":"A compatible CPU for single-core CPU has been developed, while one for multi-core CPU does not exist."},{"key":"d","text":"It is a CPU that is intended to improve the performance of an outdated PC, and is not adopted for a new model of PC."}],"correctAnswer":"a","explanation":"a) It can run the same OS or the application software that can be run on the original CPU."},{"id":"2025A-Q12","session":"Autumn 2025","category":null,"questionNumber":12,"prompt":"In the description below concerning the connection between a PC and a peripheral device, which of the following is the appropriate combination of words to be inserted into blanks A and B?\n\n\"The connection of a new peripheral device to a PC requires ( **_A_** ), but if a peripheral device that supports ( **_B_** ) function is connected, the ( **_A_** ) is installed automatically and the device can be used.\"","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A: device driver · B: plug and play"},{"key":"b","text":"A: device driver · B: plugin"},{"key":"c","text":"A: malware · B: plug and play"},{"key":"d","text":"A: malware · B: plugin"}],"correctAnswer":"a","explanation":"a) A: device driver · B: plug and play"},{"id":"2025A-Q13","session":"Autumn 2025","category":null,"questionNumber":13,"prompt":"There is an IoT system that automatically opens and closes the water gate for a rice field by measuring the water level in the rice field. Which of the following is the appropriate combination of terms to be inserted into blanks A and B in the figure?\n\n- Water level in the rice field → [ **A** ] → IoT gateway → IoT server (Analyzes the received water level data and issues instructions for opening and closing the water gate) → [ **B** ] → Water gate in the rice field.","hasDiagram":true,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A: Actuator · B: IoT gateway"},{"key":"b","text":"A: Actuator · B: Sensor"},{"key":"c","text":"A: Sensor · B: IoT gateway"},{"key":"d","text":"A: Sensor · B: Actuator"}],"correctAnswer":"d","explanation":"d) A: Sensor · B: Actuator"},{"id":"2025A-Q14","session":"Autumn 2025","category":null,"questionNumber":14,"prompt":"The system configurations A through C are made up by connecting multiple identical devices. Which of the following is the list where A through C are sorted in descending order of availability? Here, □ represents a device. The parallel connection requires only one (1) of the devices to be functional, while the series connection requires all devices to be functional.","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A, B, C"},{"key":"b","text":"B, A, C"},{"key":"c","text":"C, A, B"},{"key":"d","text":"C, B, A"}],"correctAnswer":"d","explanation":"d) C, B, A"},{"id":"2025A-Q15","session":"Autumn 2025","category":null,"questionNumber":15,"prompt":"When the processing speed of the system overall is constrained because of slow processing speed in one of the components, which of the following is the term for the component that is causing the problem?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Throughput"},{"key":"b","text":"Defragmentation"},{"key":"c","text":"Flowchart"},{"key":"d","text":"Bottleneck"}],"correctAnswer":"d","explanation":"d) Bottleneck"},{"id":"2025A-Q16","session":"Autumn 2025","category":null,"questionNumber":16,"prompt":"Among the descriptions A through C below concerning the effects that are obtained by simultaneously running multiple virtual servers on one (1) physical computer, which of the following lists all and only the appropriate descriptions?\n\n- **A:** Each virtual server can run an OS with a different version, and the resources of the physical computer can be utilized effectively.\n- **B:** The throughput that is gained when the number of virtual servers is increased is the same as when the number of physical computers is increased by the same number.\n- **C:** A volume of data that is the same as the capacity of the HDD on the physical computer can be simultaneously recorded on all of the virtual servers.","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A"},{"key":"b","text":"A, C"},{"key":"c","text":"B"},{"key":"d","text":"C"}],"correctAnswer":"a","explanation":"a) A"},{"id":"2025A-Q17","session":"Autumn 2025","category":null,"questionNumber":17,"prompt":"Which of the following is the appropriate explanation of a deadlock?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"It is a state in which the processes of a computer are prohibited from getting any access including accidental access to information that must not be accessed."},{"key":"b","text":"It is a state in which, if the login attempt of a user fails more than a predefined number of times, the user is prohibited from logging in to the computer for a predefined time period or until the system administrator resets the user account."},{"key":"c","text":"It is a state in which, when common resources are exclusively used, two or more processes are endlessly waiting for each other to release the resources they are occupying."},{"key":"d","text":"It is a state in which processes in the ready state under a multi-programming environment have used up the CPU time allocated by the OS."}],"correctAnswer":"c","explanation":"c) It is a state in which, when common resources are exclusively used, two or more processes are endlessly waiting for each other to release the resources they are occupying."},{"id":"2025A-Q18","session":"Autumn 2025","category":null,"questionNumber":18,"prompt":"In a web server, five (5) directories have a hierarchical structure as shown in the figure below. In an HTML document stored in directory B, which of the following references the file `img.jpg` stored in the directory E?\n\n_(Method of referencing: \"/\" separates directories, \".\" is current directory, \"..\" is one level above, starting with \"/\" omits root, not starting with special chars omits \"./\")_","hasDiagram":true,"figureMissing":true,"figureHint":"In the figure, directories B and D sit side by side in the same parent directory, and E is inside D. From the HTML document in B, `..` moves up to that parent, then `D/E/img.jpg` goes down into D and E: `../D/E/img.jpg` (b).","options":[{"key":"a","text":"`../A/D/E/img.jpg`"},{"key":"b","text":"`../D/E/img.jpg`"},{"key":"c","text":"`./A/D/E/img.jpg`"},{"key":"d","text":"`./D/E/img.jpg`"}],"correctAnswer":"b","explanation":"b) `../D/E/img.jpg`"},{"id":"2025A-Q19","session":"Autumn 2025","category":null,"questionNumber":19,"prompt":"There is a system where a full backup is made after closing time every Sunday, and an incremental backup is made after closing time on Monday through Saturday. On a Wednesday, a failure happened during business hours, so a decision was made to restore data to the state at the closing time on Tuesday by using backup files. Which of the following lists all and only the necessary backup files for restoring data?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A full backup file on Sunday, incremental backup files on Monday and Tuesday"},{"key":"b","text":"A full backup file on Sunday, an incremental backup file on Tuesday"},{"key":"c","text":"Incremental backup files on Monday and Tuesday"},{"key":"d","text":"An incremental backup file on Tuesday"}],"correctAnswer":"a","explanation":"a) A full backup file on Sunday, incremental backup files on Monday and Tuesday"},{"id":"2025A-Q20","session":"Autumn 2025","category":null,"questionNumber":20,"prompt":"Which of the following is the appropriate description concerning Open Source Software (OSS)?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Source code can be edited and then redistributed."},{"key":"b","text":"Source code is free of charge, but maintenance and support are charged."},{"key":"c","text":"Copyrights are waived, so it can be used without permission."},{"key":"d","text":"If the copyright is not waived, the operability must be warranted."}],"correctAnswer":"a","explanation":"a) Source code can be edited and then redistributed."},{"id":"2025A-Q21","session":"Autumn 2025","category":null,"questionNumber":21,"prompt":"Spreadsheet software is used to predict sales according to the weather. The probability for the weather type (sunny, cloudy, rainy) on the day to be predicted and the predicted sales amount by weather type for each product are entered into the worksheet below. An expression is entered in cell E4 to calculate the predicted sales amount on the day for Product A, and this is copied to cells E5 through E6 and used. Under these conditions, which of the following is the appropriate expression to be entered in cell E4?\n\n|       | A                           | B                                 | C                                  | D                                 | E                                 |\n| ----- | --------------------------- | --------------------------------- | ---------------------------------- | --------------------------------- | --------------------------------- |\n| **1** | Weather type                | Sunny                             | Cloudy                             | Rainy                             |                                   |\n| **2** | Probability of weather type | 0.5                               | 0.3                                | 0.2                               |                                   |\n| **3** | Product name                | Predicted sales amount when sunny | Predicted sales amount when cloudy | Predicted sales amount when rainy | Predicted sales amount on the day |\n| **4** | Product A                   | 300,000                           | 100,000                            | 80,000                            |                                   |\n| **5** | Product B                   | 250,000                           | 280,000                            | 300,000                           |                                   |\n| **6** | Product C                   | 100,000                           | 250,000                            | 350,000                           |                                   |","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"`B2*B4+C2*C4+D2*D4`"},{"key":"b","text":"`B$2*B4+C$2*C4+D$2*D4`"},{"key":"c","text":"`$B2*B$4+$C2*C$4+$D2*D$4`"},{"key":"d","text":"`$B$2*$B$4+$C$2*$C$4+$D$2*$D$4`"}],"correctAnswer":"b","explanation":"b) `B$2*B4+C$2*C4+D$2*D4`"},{"id":"2025A-Q22","session":"Autumn 2025","category":null,"questionNumber":22,"prompt":"Which of the following is the appropriate description of multithreading?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Equipping a CPU with multiple cores (arithmetic circuits)"},{"key":"b","text":"Using a hard disk or another external storage unit and providing a storage space with a capacity larger than that of the main memory"},{"key":"c","text":"Dividing one (1) application program into multiple process units and processing them in parallel"},{"key":"d","text":"Dividing one (1) piece of data and writing it to multiple hard disks in parallel"}],"correctAnswer":"c","explanation":"c) Dividing one (1) application program into multiple process units and processing them in parallel"},{"id":"2025A-Q23","session":"Autumn 2025","category":null,"questionNumber":23,"prompt":"Which of the following is the appropriate role of OCR?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Performing wireless communication between devices that are close together at a distance of approximately 10cm"},{"key":"b","text":"Recognizing printed and handwritten characters, and transforming them to text data"},{"key":"c","text":"Creating an artificial voice through digital signal processing"},{"key":"d","text":"Detecting the position on a panel that was touched by a user’s fingertip, etc."}],"correctAnswer":"b","explanation":"b) Recognizing printed and handwritten characters, and transforming them to text data"},{"id":"2025A-Q24","session":"Autumn 2025","category":null,"questionNumber":24,"prompt":"Which of the following is the function that aids keyboard input and lessens the trouble of entering characters, by looking up past input history for characters being entered and displaying a list of candidate character strings?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Indentation"},{"key":"b","text":"Autocomplete"},{"key":"c","text":"Autofilter"},{"key":"d","text":"Hyperlink"}],"correctAnswer":"b","explanation":"b) Autocomplete"},{"id":"2025A-Q25","session":"Autumn 2025","category":null,"questionNumber":25,"prompt":"When the process for a smart speaker to provide a voice response to the content of a user speaking to a smart speaker is as in (1) through (4), which of the following is the process that corresponds to voice recognition?\n\n- (1) The voice of the user is transformed into text data.\n- (2) Text data is analyzed, and the meaning is understood.\n- (3) The content of the response is decided, and text data is created.\n- (4) The created text data is read out.","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"(1)"},{"key":"b","text":"(2)"},{"key":"c","text":"(3)"},{"key":"d","text":"(4)"}],"correctAnswer":"a","explanation":"a) (1)"},{"id":"2025A-Q26","session":"Autumn 2025","category":null,"questionNumber":26,"prompt":"When an activity for building a relational database is divided into steps A through C below, which of the following is the appropriate order of the steps?\n\n- **A:** Identifying the data items to be used in the business operation\n- **B:** Creating tables\n- **C:** Inserting records","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A → B → C"},{"key":"b","text":"A → C → B"},{"key":"c","text":"B → A → C"},{"key":"d","text":"B → C → A"}],"correctAnswer":"a","explanation":"a) A → B → C"},{"id":"2025A-Q27","session":"Autumn 2025","category":null,"questionNumber":27,"prompt":"The “Purchase_list” table in a relational database manages the purchases of products. This table should be normalized and divided into a “Purchase” table and a “Product” table. Which of the following is the most appropriate field that should be contained in common in the two divided tables? Here, each purchase includes only one product, and can be uniquely identified by Purchase_number. Also, each product can be uniquely identified by Product_number.","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Purchase_number"},{"key":"b","text":"Payment_method"},{"key":"c","text":"Product_number"},{"key":"d","text":"Product_name"}],"correctAnswer":"c","explanation":"c) Product_number"},{"id":"2025A-Q28","session":"Autumn 2025","category":null,"questionNumber":28,"prompt":"Which of the following is the appropriate description of a rollback in transaction processing?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"When a transaction attempts to update shared data, it prohibits another transaction from updating that data."},{"key":"b","text":"When a transaction has been successfully processed, it commits an update to the database."},{"key":"c","text":"When a transaction failed for some reason, it reverts the database to the state before the transaction was started."},{"key":"d","text":"It combines multiple tables into one (1) table by using mutually related columns as keys."}],"correctAnswer":"c","explanation":"c) When a transaction failed for some reason, it reverts the database to the state before the transaction was started."},{"id":"2025A-Q29","session":"Autumn 2025","category":null,"questionNumber":29,"prompt":"Which of the following is the appropriate purpose of exclusive control in a database management system?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"To ensure that data is not accidentally modified nor intentionally tampered with"},{"key":"b","text":"To make system maintenance management easy by making data and programs independent of each other"},{"key":"c","text":"To prevent access to data except by certain persons according to the confidentiality of the data"},{"key":"d","text":"To prevent the occurrence of inconsistencies in data when multiple programs simultaneously access the same data"}],"correctAnswer":"d","explanation":"d) To prevent the occurrence of inconsistencies in data when multiple programs simultaneously access the same data"},{"id":"2025A-Q30","session":"Autumn 2025","category":null,"questionNumber":30,"prompt":"Which of the following is the appropriate explanation of the POP communications protocol?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"It is a protocol for the remote control of a computer from a terminal that is in a different location."},{"key":"b","text":"It is a protocol for file transfer."},{"key":"c","text":"It is a protocol for s
