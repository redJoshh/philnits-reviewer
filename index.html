<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhilNITS Reviewer</title>
<meta name="description" content="IT Passport exam reviewer: practice past PhilNITS / ITPEC IT Passport papers by year.">
<script>
  try { var t = localStorage.getItem("philnits:theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --border: #dde1e7;
  --text: #1b1f24; --muted: #5d6673; --accent: #2f5bd3; --accent-soft: #e7edfc; --ok: #1f7a3d;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .04);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #171b21; --surface-2: #1f242c; --border: #2c333d;
    --text: #e6e9ee; --muted: #9aa4b2; --accent: #7b9cff; --accent-soft: #1e2a4a; --ok: #6fd18f;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --surface-2: #1f242c; --border: #2c333d;
  --text: #e6e9ee; --muted: #9aa4b2; --accent: #7b9cff; --accent-soft: #1e2a4a; --ok: #6fd18f;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 var(--font); }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
header { padding: 40px 0 8px; display: flex; align-items: flex-start; gap: 16px; }
h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 6px; }
.lead { color: var(--muted); margin: 0; max-width: 60ch; }
.btn {
  margin-left: auto; flex: none; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 8px; padding: 6px 12px; font: inherit; font-size: .88rem; cursor: pointer;
}
.btn:hover { background: var(--surface-2); }
.summary { color: var(--muted); font-size: .9rem; margin: 18px 0 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card {
  display: block; text-decoration: none; color: inherit; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 18px 20px;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.year { font-size: 1.9rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.title { color: var(--muted); font-size: .85rem; margin: 2px 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { font-size: .78rem; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); gap: 8px; }
.meta b { color: var(--text); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.open { margin-top: 14px; font-size: .88rem; color: var(--accent); font-weight: 600; }
footer { color: var(--muted); font-size: .8rem; text-align: center; padding: 40px 0 32px; }
@media (max-width: 640px) { header { padding-top: 28px; } h1 { font-size: 1.4rem; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>PhilNITS IT Passport Reviewer</h1>
      <p class="lead">Practice past IT Passport exam papers. Pick a year to answer questions in quiz mode, or switch to document view to review them all with answers.</p>
    </div>
    <button type="button" class="btn" id="btn-theme" aria-label="Toggle dark mode">Theme</button>
  </header>
  <p class="summary" id="summary"></p>
  <main class="grid" id="years"></main>
  <footer id="foot"></footer>
</div>

<script>
const SITE = {"generatedAt":"2026-10-09T09:07:54.452Z","years":[{"year":"2026","title":"IT Passport Exam - 2026","total":100,"sessions":[{"name":"Spring","count":100}]},{"year":"2025","title":"IT Passport Exam - 2025","total":100,"sessions":[{"name":"Spring","count":50},{"name":"Autumn","count":50}]},{"year":"2024","title":"IT Passport Exam - 2024","total":100,"sessions":[{"name":"Spring","count":50},{"name":"Autumn","count":50}]},{"year":"2019","title":"IT Passport Exam - 2019","total":100,"sessions":[{"name":"Spring","count":50},{"name":"Autumn","count":50}]},{"year":"2011","title":"IT Passport Exam - 2011","total":200,"sessions":[{"name":"Spring","count":100},{"name":"Autumn","count":100}]}]};

(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Each year page stores a small summary of the viewer's progress under this key.
  function progress(year) {
    try {
      const p = JSON.parse(localStorage.getItem("philnits:" + year + ":summary"));
      if (p && typeof p.answered === "number") return p;
    } catch (e) {}
    return null;
  }

  function card(y) {
    const p = progress(y.year);
    const answered = p ? Math.min(p.answered, y.total) : 0;
    const score = p && p.answered ? Math.round((p.correct / p.answered) * 100) + "%" : "–";
    const chips = y.sessions.map((s) => '<span class="chip">' + esc(s.name) + " · " + s.count + "</span>").join("");
    // Explicit index.html so the links also work when the files are opened locally (file://).
    return '<a class="card" href="' + esc(y.year) + '/index.html">' +
      '<div class="year">' + esc(y.year) + "</div>" +
      '<div class="title">' + esc(y.title) + "</div>" +
      '<div class="chips">' + chips + "</div>" +
      '<div class="meta"><span>Answered <b>' + answered + "/" + y.total + "</b></span><span>Score <b>" + score + "</b></span></div>" +
      '<div class="bar"><span style="width:' + (answered / y.total) * 100 + '%"></span></div>' +
      '<div class="open">' + (answered ? "Continue" : "Start") + " →</div></a>";
  }

  function render() {
    const years = SITE.years;
    const total = years.reduce((n, y) => n + y.total, 0);
    $("#summary").textContent = years.length + (years.length === 1 ? " year" : " years") + " · " + total + " questions";
    $("#years").innerHTML = years.map(card).join("");
    $("#foot").textContent = "Built " + SITE.generatedAt.slice(0, 10) + " from examQA-md";
  }

  function currentTheme() {
    return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function themeLabel() { $("#btn-theme").textContent = currentTheme() === "dark" ? "☀ Light" : "☾ Dark"; }
  $("#btn-theme").addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("philnits:theme", next); } catch (e) {}
    themeLabel();
  });

  // Refresh progress when returning via the back button (page restored from cache).
  window.addEventListener("pageshow", (e) => { if (e.persisted) render(); });
  themeLabel();
  render();
})();
</script>
</body>
</html>
