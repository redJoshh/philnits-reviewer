ertificate."},{"key":"c","text":"Creating a new key pair for reissuing a certificate due to the expiration of the validity period."},{"key":"d","text":"Continuing using the same digital certificate, because only the private key was leaked."}],"correctAnswer":"b","explanation":"b) Requesting to the certification authority for revocation of the digital certificate."},{"id":"2024A-Q40","session":"Autumn 2024","category":null,"questionNumber":40,"prompt":"Which of the following sets conditions for character type, length, etc. used for passwords that are set for accounts on a computer, etc.?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Single sign-on"},{"key":"b","text":"Password crack"},{"key":"c","text":"Password policy"},{"key":"d","text":"One-time password"}],"correctAnswer":"c","explanation":"c) Password policy"},{"id":"2024A-Q41","session":"Autumn 2024","category":null,"questionNumber":41,"prompt":"Among confidentiality, integrity, and availability, which of the following is the list that contains all and only the properties that are lost in the information security incident below?\n\n\"All files on a server in the workplace were encrypted. However, the server was infected by a virus, and a number of the files were deleted. Removal of the virus and recovery of the files required several hours. During the hours, work could not be performed, and users were inconvenienced. Some files were unable to be recovered.\"","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Confidentiality"},{"key":"b","text":"Confidentiality, integrity"},{"key":"c","text":"Integrity, availability"},{"key":"d","text":"Availability"}],"correctAnswer":"c","explanation":"c) Integrity, availability"},{"id":"2024A-Q42","session":"Autumn 2024","category":null,"questionNumber":42,"prompt":"A problem has been pointed out that the WEP encryption for wireless LANs can be broken easily. Which of the following is an encryption method that does not have the same weakness and is cryptographically stronger?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"ESSID"},{"key":"b","text":"S/MIME"},{"key":"c","text":"SSL"},{"key":"d","text":"WPA2"}],"correctAnswer":"d","explanation":"d) WPA2"},{"id":"2024A-Q43","session":"Autumn 2024","category":null,"questionNumber":43,"prompt":"Company A implements risk analysis for its own information assets. The results show that if a nearby river overflows, the server room on the first floor of the company might be flooded. The company considers the possibility of moving the server room, but decides there is almost no risk of a flood because the last time the river overflowed was 100 years ago, and the management decides that no particular countermeasures are taken. Which of the following is the risk treatment for information security that Company A selects?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Risk transfer"},{"key":"b","text":"Risk avoidance"},{"key":"c","text":"Risk acceptance"},{"key":"d","text":"Risk mitigation"}],"correctAnswer":"c","explanation":"c) Risk acceptance"},{"id":"2024A-Q44","session":"Autumn 2024","category":null,"questionNumber":44,"prompt":"The decision is made to digitize a paper-based contact list that only some people are permitted to view, and to manage it as a contact file. Among the measures A through D below, which of the following is the list that contains all and only the appropriate measures against personal information leakage?\n\nA: A password for reading is set for the contact file.\nB: The contact file is encrypted.\nC: The servers that stores the contact file are configured in a redundant configuration.\nD: After the contact list is digitized, the paper-based contact list is disposed of with a shredder.","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A, B"},{"key":"b","text":"A, B, C"},{"key":"c","text":"A, B, D"},{"key":"d","text":"C, D"}],"correctAnswer":"c","explanation":"c) A, B, D"},{"id":"2024A-Q45","session":"Autumn 2024","category":null,"questionNumber":45,"prompt":"Among the Web browsing practices (1) through (3) below, which of the following is the list that contains all and only the practices that reduce security risks?\n\n(1) Storing the user ID and the password on the web browser\n(2) Disabling JavaScript\n(3) Logging on to the PC with administrator privileges when using the web browser","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"(1), (2)"},{"key":"b","text":"(1), (3)"},{"key":"c","text":"(2)"},{"key":"d","text":"(2), (3)"}],"correctAnswer":"c","explanation":"c) (2)"},{"id":"2024A-Q46","session":"Autumn 2024","category":null,"questionNumber":46,"prompt":"In software development, which of the following is the appropriate combination of the descriptions A through C concerning testing and testing processes?\n\nA: Check that processing ends within the planned operating time.\nB: Check the interface between software.\nC: Comprehensively check the internal paths of a program.","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Unit test: A, Integration test: B, System test: C"},{"key":"b","text":"Unit test: A, Integration test: C, System test: B"},{"key":"c","text":"Unit test: B, Integration test: A, System test: C"},{"key":"d","text":"Unit test: C, Integration test: B, System test: A"}],"correctAnswer":"d","explanation":"d) Unit test: C, Integration test: B, System test: A"},{"id":"2024A-Q47","session":"Autumn 2024","category":null,"questionNumber":47,"prompt":"Which of the following corresponds to software maintenance?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"A response time that was measured in a system test did not satisfy the requirement, so tuning was performed on the software."},{"key":"b","text":"As a result of a software acceptance test, a defect was found, so the orderer requested the developer to fix the software."},{"key":"c","text":"A function was found missing in a unit test of a program, so the function was added to the program."},{"key":"d","text":"A defect was reported on software that is running on a production system, so the software was modified."}],"correctAnswer":"d","explanation":"d) A defect was reported on software that is running on a production system, so the software was modified."},{"id":"2024A-Q48","session":"Autumn 2024","category":null,"questionNumber":48,"prompt":"Which of the following is an appropriate test for a user to confirm by himself/herself whether the delivered software satisfies the requirements?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Acceptance test"},{"key":"b","text":"Integration test"},{"key":"c","text":"System test"},{"key":"d","text":"Unit test"}],"correctAnswer":"a","explanation":"a) Acceptance test"},{"id":"2024A-Q49","session":"Autumn 2024","category":null,"questionNumber":49,"prompt":"A system migration plan was created for the migration from an existing system to a new system. Which of the following is an appropriate item to be described in the system migration plan?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"System selection policy"},{"key":"b","text":"Schedule for parallel operation of the existing and new systems"},{"key":"c","text":"Evaluation criteria for the quality of the deliverables"},{"key":"d","text":"The work history of project members"}],"correctAnswer":"b","explanation":"b) Schedule for parallel operation of the existing and new systems"},{"id":"2024A-Q50","session":"Autumn 2024","category":null,"questionNumber":50,"prompt":"Which of the following is the appropriate explanation of refactoring?","hasDiagram":false,"figureMissing":false,"figureHint":null,"options":[{"key":"a","text":"Improving internal architecture without changing the functions that software provides."},{"key":"b","text":"Discovering the specifications of software by analysis of its operations, etc."},{"key":"c","text":"Correcting a defect in software so that it performs according to the specifications."},{"key":"d","text":"Modifying software to add a new function on the basis of user requests, etc."}],"correctAnswer":"a","explanation":"a) Improving internal architecture without changing the functions that software provides."}]};

(function () {
  "use strict";
  const QS = EXAM.questions;
  const BY_ID = new Map(QS.map((q) => [q.id, q]));
  const STORE_KEY = "philnits:" + EXAM.year + ":v1";
  const $ = (s) => document.querySelector(s);

  // ---------- persistence ----------
  const defaults = () => ({ answers: {}, revealed: {}, hints: {}, bookmarks: {}, view: "quiz", order: null, filters: { q: "", session: "", status: "all" } });
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && typeof s === "object") return Object.assign(defaults(), s);
    } catch (e) {}
    return defaults();
  }
  let state = load();
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- markdown + math rendering ----------
  const ESC_CHARS = "\\`*_{}[]()#+-.!<>$|~\"'=&";
  const htmlEsc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Source uses "\$\\checkmark\$" for escaped math; normalise to "$\checkmark$".
  const normalise = (s) => s.replace(/\\\$\\\\([a-zA-Z]+)\\\$/g, (_, c) => "$\\" + c + "$");

  // "$...$" is math only when not glued to letters/digits (keeps spreadsheet refs like $A$36 or B$3 literal).
  const RE_MATH = /(^|[^\\A-Za-z0-9$])\$([^$\n]+?)\$(?![A-Za-z0-9$])/g;

  function extractMath(s, store) {
    return s.replace(RE_MATH, (m, pre, tex) => {
      if (/^\s|\s$/.test(tex)) return m;
      store.push(tex);
      return pre + "\uE000" + (store.length - 1) + "\uE000";
    });
  }

  function renderTex(tex) {
    if (window.katex) {
      try { return katex.renderToString(tex, { throwOnError: false }); } catch (e) {}
    }
    return htmlEsc(texToPlain(tex));
  }

  function texToPlain(tex) {
    const map = { times: "×", rightarrow: "→", leftarrow: "←", Rightarrow: "⇒", leftrightarrow: "↔", checkmark: "✓", div: "÷", le: "≤", leq: "≤", ge: "≥", geq: "≥", ne: "≠", neq: "≠", cdot: "·", pm: "±", infty: "∞", approx: "≈", sqrt: "√" };
    return tex
      .replace(/\\([a-zA-Z]+)\s?/g, (m, c) => (c in map ? map[c] : m))
      .replace(/\^\{([^}]*)\}/g, "^$1").replace(/_\{([^}]*)\}/g, "_$1")
      .replace(/[{}]/g, "").replace(/\\ /g, " ");
  }

  function inline(src) {
    const math = [], escs = [], code = [];
    // `code` spans are shown verbatim (spreadsheet formulas etc.), so pull them out first.
    let s = src.replace(/`([^`\n]+)`/g, (_, c) => (code.push(c), "" + (code.length - 1) + ""));
    s = extractMath(normalise(s), math);
    s = s.replace(/\\(.)/g, (m, c) => (ESC_CHARS.includes(c) ? (escs.push(c), "\uE001" + (escs.length - 1) + "\uE001") : m));
    s = htmlEsc(s);
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1<em>$2</em>");
    s = s.replace(/\uE001(\d+)\uE001/g, (_, i) => htmlEsc(escs[+i]));
    s = s.replace(/\uE000(\d+)\uE000/g, (_, i) => renderTex(math[+i]));
    return s.replace(/\uE002(\d+)\uE002/g, (_, i) => "<code>" + htmlEsc(code[+i]) + "</code>");
  }

  function plain(src) {
    const math = [], code = [];
    let s = src.replace(/`([^`\n]+)`/g, (_, c) => (code.push(c), "\uE002" + (code.length - 1) + "\uE002"));
    s = extractMath(normalise(s), math);
    s = s.replace(/\*\*(.+?)\*\*/g, "$1").replace(/(^|[^*\\])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1$2");
    s = s.replace(/\\(.)/g, (m, c) => (ESC_CHARS.includes(c) ? c : m));
    s = s.replace(/\uE000(\d+)\uE000/g, (_, i) => texToPlain(math[+i]));
    return s.replace(/\uE002(\d+)\uE002/g, (_, i) => code[+i]);
  }

  const RE_BULLET = /^\s*[*-]\s+/, RE_NUM = /^\s*\d+\.\s+/, RE_TABLE = /^\s*\|/, RE_FENCE = /^\s*```/;
  function block(src) {
    const lines = src.split("\n"), out = [];
    let i = 0;
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) { i++; continue; }
      if (RE_FENCE.test(l)) {
        const code = [];
        i++;
        while (i < lines.length && !RE_FENCE.test(lines[i])) code.push(lines[i++]);
        i++;
        out.push('<pre class="code"><code>' + htmlEsc(code.join("\n")) + "</code></pre>");
      } else if (RE_TABLE.test(l)) {
        const rows = [];
        while (i < lines.length && RE_TABLE.test(lines[i])) rows.push(lines[i++]);
        out.push(table(rows));
      } else if (RE_BULLET.test(l) || RE_NUM.test(l)) {
        const ordered = RE_NUM.test(l), re = ordered ? RE_NUM : RE_BULLET, items = [];
        while (i < lines.length && re.test(lines[i])) items.push(lines[i++].replace(re, ""));
        const tag = ordered ? "ol" : "ul";
        out.push("<" + tag + ">" + items.map((t) => "<li>" + inline(t) + "</li>").join("") + "</" + tag + ">");
      } else {
        const para = [];
        while (i < lines.length && lines[i].trim() && !RE_FENCE.test(lines[i]) && !RE_TABLE.test(lines[i]) && !RE_BULLET.test(lines[i]) && !RE_NUM.test(lines[i])) para.push(lines[i++]);
        out.push("<p>" + para.map((t) => inline(t.trim())).join("<br>") + "</p>");
      }
    }
    return out.join("");
  }

  function table(rows) {
    const cells = (r) => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
    const body = rows.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r)).map(cells);
    if (!body.length) return "";
    const [head, ...rest] = body;
    return "<table><thead><tr>" + head.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
      rest.map((r) => "<tr>" + r.map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
  }

  const cache = new Map();
  function rendered(q) {
    let r = cache.get(q.id);
    if (!r) {
      r = {
        prompt: block(q.prompt),
        options: q.options.map((o) => inline(o.text)),
        explanation: inline(q.explanation || ""),
        hint: q.figureHint ? inline(q.figureHint) : "",
        search: ("#" + q.questionNumber + " " + q.id + " " + plain(q.prompt) + " " + q.options.map((o) => plain(o.text)).join(" ") + " " + plain(q.figureHint || "")).toLowerCase(),
      };
      cache.set(q.id, r);
    }
    return r;
  }

  // ---------- filtering ----------
  function ordered() {
    if (!state.order) return QS;
    const list = state.order.map((id) => BY_ID.get(id)).filter(Boolean);
    return list.length === QS.length ? list : QS;
  }

  function visible() {
    const f = state.filters, term = f.q.trim().toLowerCase();
    const num = /^#?(\d+)$/.exec(term);
    return ordered().filter((q) => {
      if (f.session && q.session !== f.session) return false;
      const a = state.answers[q.id];
      if (f.status === "unanswered" && a) return false;
      if (f.status === "incorrect" && (!a || a === q.correctAnswer)) return false;
      if (f.status === "bookmarked" && !state.bookmarks[q.id]) return false;
      if (!term) return true;
      if (num) return q.questionNumber === +num[1];
      return rendered(q).search.includes(term);
    });
  }

  // ---------- views ----------
  function quizCard(q) {
    const r = rendered(q), a = state.answers[q.id], revealed = !a && state.revealed[q.id];
    const done = !!a || revealed;
    const status = a ? (a === q.correctAnswer ? '<span class="tag ok">Correct</span>' : '<span class="tag bad">Incorrect</span>') : "";
    const opts = q.options.map((o, i) => {
      let cls = "", mark = "";
      if (done && o.key === q.correctAnswer) { cls = "correct"; mark = "✅"; }
      else if (a && o.key === a) { cls = "wrong"; mark = "❌"; }
      else if (done) cls = "dim";
      return '<button type="button" class="opt ' + cls + '" data-act="pick" data-key="' + o.key + '"' + (done ? " disabled" : "") + ">" +
        '<span class="k">' + o.key + '</span><span class="t">' + r.options[i] + '</span><span class="m">' + mark + "</span></button>";
    }).join("");
    const hintOpen = done || !!state.hints[q.id];
    const foot = (done
      ? '<button type="button" class="linkbtn" data-act="clear">' + (a ? "Try again" : "Hide answer") + "</button>"
      : '<button type="button" class="linkbtn" data-act="reveal">Reveal answer</button>') +
      (q.figureHint && !hintOpen ? '<button type="button" class="linkbtn" data-act="hint">Show figure hint</button>' : "");
    return '<article class="q" data-id="' + q.id + '">' + head(q, status) +
      '<div class="prompt">' + r.prompt + "</div>" + figNote(q) +
      '<div class="opts">' + opts + "</div>" + (hintOpen ? figHint(q) : "") +
      '<div class="q-foot">' + foot + "</div>" +
      (done && r.explanation ? '<div class="explain"><strong>Answer:</strong> ' + r.explanation + "</div>" : "") +
      "</article>";
  }

  function docCard(q) {
    const r = rendered(q);
    const opts = q.options.map((o, i) => {
      const ok = o.key === q.correctAnswer;
      return '<li class="' + (ok ? "correct" : "") + '">[' + (ok ? "x" : "&nbsp;") + "] " + o.key + ") " + r.options[i] + (ok ? " ✅" : "") + "</li>";
    }).join("");
    return '<article class="q" data-id="' + q.id + '">' + head(q, "") +
      '<div class="prompt">' + r.prompt + "</div>" + figNote(q) +
      '<ul class="doc-opts">' + opts + "</ul>" + figHint(q) +
      '<div class="doc-ans"><strong>Answer:</strong> ' + r.explanation + "</div></article>";
  }

  function head(q, status) {
    const bm = !!state.bookmarks[q.id];
    return '<div class="q-head"><span class="q-num">Question ' + q.questionNumber + '</span><span class="tag">' + htmlEsc(q.session || "") + "</span>" + status +
      '<button type="button" class="bm" data-act="bookmark" aria-pressed="' + bm + '" aria-label="Bookmark question ' + q.questionNumber + '" title="Bookmark">' + (bm ? "★" : "☆") + "</button></div>";
  }

  // Figures the source could not include: a short note under the prompt, and a written hint
  // (what the figure shows and which choice is right) below the choices.
  const figNote = (q) => (q.figureMissing
    ? '<div class="note-fig">📷 The figure for this question is not included in the source' + (q.figureHint ? "; a written hint is available below the choices." : ".") + "</div>"
    : "");
  const figHint = (q) => (q.figureHint ? '<div class="hint"><strong>💡 Figure hint:</strong> ' + rendered(q).hint + "</div>" : "");

  function render() {
    const list = visible(), box = $("#list"), doc = state.view === "doc";
    box.className = doc ? "doc" : "quiz";
    box.innerHTML = list.length ? list.map(doc ? docCard : quizCard).join("") : '<p class="empty">No questions match these filters.</p>';
    $("#count-line").textContent = "Showing " + list.length + " of " + QS.length + " questions" + (state.order ? " · shuffled" : "");
    $("#btn-copy").hidden = !doc || !list.length;
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
    $("#btn-shuffle").setAttribute("aria-pressed", String(!!state.order));
    stats();
  }

  function rerenderCard(id) {
    const el = document.querySelector('.q[data-id="' + id + '"]');
    if (!el) return;
    const q = BY_ID.get(id);
    el.outerHTML = state.view === "doc" ? docCard(q) : quizCard(q);
  }

  function stats() {
    let answered = 0, correct = 0;
    for (const q of QS) {
      const a = state.answers[q.id];
      if (a) { answered++; if (a === q.correctAnswer) correct++; }
    }
    $("#st-answered").textContent = answered + "/" + QS.length;
    $("#st-score").textContent = answered ? Math.round((correct / answered) * 100) + "%" : "–";
    $("#st-remaining").textContent = QS.length - answered;
    $("#progress-bar").style.width = (answered / QS.length) * 100 + "%";
    // Summary for the home page's year cards.
    try { localStorage.setItem("philnits:" + EXAM.year + ":summary", JSON.stringify({ answered, correct, total: QS.length })); } catch (e) {}
  }

  // ---------- copy (document view) ----------
  function copyText(list) {
    return list.map((q) => {
      const opts = q.options.map((o) => (o.key === q.correctAnswer ? "[x] " : "[ ] ") + o.key + ") " + plain(o.text) + (o.key === q.correctAnswer ? " ✅" : "")).join("\n");
      const hint = q.figureHint ? "\n\nFigure hint: " + plain(q.figureHint) : "";
      return "Question " + q.questionNumber + " (" + q.session + ")\n" + plain(q.prompt) + "\n\n" + opts + hint + "\n\nAnswer: " + plain(q.explanation || "");
    }).join("\n\n");
  }

  async function copyVisible() {
    const text = copyText(visible());
    try {
      await navigator.clipboard.writeText(text);
      toast("Copied " + visible().length + " questions");
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Copied"); } catch (e2) { toast("Copy failed"); }
      ta.remove();
    }
  }

  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  // ---------- theme ----------
  function currentTheme() {
    return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function themeLabel() { $("#btn-theme").textContent = currentTheme() === "dark" ? "☀ Light" : "☾ Dark"; }

  // ---------- events ----------
  $("#list").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const id = btn.closest(".q").dataset.id;
    const act = btn.dataset.act;
    if (act === "pick") { state.answers[id] = btn.dataset.key; delete state.revealed[id]; }
    else if (act === "reveal") state.revealed[id] = true;
    else if (act === "hint") state.hints[id] = true;
    else if (act === "clear") { delete state.answers[id]; delete state.revealed[id]; delete state.hints[id]; }
    else if (act === "bookmark") { if (state.bookmarks[id]) delete state.bookmarks[id]; else state.bookmarks[id] = true; }
    save(); rerenderCard(id); stats();
  });

  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => {
    state.view = b.dataset.view; save(); render();
  }));

  let searchTimer;
  $("#f-search").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.filters.q = e.target.value; save(); render(); }, 120);
  });
  $("#f-session").addEventListener("change", (e) => { state.filters.session = e.target.value; save(); render(); });
  $("#f-status").addEventListener("change", (e) => { state.filters.status = e.target.value; save(); render(); });

  $("#btn-shuffle").addEventListener("click", () => {
    if (state.order) state.order = null;
    else {
      const ids = QS.map((q) => q.id);
      for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
      state.order = ids;
    }
    save(); render(); window.scrollTo({ top: 0 });
  });

  $("#btn-reset").addEventListener("click", () => {
    if (!confirm("Clear all your answers and revealed answers for this exam? Bookmarks are kept.")) return;
    state.answers = {}; state.revealed = {}; state.hints = {}; state.order = null;
    save(); render(); toast("Progress cleared");
  });

  $("#btn-theme").addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("philnits:theme", next); } catch (e) {}
    themeLabel();
  });

  $("#btn-copy").addEventListener("click", copyVisible);

  // ---------- init ----------
  function init() {
    const sessions = [...new Set(QS.map((q) => q.session).filter(Boolean))];
    $("#f-session").insertAdjacentHTML("beforeend", sessions.map((s) => '<option value="' + htmlEsc(s) + '">' + htmlEsc(s) + "</option>").join(""));
    if (!sessions.includes(state.filters.session)) state.filters.session = "";
    $("#f-search").value = state.filters.q;
    $("#f-session").value = state.filters.session;
    $("#f-status").value = state.filters.status;
    $("#foot").textContent = QS.length + " questions · source: examQA-md · built " + EXAM.generatedAt.slice(0, 10);
    themeLabel();
    render();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
