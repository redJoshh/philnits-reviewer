e, the amount of data becomes smaller."},{"key":"c","text":"The CPU load required to process the recorded data decreases."},{"key":"d","text":"The upper limit of the frequency that can be recorded becomes higher."}],"correctAnswer":"a","explanation":"a) The amplitude of the sound can be recorded more finely."},{"id":"2011A-Q08","session":"Autumn 2011","category":null,"questionNumber":8,"prompt":"A sound signal is digitized. Sampling is performed at Time 1 through Time 5, and four-level quantization is performed; in other words, the levels closest to the sampling point are selected. After that, two-bit encoding is performed. The result is \"11 01 00 10 11\". When digitization is performed in the same way, which of the following figures represents the sound signal that results in \"01 00 10 11 01\"?","hasDiagram":true,"options":[{"key":"a","text":"Figure a"},{"key":"b","text":"Figure b"},{"key":"c","text":"Figure c"},{"key":"d","text":"Figure d"}],"correctAnswer":"b","explanation":"b) Figure b"},{"id":"2011A-Q09","session":"Autumn 2011","category":null,"questionNumber":9,"prompt":"Which of the following is an appropriate description concerning the clock frequency of the CPU in a PC?","hasDiagram":false,"options":[{"key":"a","text":"The instruction execution timing of the CPU changes depending on the clock frequency. As the clock frequency becomes higher, the instruction execution speed of the PC increases."},{"key":"b","text":"The communication speed of the LAN changes depending on the clock frequency. As the clock frequency becomes higher, the communication speed of the LAN increases."},{"key":"c","text":"The rotation speed of the hard disk changes depending on the clock frequency. As the clock frequency becomes higher, the rotation speed becomes faster and the data transfer rate of the hard disk increases."},{"key":"d","text":"The clock frequency serves as the reference for the internal clock of the PC. When the clock frequency doubles, the interrupt interval becomes half and the speed of real-time processing increases."}],"correctAnswer":"a","explanation":"a) The instruction execution timing of the CPU changes depending on the clock frequency. As the clock frequency becomes higher, the instruction execution speed of the PC increases."},{"id":"2011A-Q10","session":"Autumn 2011","category":null,"questionNumber":10,"prompt":"Which of the following is an appropriate explanation concerning the cache memory of a PC?","hasDiagram":false,"options":[{"key":"a","text":"It is placed between the CPU core and main memory, and is used to read and write data at high speed."},{"key":"b","text":"It is used to store the same data in two locations at the same time in order to improve reliability."},{"key":"c","text":"It is equipped with a mechanism that can run even a program whose size exceeds the main memory capacity."},{"key":"d","text":"It enables simultaneous access to main memory blocks by dividing main memory into multiple blocks."}],"correctAnswer":"a","explanation":"a) It is placed between the CPU core and main memory, and is used to read and write data at high speed."},{"id":"2011A-Q11","session":"Autumn 2011","category":null,"questionNumber":11,"prompt":"Which of the following is an appropriate description concerning flash memory?","hasDiagram":false,"options":[{"key":"a","text":"It is used as read-only storage once data is written."},{"key":"b","text":"No power supply is required to retain stored data."},{"key":"c","text":"It is not used for digital cameras because of the difficulty of downsizing."},{"key":"d","text":"Data is read or written using laser light."}],"correctAnswer":"b","explanation":"b) No power supply is required to retain stored data."},{"id":"2011A-Q12","session":"Autumn 2011","category":null,"questionNumber":12,"prompt":"Which of the following is an appropriate description concerning CD-R?","hasDiagram":false,"options":[{"key":"a","text":"It is suitable for making a backup copy of data, because the saved data cannot be erased or overwritten."},{"key":"b","text":"It is suitable as storage for frequently updated large master files, because it has a large storage capacity."},{"key":"c","text":"It is capable of high-speed writing by shrinking the recording area of the disc surface."},{"key":"d","text":"A specially-designed CD-R drive is necessary for reading data, because the data is recorded in a special format."}],"correctAnswer":"a","explanation":"a) It is suitable for making a backup copy of data, because the saved data cannot be erased or overwritten."},{"id":"2011A-Q13","session":"Autumn 2011","category":null,"questionNumber":13,"prompt":"Which of the following is the most appropriate explanation of TCO (Total Cost of Ownership) that represents the cost of a system?","hasDiagram":false,"options":[{"key":"a","text":"The total cost of a company's initial investment in an information system"},{"key":"b","text":"The total cost incurred in system development"},{"key":"c","text":"The total cost including system installation, operation, maintenance, and education"},{"key":"d","text":"The total cost of system installation"}],"correctAnswer":"c","explanation":"c) The total cost including system installation, operation, maintenance, and education"},{"id":"2011A-Q14","session":"Autumn 2011","category":null,"questionNumber":14,"prompt":"In the new system environment of Company X, three systems including a customer management system, an ordering management system, and a call center system are run individually at separate locations and connected via a network so that they can complement one another in the event of a failure. Also, the system operations are managed at their respective locations. Which of the following is the greatest merit of this new system?","hasDiagram":false,"options":[{"key":"a","text":"The integration of operations helps reduce the number of operating staff."},{"key":"b","text":"Risks of disasters and other problems can be diversified."},{"key":"c","text":"The versions of software can be controlled easily."},{"key":"d","text":"Backup files can be managed in a consolidated manner."}],"correctAnswer":"b","explanation":"b) Risks of disasters and other problems can be diversified."},{"id":"2011A-Q15","session":"Autumn 2011","category":null,"questionNumber":15,"prompt":"Which of the following is the technical term that represents the work volume processed by a computer per unit time?","hasDiagram":false,"options":[{"key":"a","text":"Throughput"},{"key":"b","text":"Turnaround time"},{"key":"c","text":"Time slice"},{"key":"d","text":"Response time"}],"correctAnswer":"a","explanation":"a) Throughput"},{"id":"2011A-Q16","session":"Autumn 2011","category":null,"questionNumber":16,"prompt":"Which of the following is an appropriate description concerning OSs used for PCs?","hasDiagram":false,"options":[{"key":"a","text":"Since the interface between an OS and application programs is standardized, the application programs can be developed without regard to the type of OS."},{"key":"b","text":"An OS allocates the computer resources, such as the CPU, memory, and auxiliary storage device, to application programs."},{"key":"c","text":"Since an OS has the function of automatically converting character sets in a file, application programs can access the file without regard to the type of character set."},{"key":"d","text":"The source code of an OS should be disclosed so that application programs can be free to use the various functions of the OS."}],"correctAnswer":"b","explanation":"b) An OS allocates the computer resources, such as the CPU, memory, and auxiliary storage device, to application programs."},{"id":"2011A-Q17","session":"Autumn 2011","category":null,"questionNumber":17,"prompt":"Which of the following is the most appropriate method for displaying the content of database to a limited extent in accordance with the level of confidentiality for each user's business operations?","hasDiagram":false,"options":[{"key":"a","text":"Setting up access rights based on the combination of data and user"},{"key":"b","text":"Distributing a copy of the database limited to each user"},{"key":"c","text":"Setting up a set of data items (columns) dedicated to each user"},{"key":"d","text":"Setting up a password for each record in order to protect data"}],"correctAnswer":"a","explanation":"a) Setting up access rights based on the combination of data and user"},{"id":"2011A-Q18","session":"Autumn 2011","category":null,"questionNumber":18,"prompt":"When a newly installed application program is concurrently executed on a PC that is equipped with a virtual memory function, the swapping of pages between main and secondary storage occurs frequently and the processing efficiency of the running application programs drops sharply. Which of the following is the most appropriate solution to this situation?","hasDiagram":false,"options":[{"key":"a","text":"Installing more hard disks"},{"key":"b","text":"Installing more main memory"},{"key":"c","text":"Switching to a faster CPU"},{"key":"d","text":"Switching to faster main memory"}],"correctAnswer":"b","explanation":"b) Installing more main memory"},{"id":"2011A-Q19","session":"Autumn 2011","category":null,"questionNumber":19,"prompt":"Which of the following is an appropriate description concerning file systems that manage files with directories and that are used for a wide variety of OSs on PCs?","hasDiagram":false,"options":[{"key":"a","text":"The current directory is created first as the top directory of a hierarchical structure."},{"key":"b","text":"The file system should be created on a hard disk for directory management."},{"key":"c","text":"The directory path is used to identify a specific file stored on an auxiliary storage."},{"key":"d","text":"Files and directories cannot be registered in the same directory."}],"correctAnswer":"c","explanation":"c) The directory path is used to identify a specific file stored on an auxiliary storage."},{"id":"2011A-Q20","session":"Autumn 2011","category":null,"questionNumber":20,"prompt":"Which of the following is an appropriate explanation of an interpreter?","hasDiagram":false,"options":[{"key":"a","text":"It is a program that translates source programs written in assembler language to machine language programs."},{"key":"b","text":"It is a program that reads high-level source programs line-by-line, alternately translating lines and executing appropriate operations."},{"key":"c","text":"It is a program that translates source programs written in high-level language to machine language programs, and then generates load modules."},{"key":"d","text":"It is a program that automatically generates purpose-specific programs based on the specified parameters."}],"correctAnswer":"b","explanation":"b) It is a program that reads high-level source programs line-by-line, alternately translating lines and executing appropriate operations."},{"id":"2011A-Q21","session":"Autumn 2011","category":null,"questionNumber":21,"prompt":"Which of the following is software that can be used free of charge on a trial basis but requires a usage fee if it continues to be used after the trial period?","hasDiagram":false,"options":[{"key":"a","text":"Open source software"},{"key":"b","text":"Shareware"},{"key":"c","text":"Public domain software"},{"key":"d","text":"Freeware"}],"correctAnswer":"b","explanation":"b) Shareware"},{"id":"2011A-Q22","session":"Autumn 2011","category":null,"questionNumber":22,"prompt":"Which of the following is an explanation of defragmentation?","hasDiagram":false,"options":[{"key":"a","text":"It reassigns defective clusters to other clusters."},{"key":"b","text":"It relocates free or unused clusters."},{"key":"c","text":"It removes failed or defective clusters."},{"key":"d","text":"It relocates physically distributed files into continuous areas."}],"correctAnswer":"d","explanation":"d) It relocates physically distributed files into continuous areas."},{"id":"2011A-Q23","session":"Autumn 2011","category":null,"questionNumber":23,"prompt":"Which of the following is an appropriate concept of universal design?","hasDiagram":false,"options":[{"key":"a","text":"Ensuring that, once a product is designed, the design remains usable without being changed for a long period of time"},{"key":"b","text":"Ensuring that products keep the same levels of performance and quality regardless of where they are manufactured in the world"},{"key":"c","text":"Making the design as simple and easy as possible in order to reduce the manufacturing cost"},{"key":"d","text":"Making products available to many people regardless of differences in age, culture, and ability as well as whether disability is present"}],"correctAnswer":"d","explanation":"d) Making products available to many people regardless of differences in age, culture, and ability as well as whether disability is present"},{"id":"2011A-Q24","session":"Autumn 2011","category":null,"questionNumber":24,"prompt":"Which of the following is an appropriate explanation of MP3 that is used as a multimedia file format?","hasDiagram":false,"options":[{"key":"a","text":"File compression format for G4 facsimile communication data"},{"key":"b","text":"File compression format for audio data"},{"key":"c","text":"File compression format for color image data"},{"key":"d","text":"File compression format for digital video data"}],"correctAnswer":"b","explanation":"b) File compression format for audio data"},{"id":"2011A-Q25","session":"Autumn 2011","category":null,"questionNumber":25,"prompt":"Which of the following is an appropriate explanation of a commercial database service?","hasDiagram":false,"options":[{"key":"a","text":"Publishing information collected only from the commercial field free of charge in the form of a database"},{"key":"b","text":"Providing professional advice on various issues that occur when a database is being designed and built"},{"key":"c","text":"Providing information for profit by creating a database of information collected in specific fields"},{"key":"d","text":"Managing user-built databases on behalf of users, in order to release information to the public"}],"correctAnswer":"c","explanation":"c) Providing information for profit by creating a database of information collected in specific fields"},{"id":"2011A-Q26","session":"Autumn 2011","category":null,"questionNumber":26,"prompt":"There is an order entry system that is used to enter and manage orders from customers. A numbering printer is used to print sequential order numbers on order forms in order of arrival unless the forms have mistakes such as missing information. When the order data shown below is entered in this order entry system, which of the following is the item that should be checked so as not to enter the duplicate order data?\n\n| Order data | Order number | Order date | Product code | Quantity | Customer code |","hasDiagram":false,"options":[{"key":"a","text":"Customer code"},{"key":"b","text":"Product code"},{"key":"c","text":"Order number"},{"key":"d","text":"Order date"}],"correctAnswer":"c","explanation":"c) Order number"},{"id":"2011A-Q27","session":"Autumn 2011","category":null,"questionNumber":27,"prompt":"As shown in the figure below, a LAN system comprises two PCs, one server, and one printer. When PC A cannot print any output data on the printer, which of the following should be applied to blank P in the problem determination flowchart? Here, both PCs can send output data directly to the printer without using the server.\n\n* Condition 1: Can PC B print data on the printer? $\\rightarrow$ Yes\n* Condition 2: Can PC A access the server? $\\rightarrow$ Yes\n* Outcome: **\\[ P \\]**","hasDiagram":true,"options":[{"key":"a","text":"PC A is not connected to the LAN system."},{"key":"b","text":"PC A has something wrong with output settings such as the print queue."},{"key":"c","text":"The LAN system does not work because of a failure in the hub."},{"key":"d","text":"The printer does not work because of a hardware failure."}],"correctAnswer":"b","explanation":"b) PC A has something wrong with output settings such as the print queue."},{"id":"2011A-Q28","session":"Autumn 2011","category":null,"questionNumber":28,"prompt":"Which of the following is an appropriate explanation of a router that allows messages to be sent between two or more networks?","hasDiagram":false,"options":[{"key":"a","text":"It performs connection at the data link layer, and provides the traffic isolation function."},{"key":"b","text":"It converts protocols including protocols above the transport layer, and interconnects networks with different types of network architecture."},{"key":"c","text":"It performs connection at the network layer, and is used for connecting LANs via wide-area networks."},{"key":"d","text":"It performs connection at the physical layer, and is used for extending the connection distance."}],"correctAnswer":"c","explanation":"c) It performs connection at the network layer, and is used for connecting LANs via wide-area networks."},{"id":"2011A-Q29","session":"Autumn 2011","category":null,"questionNumber":29,"prompt":"In order to implement communication between applications via a network, a number of protocols are used in a hierarchical structure. Which of the following is the appropriate combination of the protocol names to be inserted into blanks A and B in the description below?\n\n\"When a Web page is viewed via the Internet, the browser and the Web server use a protocol called **\\[ A \\]**. Communication over this **\\[ A \\]** uses a protocol of a lower layer called **\\[ B \\]** and a protocol of a further lower layer called IP (Internet Protocol).\"","hasDiagram":false,"options":[{"key":"a","text":"A: FTP (File Transfer Protocol), B: Ethernet"},{"key":"b","text":"A: HTTP (Hyper Text Transfer Protocol), B: TCP (Transmission Control Protocol)"},{"key":"c","text":"A: SMTP (Simple Mail Transfer Protocol), B: POP3 (Post Office Protocol version 3\\)"},{"key":"d","text":"A: WWW (World Wide Web), B: HTML (Hyper Text Markup Language)"}],"correctAnswer":"b","explanation":"b) A: HTTP (Hyper Text Transfer Protocol), B: TCP (Transmission Control Protocol)"},{"id":"2011A-Q30","session":"Autumn 2011","category":null,"questionNumber":30,"prompt":"Which of the following is an appropriate explanation concerning URL?","hasDiagram":false,"options":[{"key":"a","text":"It is a communications protocol between a Web page and a browser."},{"key":"b","text":"It is a message about the update history of a Web page."},{"key":"c","text":"It is grammar for describing the content (body) of a Web page."},{"key":"d","text":"It is a notation for representing the location of a Web page."}],"correctAnswer":"d","explanation":"d) It is a notation for representing the location of a Web page."},{"id":"2011A-Q31","session":"Autumn 2011","category":null,"questionNumber":31,"prompt":"When an e-mail message titled \"Returned mail: Host unknown\" is returned in response to an e-mail over the Internet, which of the following is a probable cause of this message?","hasDiagram":false,"options":[{"key":"a","text":"The recipient's mail server remains stopped."},{"key":"b","text":"In the recipient's address, the domain name after the @ symbol is incorrect."},{"key":"c","text":"The transmitted data is too large, so it exceeds the mail server's storage capacity."},{"key":"d","text":"The encoder used for the attached file is incompatible with the recipient's decoder."}],"correctAnswer":"b","explanation":"b) In the recipient's address, the domain name after the @ symbol is incorrect."},{"id":"2011A-Q32","session":"Autumn 2011","category":null,"questionNumber":32,"prompt":"A cookie is a small data file that a web site can transfer to a browser to maintain records of the visit to the web site. Among descriptions A through C concerning such a cookie, which of the following is a list of only the appropriate descriptions?\n\n* A: Since the cookie always inherits the ID and password entered during the last visit to a Web site, it is not necessary to enter them again when the Web site is viewed using another PC.\n* B: After a Web site is viewed from a temporarily PC rented at an Internet cafe or other places, the cookie should be deleted.\n* C: When personal information is stored in the cookie, such information may be stolen using cross site scripting or some other means.","hasDiagram":false,"options":[{"key":"a","text":"A, B"},{"key":"b","text":"A, B, C"},{"key":"c","text":"A, C"},{"key":"d","text":"B, C"}],"correctAnswer":"d","explanation":"d) B, C"},{"id":"2011A-Q33","session":"Autumn 2011","category":null,"questionNumber":33,"prompt":"Which of the following is an appropriate guideline for users concerning protection against computer viruses?","hasDiagram":false,"options":[{"key":"a","text":"When software is installed, the \"read-me\" file or other instructions should be read and followed prior to running a virus check."},{"key":"b","text":"The autostart function should be enabled as a preventive measure against virus infection via removable disc media."},{"key":"c","text":"The auto preview function should be disabled as a preventive measure against virus infection via e-mail."},{"key":"d","text":"File extension names should be hidden to prevent application software from being started automatically by identifying the type of file."}],"correctAnswer":"c","explanation":"c) The auto preview function should be disabled as a preventive measure against virus infection via e-mail."},{"id":"2011A-Q34","session":"Autumn 2011","category":null,"questionNumber":34,"prompt":"Which of the following is an appropriate description concerning a method used for phishing?","hasDiagram":false,"options":[{"key":"a","text":"If data entered in a Web page is displayed as is, a malicious script embedded in the page causes damage to users and servers."},{"key":"b","text":"Computers infected with a virus are controlled from outside via a network such as the Internet."},{"key":"c","text":"Computer user's personal information, such as IP address or Web browsing history, is secretly collected and sent outside."},{"key":"d","text":"E-mails, which pretend to be from an existing business or organization, are sent to lead recipients to a bogus Web site and to steal their personal information."}],"correctAnswer":"d","explanation":"d) E-mails, which pretend to be from an existing business or organization, are sent to lead recipients to a bogus Web site and to steal their personal information."},{"id":"2011A-Q35","session":"Autumn 2011","category":null,"questionNumber":35,"prompt":"When portable computers are used for remote access to data on an office server, which of the following is an effective security measure?","hasDiagram":false,"options":[{"key":"a","text":"The login screen of portable computers should be set up so that the previously entered user ID and password can be reused."},{"key":"b","text":"As much of the required data as possible should be copied onto the portable computers in order to keep network use to a minimum."},{"key":"c","text":"User IDs should be shared among multiple users so that unauthorized access can be detected easily."},{"key":"d","text":"One-time passwords should be used to allow access to the office server from a remote location."}],"correctAnswer":"d","explanation":"d) One-time passwords should be used to allow access to the office server from a remote location."},{"id":"2011A-Q36","session":"Autumn 2011","category":null,"questionNumber":36,"prompt":"Among information security measures A through D implemented in the workplace to maintain the \"confidentiality\" and \"integrity\" of information, which of the following is a list of only the appropriate measures?\n\n* A: PCs should remain unlocked to keep them ready for operation from the start to the end of the business day.\n* B: Documents and electronic storage media, such as CD-R containing important information, should be stored in locked cabinets except when they are used.\n* C: Documents sent or received by facsimile should be picked up immediately without leaving them unattended on the tray.\n* D: Messages or information written on the whiteboard should be erased immediately after use.","hasDiagram":false,"options":[{"key":"a","text":"A, B"},{"key":"b","text":"A, B, D"},{"key":"c","text":"B, D"},{"key":"d","text":"B, C, D"}],"correctAnswer":"d","explanation":"d) B, C, D"},{"id":"2011A-Q37","session":"Autumn 2011","category":null,"questionNumber":37,"prompt":"In system analysis and design, which of the following is described using DFD?","hasDiagram":false,"options":[{"key":"a","text":"Layout of items on a data entry screen"},{"key":"b","text":"Flow of data"},{"key":"c","text":"Physical structure of a database"},{"key":"d","text":"Procedure of a program"}],"correctAnswer":"b","explanation":"b) Flow of data"},{"id":"2011A-Q38","session":"Autumn 2011","category":null,"questionNumber":38,"prompt":"The upper bound of accounts receivable for each customer and the total value of the receivables up to now are recorded in the customer master file. Which of the following is the process that checks whether or not a new order should be received in consideration of the upper bound of accounts receivable?","hasDiagram":false,"options":[{"key":"a","text":"Sequence check"},{"key":"b","text":"Duplication check"},{"key":"c","text":"Format check"},{"key":"d","text":"Limit check"}],"correctAnswer":"d","explanation":"d) Limit check"},{"id":"2011A-Q39","session":"Autumn 2011","category":null,"questionNumber":39,"prompt":"One of the criteria for judging quality during the test phase is the relation between the number of test items completed and the cumulative number of bugs detected. Which of the following graphs indicates that the quality is going into a steady or stable state?","hasDiagram":true,"options":[{"key":"a","text":"Graph a (exponential increase)"},{"key":"b","text":"Graph b (irregular two-step increase)"},{"key":"c","text":"Graph c (linear constant increase)"},{"key":"d","text":"Graph d (S-curve that plateaus/levels off at the top)"}],"correctAnswer":"d","explanation":"d) Graph d"},{"id":"2011A-Q40","session":"Autumn 2011","category":null,"questionNumber":40,"prompt":"Which of the following is the test method that determines whether or not the output based on the system specifications is obtained for any given input with the focus on input and output only, and thereby verifies the functions that can be seen from the outside of the system regardless of its internal structure?","hasDiagram":false,"options":[{"key":"a","text":"Operational test"},{"key":"b","text":"Integration test"},{"key":"c","text":"Black box test"},{"key":"d","text":"White box test"}],"correctAnswer":"c","explanation":"c) Black box test"},{"id":"2011A-Q41","session":"Autumn 2011","category":null,"questionNumber":41,"prompt":"Among software development process models, which of the following is the model that aims to reach a high degree of completion of a system by iterating the development cycle in consideration of minimizing the risk in each cycle?","hasDiagram":false,"options":[{"key":"a","text":"Incremental model"},{"key":"b","text":"Waterfall model"},{"key":"c","text":"Spiral model"},{"key":"d","text":"Evolution model"}],"correctAnswer":"c","explanation":"c) Spiral model"},{"id":"2011A-Q42","session":"Autumn 2011","category":null,"questionNumber":42,"prompt":"Which of the following is an appropriate characteristic of a prototyping model?","hasDiagram":false,"options":[{"key":"a","text":"Development is promoted by evaluating and finalizing the specifications through creating trial models at an early stage of system development and then clarifying the user requirements."},{"key":"b","text":"Development is promoted by designing data processing and system operation through taking them into consideration as the extraction of targets as well as their attributes and procedures, rather than as the flow of procedures."},{"key":"c","text":"Development is promoted by starting with the development of partial functions, and then repeating the expansion and improvement of functions to satisfy user requirements."},{"key":"d","text":"Development is promoted by clearly distinguishing between development phases from requirements analysis through to testing, and then sequentially reviewing and verifying each phase from upstream to downstream."}],"correctAnswer":"a","explanation":"a) Development is promoted by evaluating and finalizing the specifications through creating trial models at an early stage of system development and then clarifying the user requirements."},{"id":"2011A-Q43","session":"Autumn 2011","category":null,"questionNumber":43,"prompt":"Which of the following is the most effective example of an arrow diagram?","hasDiagram":true,"options":[{"key":"a","text":"A launch event for a new product is planned so that the preparation of the venue, communication to interested parties, and other activities can make smooth progress."},{"key":"b","text":"When a building is designed and constructed, control is exerted over how to proceed with several activities so as not to delay the process."},{"key":"c","text":"When a theme is selected, problems are narrowed down to identify the significant problems or concerns to be solved."},{"key":"d","text":"Before a negotiation for the revision of transaction prices, several alternative plans are prepared in anticipation of the other party's attitude."}],"correctAnswer":"b","explanation":"b) When a building is designed and constructed, control is exerted over how to proceed with several activities so as not to delay the process."},{"id":"2011A-Q44","session":"Autumn 2011","category":null,"questionNumber":44,"prompt":"In the graph below, the probability that the actual project cost does not exceed the estimated cost is shown based on risk simulation. A total of 4.0 million dollars are reserved as project budget. In order to increase the probability that the actual cost does not exceeds the estimate up to 80%, how much money (in million dollars) should be additionally reserved?\n\n*(At 4.0 million dollars, the cumulative probability is 15%; at 5.0 million dollars, the probability reaches 80%)*","hasDiagram":true,"options":[{"key":"a","text":"1.0"},{"key":"b","text":"2.0"},{"key":"c","text":"5.0"},{"key":"d","text":"9.0"}],"correctAnswer":"a","explanation":"a) 1.0"},{"id":"2011A-Q45","session":"Autumn 2011","category":null,"questionNumber":45,"prompt":"Five weeks have passed since the start of a project whose schedule is shown by the arrow diagram below. At this time, the percentage of completion of each activity is as shown in the table below. For example, 80% of activity B is completed. In other words, it takes one more week (20% of 5 weeks) to complete activity B. When all the activities are evaluated based on the table, which of the following is the activity that causes a delay in the completion of the project? Here, the remaining activities make progress as initially planned.\n\n| Activity name | A | B | C | D | E | F | G |\n| :---- | :---- | :---- | :---- | :---- | :---- | :---- | :---- |\n| Required weeks | 4 | 5 | 2 | 1 | 4 | 4 | 8 |\n| Percentage of completion (%) | 100 | 80 | 100 | 100 | 25 | 0 | 25 |","hasDiagram":true,"options":[{"key":"a","text":"B"},{"key":"b","text":"E"},{"key":"c","text":"F"},{"key":"d","text":"G"}],"correctAnswer":"d","explanation":"d) G"},{"id":"2011A-Q46","session":"Autumn 2011","category":null,"questionNumber":46,"prompt":"At the request of a user department, the development department launches a project of system development. Which of the following is the most appropriate role of the project manager?","hasDiagram":false,"options":[{"key":"a","text":"Presenting the requirements of the system to the user department"},{"key":"b","text":"Monitoring the progress to take preventive measures against problems"},{"key":"c","text":"Preparing a proposal for the project on behalf of the user department"},{"key":"d","text":"Raising funds to carry out the project on behalf of both departments"}],"correctAnswer":"b","explanation":"b) Monitoring the progress to take preventive measures against problems"},{"id":"2011A-Q47","session":"Autumn 2011","category":null,"questionNumber":47,"prompt":"Which of the following is an appropriate index or indicator that is used to evaluate the quality of deliverables in a system development project?","hasDiagram":false,"options":[{"key":"a","text":"External procurement ratio"},{"key":"b","text":"Test coverage"},{"key":"c","text":"Total number of staff assigned"},{"key":"d","text":"Number of days spent on the project"}],"correctAnswer":"b","explanation":"b) Test coverage"},{"id":"2011A-Q48","session":"Autumn 2011","category":null,"questionNumber":48,"prompt":"Which of the following is the most appropriate item to be included in an SLA that is a contract defining expectations between an organization and the service vendor to provide an agreed upon level of support?","hasDiagram":false,"options":[{"key":"a","text":"Server performance"},{"key":"b","text":"Opening hours for services"},{"key":"c","text":"System operation cost"},{"key":"d","text":"Procedures to add new services"}],"correctAnswer":"b","explanation":"b) Opening hours for services"},{"id":"2011A-Q49","session":"Autumn 2011","category":null,"questionNumber":49,"prompt":"The figure below shows the \"service profit chain\" developed by James L. Heskett. Among the items to be inserted into blanks A through D in the figure, which of the following should be inserted into blank C?\n\n\\$\\$\\\\text{Workplace conditions} \\\\rightarrow \\\\text{A} \\\\rightarrow \\\\begin{cases} \\\\text{B} \\\\\\\\ \\\\text{Improvement of employee productivity} \\\\end{cases} \\\\rightarrow \\\\text{Improvement of customer service} \\\\rightarrow \\\\mathbf{C} \\\\rightarrow \\\\text{D} \\\\rightarrow \\\\text{Sales growth}\\$\\$","hasDiagram":true,"options":[{"key":"a","text":"Improvement of customer satisfaction"},{"key":"b","text":"Improvement of customer loyalty"},{"key":"c","text":"Improvement of employee retention rate"},{"key":"d","text":"Improvement of employee satisfaction"}],"correctAnswer":"a","explanation":"a) Improvement of customer satisfaction"},{"id":"2011A-Q50","session":"Autumn 2011","category":null,"questionNumber":50,"prompt":"Which of the following is a technology that is used to link computers to equipment such as PBX, in order to automatically respond to phone and FAX or to route them to their appropriate destinations?","hasDiagram":false,"options":[{"key":"a","text":"PAX (Private Automatic eXchange)"},{"key":"b","text":"VoIP (Voice over Internet Protocol)"},{"key":"c","text":"ISDN (Integrated Services Digital Network)"},{"key":"d","text":"CTI (Computer Telephony Integration)"}],"correctAnswer":"d","explanation":"d) CTI (Computer Telephony Integration)"},{"id":"2011A-Q51","session":"Autumn 2011","category":null,"questionNumber":51,"prompt":"Which of the following is the most appropriate method for computer system maintenance?","hasDiagram":false,"options":[{"key":"a","text":"Even if there is no system failure observed, a long-term maintenance plan should be made and carried out on a regular basis, in consideration of ensuring stable system operation."},{"key":"b","text":"Even if a failure occurs just before scheduled maintenance, the regular maintenance cycle should be kept by taking measures to continue system operation without stopping the system."},{"key":"c","text":"At the time of making a maintenance agreement with a service provider, it is advisable to consult and follow the provider's experienced specialist about details, such as maintenance methods and schedule."},{"key":"d","text":"It is important to perform maintenance work under the observation of users at the location where the system is installed, and on-site maintenance rather than remote maintenance should be conducted even in the distributed system."}],"correctAnswer":"a","explanation":"a) Even if there is no system failure observed, a long-term maintenance plan should be made and carried out on a regular basis, in consideration of ensuring stable system operation."},{"id":"2011A-Q52","session":"Autumn 2011","category":null,"questionNumber":52,"prompt":"Which of the following is the most appropriate description concerning the activity of changing an application system by the system operations department?","hasDiagram":false,"options":[{"key":"a","text":"Since it takes time to determine the priority for change requests, the change activity should be done in order of arrival."},{"key":"b","text":"Since it is difficult to predict the extent of impact of the change activity, all the employees should always be informed of the change."},{"key":"c","text":"Since the content of the change activity is important for identifying the cause of a failure, it should always be recorded."},{"key":"d","text":"The change activity should always be done late at night so as not to have an impact on users."}],"correctAnswer":"c","explanation":"c) Since the content of the change activity is important for identifying the cause of a failure, it should always be recorded."},{"id":"2011A-Q53","session":"Autumn 2011","category":null,"questionNumber":53,"prompt":"The private power generator is installed to protect a business server against electric power failure, but it takes one minute to provide a stable power supply after the power failure is detected. Which of the following devices is necessary to supply temporary power to the server during that one-minute period?","hasDiagram":false,"options":[{"key":"a","text":"A/D converter"},{"key":"b","text":"RAID"},{"key":"c","text":"UPS"},{"key":"d","text":"Firewall"}],"correctAnswer":"c","explanation":"c) UPS"},{"id":"2011A-Q54","session":"Autumn 2011","category":null,"questionNumber":54,"prompt":"When the operational status of an information system is audited, who is in an appropriate position to act as an auditor?","hasDiagram":false,"options":[{"key":"a","text":"A person who is independent of the system to be audited"},{"key":"b","text":"An operations manager of the system to be audited"},{"key":"c","text":"A staff member in charge of the operations of the system to be audited"},{"key":"d","text":"A consultant who advises on the operations of the system to be audited"}],"correctAnswer":"a","explanation":"a) A person who is independent of the system to be audited"},{"id":"2011A-Q55","session":"Autumn 2011","category":null,"questionNumber":55,"prompt":"In the flow of a system audit, which of the following is carried out by the auditee (i.e. the organization or person to be audited)?","hasDiagram":false,"options":[{"key":"a","text":"Verification of improvement"},{"key":"b","text":"Preparation of an audit plan"},{"key":"c","text":"Creation of an audit report"},{"key":"d","text":"Improvement of business operations"}],"correctAnswer":"d","explanation":"d) Improvement of business operations"},{"id":"2011A-Q56","session":"Autumn 2011","category":null,"questionNumber":56,"prompt":"A company monitors and manages business operations by establishing standards and operational procedures to prevent unlawful or unjustifiable acts, mistakes, errors, and other problems, and to ensure that the organization is run healthy, effectively, and efficiently. Which of the following is the most appropriate term that represents this policy or mechanism?","hasDiagram":false,"options":[{"key":"a","text":"Information ethics"},{"key":"b","text":"Internal design"},{"key":"c","text":"Internal control"},{"key":"d","text":"Privacy protection"}],"correctAnswer":"c","explanation":"c) Internal control"},{"id":"2011A-Q57","session":"Autumn 2011","category":null,"questionNumber":57,"prompt":"Which of the following is the most appropriate explanation of CSR that is becoming increasingly important for the competitiveness and sustainable success in every size of enterprises?","hasDiagram":false,"options":[{"key":"a","text":"A technique that a company uses to analyze the management styles and business processes of competitors and to learn and adopt their advantages"},{"key":"b","text":"A concept that a company can enhance its value by taking responsibility for the social and environmental impact of business activities"},{"key":"c","text":"A system for checking the management of a company to ensure that the power and authority of a management executive is exercised properly"},{"key":"d","text":"A core competence of a company, such as technology or skill, which provides the company's unique value that cannot be imitated by competitors"}],"correctAnswer":"b","explanation":"b) A concept that a company can enhance its value by taking responsibility for the social and environmental impact of business activities"},{"id":"2011A-Q58","session":"Autumn 2011","category":null,"questionNumber":58,"prompt":"Which of the following is the appropriate rule for \"brainstorming\" that is a method of resolving problems?","hasDiagram":false,"options":[{"key":"a","text":"Participants should select and present only high-quality ideas among their own ideas."},{"key":"b","text":"Participants should criticize another participant's ideas without hesitation."},{"key":"c","text":"Participants should avoid presenting better ideas based on another participant's."},{"key":"d","text":"Participants should listen to free-wheeling opinions, including unique ideas."}],"correctAnswer":"d","explanation":"d) Participants should listen to free-wheeling opinions, including unique ideas."},{"id":"2011A-Q59","session":"Autumn 2011","category":null,"questionNumber":59,"prompt":"Which of the following indicates a characteristic of management accounting?","hasDiagram":false,"options":[{"key":"a","text":"It is always necessary to verify every piece of accounting information based on evidence such as a written contract."},{"key":"b","text":"The calculation of profit and loss, as well as financial calculation, is done by department, by product, or by project, according to management needs."},{"key":"c","text":"Quantification of accounting information is limited to measurement on a monetary basis."},{"key":"d","text":"It is necessary to do calculations based on relevant laws such as the commercial law and tax law, not on economics or statistics."}],"correctAnswer":"b","explanation":"b) The calculation of profit and loss, as well as financial calculation, is done by department, by product, or by project, according to management needs."},{"id":"2011A-Q60","session":"Autumn 2011","category":null,"questionNumber":60,"prompt":"Company A manufactures and sells product B. Which of the following is the appropriate expression for calculating the total cost of product B? Here, the total cost refers to all the costs incurred until product B is sold.","hasDiagram":false,"options":[{"key":"a","text":"Sales of product B − Operating expense of product B"},{"key":"b","text":"Sales of product B − Manufacturing cost of product B"},{"key":"c","text":"Manufacturing cost of product B + Operating expense of product B"},{"key":"d","text":"Manufacturing cost of product B + Operating profit of product B"}],"correctAnswer":"c","explanation":"c) Manufacturing cost of product B + Operating expense of product B"},{"id":"2011A-Q61","session":"Autumn 2011","category":null,"questionNumber":61,"prompt":"Which of the following is the right that belongs to a purchaser of a PC software package provided by CD-ROM?","hasDiagram":false,"options":[{"key":"a","text":"Right to use the program stored in the CD-ROM"},{"key":"b","text":"Copyright of the program stored in the CD-ROM"},{"key":"c","text":"Design right of the CD-ROM storing the program"},{"key":"d","text":"Copyright of the CD-ROM storing the program"}],"correctAnswer":"a","explanation":"a) Right to use the program stored in the CD-ROM"},{"id":"2011A-Q62","session":"Autumn 2011","category":null,"questionNumber":62,"prompt":"Which of the following is the most appropriate example of e-mail transmission from the viewpoint of consideration for recipients?","hasDiagram":false,"options":[{"key":"a","text":"A questionnaire on member satisfaction is sent by e-mail to all the addresses of 100 selected members entered in the \"To\" (destination) field."},{"key":"b","text":"A large-size document presenting a company's products is sent to a customer as an e-mail attachment without being compressed."},{"key":"c","text":"A reply to an e-mail query about a product is sent to those customers who should know about the details, by entering their addresses in the \"Cc\" (carbon copy) field."},{"key":"d","text":"An e-mail is sent to the limited customers specified in the \"Bcc\" (blind carbon copy) field in order to inform them of the URL of a specially planned homepage."}],"correctAnswer":"d","explanation":"d) An e-mail is sent to the limited customers specified in the \"Bcc\" (blind carbon copy) field in order to inform them of the URL of a specially planned homepage."},{"id":"2011A-Q63","session":"Autumn 2011","category":null,"questionNumber":63,"prompt":"In the case of placing an order for a product on an Internet shopping site, at which point is the sales contract concluded?","hasDiagram":false,"options":[{"key":"a","text":"At the point in time when the consumer's purchase message reaches the shop"},{"key":"b","text":"At the point in time when the shop sends out an acceptance notice to the consumer"},{"key":"c","text":"At the point in time when the shop's acceptance notice reaches the consumer"},{"key":"d","text":"At the point in time when the ordered product reaches the consumer"}],"correctAnswer":"c","explanation":"c) At the point in time when the shop's acceptance notice reaches the consumer"},{"id":"2011A-Q64","session":"Autumn 2011","category":null,"questionNumber":64,"prompt":"Which of the following is an appropriate description concerning the two-dimensional code symbol?","hasDiagram":false,"options":[{"key":"a","text":"Information is read in the horizontal direction only, in the same way as the one-dimensional bar code."},{"key":"b","text":"Errors can be detected in both horizontal and vertical directions, but cannot be corrected."},{"key":"c","text":"When the area is equivalent in size to the one-dimensional bar code, more information can be recorded."},{"key":"d","text":"Since a matrix code has information in both horizontal and vertical directions, its adjustable reading angle is narrow."}],"correctAnswer":"c","explanation":"c) When the area is equivalent in size to the one-dimensional bar code, more information can be recorded."},{"id":"2011A-Q65","session":"Autumn 2011","category":null,"questionNumber":65,"prompt":"Which of the following is the most appropriate explanation of \"digital divide\" in relation to information technologies and services?","hasDiagram":false,"options":[{"key":"a","text":"It refers to the economic or social gap between those who take full advantage of information equipment and those who do not."},{"key":"b","text":"It refers to an environment where all people including handicapped people and senior citizens have access to the Internet by using information equipment."},{"key":"c","text":"It refers to the level of availability of information equipment and services for all people including handicapped people and senior citizens."},{"key":"d","text":"It refers to the people who cannot obtain information because of their lack of knowledge or skills about information equipment such as a PC."}],"correctAnswer":"a","explanation":"a) It refers to the economic or social gap between those who take full advantage of information equipment and those who do not."},{"id":"2011A-Q66","session":"Autumn 2011","category":null,"questionNumber":66,"prompt":"Which of the following is an activity of quality management based on ISO 9001:2008?","hasDiagram":false,"options":[{"key":"a","text":"Preventive actions for potential problems should be implemented at the field staff level and are therefore not reported to the management level."},{"key":"b","text":"Since an audit is performed by a third party on a regular schedule, no internal audit is performed."},{"key":"c","text":"Records related to quality are stored in a server in order to share the information among the interested parties."},{"key":"d","text":"Although a project consists of the company's employees and the partner company's employees, only the company's employees are informed of the quality policy."}],"correctAnswer":"c","explanation":"c) Records related to quality are stored in a server in order to share the information among the interested parties."},{"id":"2011A-Q67","session":"Autumn 2011","category":null,"questionNumber":67,"prompt":"Although a data warehouse is put into operation, it is seldom used. As a result of user interviews, it is concluded that the user's skill level is lower than expected. Which of the following is an appropriate plan to promote the utilization of the data warehouse?","hasDiagram":false,"options":[{"key":"a","text":"Sending a notification of usage promotion to users through their managers"},{"key":"b","text":"Preparing standard templates for data extraction and analysis patterns"},{"key":"c","text":"Providing data more promptly in real-time to improve data precision"},{"key":"d","text":"Adding more information that users are likely to need"}],"correctAnswer":"b","explanation":"b) Preparing standard templates for data extraction and analysis patterns"},{"id":"2011A-Q68","session":"Autumn 2011","category":null,"questionNumber":68,"prompt":"When two or more companies work together under an alliance agreement, which of the following is the most appropriate risk that is expected to be reduced?","hasDiagram":false,"options":[{"key":"a","text":"Business investment risk"},{"key":"b","text":"Information leakage risk"},{"key":"c","text":"Brain drain risk"},{"key":"d","text":"Fraud risk"}],"correctAnswer":"a","explanation":"a) Business investment risk"},{"id":"2011A-Q69","session":"Autumn 2011","category":null,"questionNumber":69,"prompt":"Which of the following is the most appropriate explanation of \"benchmarking\" used in business management?","hasDiagram":false,"options":[{"key":"a","text":"It is a tool to radically transform management practices and structures by redesigning business processes and making full use of information technology."},{"key":"b","text":"It is a tool to compare business processes and performance metrics with those of the strongest competitor or a leading company as a reference of best practices."},{"key":"c","text":"It is a tool to promote quality control across all departments, by reviewing the degree of product quality improvement in comparison with competitors."},{"key":"d","text":"It is a tool to identify a company's own original skills and technology that are highly profitable and superior to other companies."}],"correctAnswer":"b","explanation":"b) It is a tool to compare business processes and performance metrics with those of the strongest competitor or a leading company as a reference of best practices."},{"id":"2011A-Q70","session":"Autumn 2011","category":null,"questionNumber":70,"prompt":"Company A is evaluating the business strategy that was implemented last fiscal year. When the conditions are as shown in the table below, what is the score of the overall evaluation?\n\n| Classification | Strategic item | Target | Actual record | Evaluation method and criteria | Score weighting |\n| :---- | :---- | :---- | :---- | :---- | :---- |\n| Quantitative | Rate of increase in sales | 2.5% | 2.4% | 2% or higher: 110 points; over 1% and below 2%: 100 points; over 0% and below 1%: 90 points; otherwise 0 points | 0.5 |\n| Quantitative | Number of newly developed products | 2 | 1 | 2 or more: 110 points; 1: 100 points; otherwise 0 points | 0.3 |\n| Qualitative | Customer satisfaction | 4 | 4 | One or more ranks higher than the target: 100 points; otherwise 0 points | 0.2 |\n\n**\\[Method of the overall evaluation\\]**\n\n1. A score is calculated by using the evaluation method and criteria set for each strategic item.\n2. Each score calculated in (1) is multiplied by the specified weight, and then all weighted scores are added to obtain the total weighted score of the overall evaluation.","hasDiagram":false,"options":[{"key":"a","text":"75"},{"key":"b","text":"82"},{"key":"c","text":"85"},{"key":"d","text":"105"}],"correctAnswer":"c","explanation":"c) 85"},{"id":"2011A-Q71","session":"Autumn 2011","category":null,"questionNumber":71,"prompt":"A chain store with a distribution system is connected to the manufacturer via a computer network, in order to use it to determine optimal production volumes. Among the information collected by the chain store, which of the following is an appropriate combination of information required for the manufacturer?","hasDiagram":false,"options":[{"key":"a","text":"Inventory information and point-of-sale information"},{"key":"b","text":"Shelf allocation information and inventory information"},{"key":"c","text":"Shelf allocation information and inbound inventory information"},{"key":"d","text":"Inbound inventory information and point-of-sale information"}],"correctAnswer":"a","explanation":"a) Inventory information and point-of-sale information"},{"id":"2011A-Q72","session":"Autumn 2011","category":null,"questionNumber":72,"prompt":"Which of the following is the type of retailing where the headquarters provides the business right, the right to use the trademark, and know-how about opening and running stores, based on contracts with member stores, and collects royalties in return?","hasDiagram":false,"options":[{"key":"a","text":"Outlet store"},{"key":"b","text":"Antenna shop"},{"key":"c","text":"Franchise chain"},{"key":"d","text":"Voluntary chain"}],"correctAnswer":"c","explanation":"c) Franchise chain"},{"id":"2011A-Q73","session":"Autumn 2011","category":null,"questionNumber":73,"prompt":"Which of the following is an appropriate explanation of MOT (Management of Technology)?","hasDiagram":false,"options":[{"key":"a","text":"It is the business activity of a company gaining control of all or part of another company through merger or acquisition for the purpose of expanding the scale of operation."},{"key":"b","text":"It is the concept of management under which a company doing industrial business invests in scientific methods and materials to promote innovation and to grow business continuously."},{"key":"c","text":"It is the business activity of the management of a company raising funds from financial institutions and buying the stock to acquire the controlling interest of the company."},{"key":"d","text":"It is the material management technique for calculating the quantities of the components and materials necessary to produce a product and reflecting the results on the production plan."}],"correctAnswer":"b","explanation":"b) It is the concept of management under which a company doing industrial business invests in scientific methods and materials to promote innovation and to grow business continuously."},{"id":"2011A-Q74","session":"Autumn 2011","category":null,"questionNumber":74,"prompt":"An ERP (Enterprise Resource Planning) package is a suite of fully integrated software applications that are used to perform administrative business processes such as financial management, procurement, personnel, and payroll administration. Which of the following is the most appropriate description concerning such an ERP package?","hasDiagram":false,"options":[{"key":"a","text":"An ERP package can be installed with relative ease because the business processes of a company do not need to be analyzed."},{"key":"b","text":"An ERP package should be maintained by individual user departments after its installation."},{"key":"c","text":"An ERP package should be installed after business processes are verified and standardized."},{"key":"d","text":"An ERP package is system software integrated and designed especially for the business processes of domestic companies."}],"correctAnswer":"c","explanation":"c) An ERP package should be installed after business processes are verified and standardized."},{"id":"2011A-Q75","session":"Autumn 2011","category":null,"questionNumber":75,"prompt":"Which of the following is the system that records sales information when a product is sold at the store and that collects, accumulates, and analyzes product sales information for each product?","hasDiagram":false,"options":[{"key":"a","text":"CAD"},{"key":"b","text":"CIM"},{"key":"c","text":"EOS"},{"key":"d","text":"POS"}],"correctAnswer":"d","explanation":"d) POS"},{"id":"2011A-Q76","session":"Autumn 2011","category":null,"questionNumber":76,"prompt":"Which of the following is a technology that is defined by some international standards and used for contactless IC cards such as train or bus passes?","hasDiagram":false,"options":[{"key":"a","text":"IrDA"},{"key":"b","text":"RFID"},{"key":"c","text":"Bar code"},{"key":"d","text":"Wireless LAN"}],"correctAnswer":"b","explanation":"b) RFID"},{"id":"2011A-Q77","session":"Autumn 2011","category":null,"questionNumber":77,"prompt":"A factory is engaged in assembly production of product P that consists of components A and B. The processing of component A requires component C, and the processing period is one week. The delivery lead times of purchased components B and C are two weeks and three weeks, respectively. Product P can be assembled in one week only after components A and B are both delivered. What is the minimum number of weeks required to produce one unit of product P, including the delivery periods of the components? Here, there is no stock of any of the components.","hasDiagram":false,"options":[{"key":"a","text":"4"},{"key":"b","text":"5"},{"key":"c","text":"6"},{"key":"d","text":"7"}],"correctAnswer":"b","explanation":"b) 5"},{"id":"2011A-Q78","session":"Autumn 2011","category":null,"questionNumber":78,"prompt":"As shown below, data in CSV format is entered using spreadsheet software and then calculation formulas are entered in cells D1, D2, and D3. Which of the following numeric values is displayed in cell D3? Here, data in CSV format is entered sequentially from the leftmost cell in the first row, and a carriage return code (CR) causes the active cell to move to the leftmost cell in the next row. When a numeric value is entered in a cell, values in other cells are re-calculated immediately.\n\n* Data in CSV format: 2 , 2 , 4 (CR) 1 , 3 , 4 (CR) 2 , 1 , 1 (CR)\n* Calculation formula of cell D1: A1 + C3\n* Calculation formula of cell D2: B1 + B3\n* Calculation formula of cell D3: D1 + D2\n\n*(The worksheet has columns A–D and rows 1–3; the answer is the value shown in cell D3.)*","hasDiagram":false,"options":[{"key":"a","text":"6"},{"key":"b","text":"7"},{"key":"c","text":"8"},{"key":"d","text":"9"}],"correctAnswer":"a","explanation":"a) 6"},{"id":"2011A-Q79","session":"Autumn 2011","category":null,"questionNumber":79,"prompt":"Which of the following is categorized as \"embedded software\" that is generally written for special-purpose microchips, not for general-purpose CPUs?","hasDiagram":false,"options":[{"key":"a","text":"Software that is used for designing, drawing, and other tasks for industrial products"},{"key":"b","text":"Software that controls the amount of fuel supplied to the engine of an automobile"},{"key":"c","text":"Software that is used on a PC to edit images taken by a digital camera"},{"key":"d","text":"Software that performs macro calculation as a function of spreadsheet software"}],"correctAnswer":"b","explanation":"b) Software that controls the amount of fuel supplied to the engine of an automobile"},{"id":"2011A-Q80","session":"Autumn 2011","category":null,"questionNumber":80,"prompt":"Which of the following is an explanation of \"contact management\" that is a basic function of SFA (Sales Force Automation)?","hasDiagram":false,"options":[{"key":"a","text":"Sales efficiency is enhanced by taking prompt action on every inquiry from salespersons."},{"key":"b","text":"The order receiving rate is increased by having the entire sales organization respond to a customer, rather than having only a single salesperson respond to the customer."},{"key":"c","text":"A set of records including customer visiting days and sales results is managed, in order to perform effective sales activities for prospective and existing customers."},{"key":"d","text":"Sales techniques accumulated on an individual basis are identified and shared, in order to improve the performance level of the entire sales department."}],"correctAnswer":"c","explanation":"c) A set of records including customer visiting days and sales results is managed, in order to perform effective sales activities for prospective and existing customers."},{"id":"2011A-Q81","session":"Autumn 2011","category":null,"questionNumber":81,"prompt":"Which of the following is the chief position that has direct responsibility for developing and implementing information systems strategy based on business strategy?","hasDiagram":false,"options":[{"key":"a","text":"CCO"},{"key":"b","text":"CFO"},{"key":"c","text":"CIO"},{"key":"d","text":"COO"}],"correctAnswer":"c","explanation":"c) CIO"},{"id":"2011A-Q82","session":"Autumn 2011","category":null,"questionNumber":82,"prompt":"Which of the following is used for accumulating and consolidating a large amount of data acquired through various business activities and thereby providing the helpful and meaningful data as a management tool such as a decision-making support system?","hasDiagram":false,"options":[{"key":"a","text":"Data mapping"},{"key":"b","text":"Data warehouse"},{"key":"c","text":"Data dictionary"},{"key":"d","text":"Data modeling"}],"correctAnswer":"b","explanation":"b) Data warehouse"},{"id":"2011A-Q83","session":"Autumn 2011","category":null,"questionNumber":83,"prompt":"Company A, which manufactures and sells house building materials, identifies a problem with its logistics operation and develops an improvement plan to resolve the problem. Which of the following is the most appropriate mechanism or function to be computerized to implement the improvement plan?\n\n**\\[Problem\\]**\nSince it takes several days to deliver the product ordered by a sales office, each sales office has in stock all of the products dealt with by the company in fear of being out of stock. As a result, an enormous inventory cost is incurred by Company A as a whole.\n\n**\\[Improvement plan\\]**\nA logistics warehouse is built in the major territory of the sales area, and delivery trucks are allocated so that any product can be delivered on the day the order from the sales office is received.","hasDiagram":false,"options":[{"key":"a","text":"A mechanism that enables sales offices to inquire the number of new housing starts in their sales territories"},{"key":"b","text":"A mechanism that enables sales offices to immediately inform the logistics warehouse about the order details"},{"key":"c","text":"A mechanism that enables the manager of each sales office to understand the current inventory cost"},{"key":"d","text":"An analysis function that enables management to compare and review the sales performance of individual sales offices"}],"correctAnswer":"b","explanation":"b) A mechanism that enables sales offices to immediately inform the logistics warehouse about the order details"},{"id":"2011A-Q84","session":"Autumn 2011","category":null,"questionNumber":84,"prompt":"When system development is outsourced for the purpose of constructing a system, which of the following is an appropriate item to be considered?","hasDiagram":false,"options":[{"key":"a","text":"Placing an order with a reliable outsourcee in order to complete the acceptance test in a simple and easy way"},{"key":"b","text":"Monitoring the progress of development on the outsourcer side in order to find and resolve problems early"},{"key":"c","text":"Entrusting all tasks, including the determination of the specifications of business operations, to an outsourcee who is familiar with the business operations"},{"key":"d","text":"Giving detailed instructions on outsourced tasks down to each staff member, even if the outsourcee is reliable"}],"correctAnswer":"b","explanation":"b) Monitoring the progress of development on the outsourcer side in order to find and resolve problems early"},{"id":"2011A-Q85","session":"Autumn 2011","category":null,"questionNumber":85,"prompt":"When computerization of an information system is planned, which of the following is the most appropriate item to be considered?","hasDiagram":false,"options":[{"key":"a","text":"Promoting a study of developing the system as much as possible by a company's own staff, in consideration of system operations"},{"key":"b","text":"Installing an equivalent system used by other companies in the same industry in order to avoid failures"},{"key":"c","text":"Describing specifically the initiative of computerization, the operation manuals, and the measures against system failures"},{"key":"d","text":"Clarifying the effectiveness of the information system as well as the return on investment"}],"correctAnswer":"d","explanation":"d) Clarifying the effectiveness of the information system as well as the return on investment"},{"id":"2011A-Q86","session":"Autumn 2011","category":null,"questionNumber":86,"prompt":"When an error message displayed by an application program is designed, which of the following is an appropriate item to be considered?","hasDiagram":false,"options":[{"key":"a","text":"Only the fact and details of the error, rather than the way of handling the error, should be displayed."},{"key":"b","text":"Only the information that system developers need to identify the cause of the error should be displayed."},{"key":"c","text":"Since it is desirable that the error message be as short as possible, the abbreviation and error code should be displayed as they are."},{"key":"d","text":"Action to be taken by the user should be displayed briefly and precisely with the error message."}],"correctAnswer":"d","explanation":"d) Action to be taken by the user should be displayed briefly and precisely with the error message."},{"id":"2011A-Q87","session":"Autumn 2011","category":null,"questionNumber":87,"prompt":"In the figure below, blanks A through D represent the transaction process that is used when Company X exchanges the forms or documents with the customer. When time progresses from left to right, which of the following should be inserted into blank B? Here, each of blanks A through D corresponds to one of the options \"a)\" through \"d)\".\n*(Figure, left to right: \"Estimate\" (Company X → Customer), A (Customer → Company X), B (Company X → Customer), C (Customer → Company X), D (Company X → Customer).)*","hasDiagram":true,"options":[{"key":"a","text":"Acceptance inspection"},{"key":"b","text":"Debit note"},{"key":"c","text":"Confirmation of order"},{"key":"d","text":"Purchase order"}],"correctAnswer":"c","explanation":"c) Confirmation of order"},{"id":"2011A-Q88","session":"Autumn 2011","category":null,"questionNumber":88,"prompt":"Which of the following is an explanation of \"acceptance inspection\" performed for a vendor?","hasDiagram":false,"options":[{"key":"a","text":"Checking the estimate submitted by the vendor prior to placing an order based on that estimate"},{"key":"b","text":"Checking whether the deliverables provided by the vendor conform to the requirements specifications"},{"key":"c","text":"Requesting the vendor to study and submit the proposal for the construction of a new system"},{"key":"d","text":"Requesting the vendor to provide information for the purpose of collecting information"}],"correctAnswer":"b","explanation":"b) Checking whether the deliverables provided by the vendor conform to the requirements specifications"},{"id":"2011A-Q89","session":"Autumn 2011","category":null,"questionNumber":89,"prompt":"**\\[Question A — Software test of a charge calculation program (Q89–Q92)\\]**\nMr. M is asked by Mr. N of the general affairs department to create a charge calculation program (the program) used in home-delivery operation. Mr. M summarizes the requirements as described below and creates the program.\n\n1. The charge is calculated from Table 1 according to the size category and the shipping area. The three-side size (total of the depth, width, and height in centimeters) of the package is compared with the weight (in kilograms), and whichever category having the larger value is used as the size category. A package with three-side size over 140 cm or with weight over 20 kg is not accepted.\n2. When the three-side size, weight, and shipping area (A through D) of the package are entered, the charge is displayed.\n\n**Table 1 Charge table** (Unit: dollar)\n\n| Category | Three-side size (cm) | Weight (kg) | Area A | Area B | Area C | Area D |\n| :---- | :---- | :---- | :---- | :---- | :---- | :---- |\n| 1 | Up to 80 | Up to 5 | 13 | 10 | 12 | 18 |\n| 2 | Up to 100 | Up to 10 | 16 | 12 | 14 | 24 |\n| 3 | Up to 140 | Up to 20 | 20 | 16 | 18 | 34 |\n\nBefore conducting the test, Mr. M creates an output result table (Table 2) listing all 36 combinations of shipping area (4) × three-side size range (3) × weight range (3) with their expected outputs, and prepares test data based on this table.\n\nWhich of the following is an appropriate reason why Mr. M creates the output result table shown in Table 2 in order to prepare the data used to test the program?","hasDiagram":false,"options":[{"key":"a","text":"To prepare test data covering all the possible cases identified based on the requirements and then perform those test cases"},{"key":"b","text":"To prepare test data used to trace the execution order of the program instructions and then conduct a test to check whether they are executed in the designed order"},{"key":"c","text":"To prepare test data for the cases that occur frequently based on the specifications and then conduct a test efficiently with a small number of test cases"},{"key":"d","text":"To prepare test data for the cases likely to cause processing errors and then conduct a reliability test on the program"}],"correctAnswer":"a","explanation":"a) To prepare test data covering all the possible cases identified based on the requirements and then perform those test cases"},{"id":"2011A-Q90","session":"Autumn 2011","category":null,"questionNumber":90,"prompt":"**\\[Question A — Software test of a charge calculation program (Q89–Q92)\\]**\nThe size category is whichever of the three-side size category and the weight category is larger. Charges (dollars):\n\n| Category | Three-side size (cm) | Weight (kg) | Area A | Area B | Area C | Area D |\n| :---- | :---- | :---- | :---- | :---- | :---- | :---- |\n| 1 | Up to 80 | Up to 5 | 13 | 10 | 12 | 18 |\n| 2 | Up to 100 | Up to 10 | 16 | 12 | 14 | 24 |\n| 3 | Up to 140 | Up to 20 | 20 | 16 | 18 | 34 |\n\n**Table 2 Output result table** (part; \"Yes\" marks the values each column's input data corresponds to)\n\n| Column | 1 | 2 | 3 | 4 | 5 | 6 | … | 36 |\n| :---- | :---- | :---- | :---- | :---- | :---- | :---- | :---- | :---- |\n| Shipping area | A | A | A | A | A | A | … | D |\n| Three-side size | Up to 80 | Up to 80 | Up to 80 | Up to 100 | Up to 100 | Up to 100 | … | Up to 140 |\n| Weight | Up to 5 | Up to 10 | Up to 20 | Up to 5 | Up to 10 | Up to 20 | … | Up to 20 |\n| Expected output | (not shown) | (not shown) | **X** | (not shown) | (not shown) | (not shown) | … | (not shown) |\n\nWhich of the following is the expected output to be inserted into blank X shown in Table 2?","hasDiagram":false,"options":[{"key":"a","text":"13"},{"key":"b","text":"16"},{"key":"c","text":"20"},{"key":"d","text":"34"}],"correctAnswer":"c","explanation":"c) 20"},{"id":"2011A-Q91","session":"Autumn 2011","category":null,"questionNumber":91,"prompt":"**\\[Question A — Software test of a charge calculation program (Q89–Q92)\\]**\nThe size category is whichever of the three-side size category and the weight category is larger. Charges (dollars):\n\n| Category | Three-side size (cm) | Weight (kg) | Area A | Area B | Area C | Area D |\n| :---- | :---- | :---- | :---- | :---- | :---- | :---- |\n| 1 | Up to 80 | Up to 5 | 13 | 10 | 12 | 18 |\n| 2 | Up to 100 | Up to 10 | 16 | 12 | 14 | 24 |\n| 3 | Up to 140 | Up to 20 | 20 | 16 | 18 | 34 |\n\nThe table below shows part of the results of the actual test conducted using test data (shipping area, three-side size, and weight). Which of the following is the appropriate judgment about these results?\n\n| Shipping area | Three-side size (cm) | Weight (kg) | Output result (dollar) |\n| :---- | :---- | :---- | :---- |\n| C | 60 | 5 | 14 |\n| C | 101 | 8 | 18 |\n| D | 60 | 5 | 24 |\n| D | 101 | 8 | 34 |","hasDiagram":false,"options":[{"key":"a","text":"The output results with a three-side size of 60 cm and a weight of 5 kg are wrong."},{"key":"b","text":"The output results with a size category of category 3 are wrong."},{"key":"c","text":"No output result is wrong."},{"key":"d","text":"Only the output results for shipping area C are wrong."}],"correctAnswer":"a","explanation":"a) The output results with a three-side size of 60 cm and a weight of 5 kg are wrong."},{"id":"2011A-Q92","session":"Autumn 2011","category":null,"questionNumber":92,"prompt":"**\\[Question A — Software test of a charge calculation program (Q89–Q92)\\]**\nIn the output result table (Table 2), each column is one combination of shipping area, three-side size range, and weight range:\n\n| Column | 1 | 2 | 3 | 4 | 5 (Y) | 6 (Z) | … | 36 |\n| :---- | :---- | :---- | :---- | :---- | :---- | :---- | :---- | :---- |\n| Shipping area | A | A | A | A | A | A | … | D |\n| Three-side size | Up to 80 | Up to 80 | Up to 80 | Up to 100 | Up to 100 | Up to 100 | … | Up to 140 |\n| Weight | Up to 5 | Up to 10 | Up to 20 | Up to 5 | Up to 10 | Up to 20 | … | Up to 20 |\n\nThe ranges are: three-side size up to 80 / up to 100 / up to 140 cm; weight up to 5 / up to 10 / up to 20 kg. Which of the following is the appropriate combination of test data (shipping area, three-side size, and weight) displayed in columns Y and Z of the output result table shown in Table 2?","hasDiagram":false,"options":[{"key":"a","text":"Column Y: A, 80, 10 — Column Z: A, 80, 20"},{"key":"b","text":"Column Y: A, 90, 10 — Column Z: A, 90, 11"},{"key":"c","text":"Column Y: A, 90, 11 — Column Z: A, 90, 21"},{"key":"d","text":"Column Y: A, 100, 5 — Column Z: A, 100, 10"}],"correctAnswer":"b","explanation":"b) Column Y: A, 90, 10 — Column Z: A, 90, 11"},{"id":"2011A-Q93","session":"Autumn 2011","category":null,"questionNumber":93,"prompt":"**\\[Question B — Room entry control for facilities (Q93–Q96)\\]**\nSales branch T of Company S plans to install a room entry control system that uses ID cards. Facilities and the categories of people subject to control (target categories) are classified as shown below, and permission categories are set (✓ = entry permitted, – = entry not permitted).\n\n| Facility | Visitor | Sales department staff |\n| :---- | :---- | :---- |\n| Office | – | ✓ |\n| Reception room | ✓ | ✓ |\n\nPermission categories are entered in these setting formats: **Format 1:** Policy | Permission category | (unused). **Format 2:** Facility | Permission category | Target category.\n\n1. Format 1 is described on the first line, and format 2 on as many lines as necessary from the second line.\n2. The permission category is \"ACCEPT\" when entry is permitted and \"DENY\" when it is not.\n3. Format 1 (\"Policy\") specifies the permission category applied to any combination of facility and target category that does not correspond to any of the combinations described on the second and subsequent lines.\n4. Format 2 describes combinations of a facility and target categories with their permission category. Multiple target categories with the same permission category for a facility can be separated by commas.\n5. The second and subsequent lines are checked in the order listed. When the line containing the specified combination is found, its permission category is applied and the subsequent lines are not checked.\n\nWhen the permission category for Policy is set to \"ACCEPT\", the setting for the table above is: line 1 \"Policy ACCEPT\", line 2 \"Office DENY Visitor\". When the permission category for \"Policy\" is set to \"DENY\", which of the following is the appropriate description of the setting?","hasDiagram":false,"options":[{"key":"a","text":"Policy DENY / Office ACCEPT Sales department staff"},{"key":"b","text":"Policy DENY / Reception room ACCEPT Visitor, Sales department staff"},{"key":"c","text":"Policy DENY / Office DENY Visitor / Reception room ACCEPT Visitor, Sales department staff"},{"key":"d","text":"Policy DENY / Office ACCEPT Sales department staff / Reception room ACCEPT Visitor, Sales department staff"}],"correctAnswer":"d","explanation":"d) Policy DENY / Office ACCEPT Sales department staff / Reception room ACCEPT Visitor, Sales department staff"},{"id":"2011A-Q94","session":"Autumn 2011","category":null,"questionNumber":94,"prompt":"**\\[Question B — Room entry control for facilities (Q93–Q96)\\]**\nSettings are written as: line 1 \"Policy\" + permission category (ACCEPT or DENY), applied to every combination not listed below it; then one line per facility in the form \"Facility, permission category, target categories\" (several target categories with the same permission category for a facility can be separated by commas). Lines are checked in order and the first match is applied.\n\nRegarding the setting of the permission categories shown in the table below (✓ = entry permitted, – = not permitted), when the permission category for \"Policy\" in format 1 is set to \"DENY\", what is the minimum number of lines required for describing the setting, including the line describing format 1?\n\n| Facility | Visitor | Sales department staff | Engineering department staff |\n| :---- | :---- | :---- | :---- |\n| Conference room | – | ✓ | ✓ |\n| Office 1 | – | ✓ | – |\n| Office 2 | – | – | ✓ |\n| Reception room | ✓ | ✓ | ✓ |","hasDiagram":false,"options":[{"key":"a","text":"4"},{"key":"b","text":"5"},{"key":"c","text":"6"},{"key":"d","text":"7"}],"correctAnswer":"b","explanation":"b) 5"},{"id":"2011A-Q95","session":"Autumn 2011","category":null,"questionNumber":95,"prompt":"**\\[Question B — Room entry control for facilities (Q93–Q96)\\]**\nSettings are written as: line 1 \"Policy\" + permission category, applied to every combination not listed; then lines of \"Facility, permission category, target categories\". Lines are checked in order and the first matching line is applied.\n\nRegarding the setting of the permission categories shown in the table below (✓ = permitted, – = not permitted), when the permission category for \"Policy\" is set to \"ACCEPT\", the description of the setting is as shown in Fig. 1. As entry into the special conference room is permitted for managers, a new target category \"Manager\" is created and the description of the setting shown in Fig. 2 is inserted. Among (1) through (4) shown in Fig. 1, which is the appropriate position where the setting shown in Fig. 2 is inserted? Here, the managers of the sales department and the engineering department belong to the target category \"Manager\", and both managers also belong to the target categories of the staff of their respective departments. When a person belongs to two target categories, the permission category of the first line matching the facility and either of the target categories is applied.\n\n| Facility | Visitor | Sales department staff | Engineering department staff |\n| :---- | :---- | :---- | :---- |\n| Special conference room | – | – | – |\n| Conference room | – | ✓ | ✓ |\n| Office 1 | – | ✓ | – |\n| Office 2 | – | – | ✓ |\n| Reception room | ✓ | ✓ | ✓ |\n\n**Fig. 1 Description of the setting when the permission category for Pol
