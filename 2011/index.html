icy is set to ACCEPT** (insertion points in brackets)\n\n* Policy ACCEPT\n* **(1)**\n* Special conference room DENY Visitor, Sales department staff, Engineering department staff\n* **(2)**\n* Conference room DENY Visitor\n* **(3)**\n* Office 1 DENY Visitor, Engineering department staff\n* Office 2 DENY Visitor, Sales department staff\n* **(4)**\n\n**Fig. 2 Description of the additional setting:** Special conference room ACCEPT Manager","hasDiagram":false,"options":[{"key":"a","text":"(1)"},{"key":"b","text":"(2)"},{"key":"c","text":"(3)"},{"key":"d","text":"(4)"}],"correctAnswer":"a","explanation":"a) (1)"},{"id":"2011A-Q96","session":"Autumn 2011","category":null,"questionNumber":96,"prompt":"**\\[Question B — Room entry control for facilities (Q93–Q96)\\]**\nIn the room entry control system, the \"Policy\" line sets the permission category (ACCEPT or DENY) that is applied to any combination of facility and target category not described on the following lines (format 2).\n\nIn preparation for a lack of format 2 when a new facility or target category is inserted, which of the following is the appropriate method for setting the permission category for \"Policy\" from the viewpoint of security?","hasDiagram":false,"options":[{"key":"a","text":"\"ACCEPT\" is set so that entry is not allowed if any setting is missing."},{"key":"b","text":"\"DENY\" is set so that entry is not allowed if any setting is missing."},{"key":"c","text":"\"ACCEPT\" is set so that entry is allowed even if any setting is missing."},{"key":"d","text":"\"DENY\" is set so that entry is allowed even if any setting is missing."}],"correctAnswer":"b","explanation":"b) \"DENY\" is set so that entry is not allowed if any setting is missing."},{"id":"2011A-Q97","session":"Autumn 2011","category":null,"questionNumber":97,"prompt":"**\\[Question C — Activity plan for a system switchover (Q97–Q100)\\]**\nThe information systems department of Company E is planning to install a new sales management system. Mr. F is assigned to estimate the activity time required to switch from the existing system to the new one. The list of the activity plan is as shown in the table below.\n\n| Activity number | Activity | Planned activity time (hours) | Preceding activity number |\n| :---- | :---- | :---- | :---- |\n| 1 | Shutdown of system services | 0.5 | None |\n| 2 | Backup of the system | 2.0 | 1 |\n| 3 | Extraction of migration data | 1.0 | 1 |\n| 4 | Installation of software | 3.0 | 2, 3 |\n| 5 | Setup of the system | 2.0 | 4 |\n| 6 | Input of migration data | 3.0 | 4 |\n| 7 | Preparation of an operation check list | 1.5 | 4 |\n| 8 | Operation check | 2.0 | 5, 6, 7 |\n\nMr. F organizes the contents of the table in order to calculate the total activity time. From the series of activities, he extracts those that can be performed concurrently. Which of the following is a list of all the combinations of activities that can be performed concurrently? Here, the activities that can be performed concurrently are shown within brackets.","hasDiagram":false,"options":[{"key":"a","text":"\\[2, 3\\]"},{"key":"b","text":"\\[2, 3\\] and \\[4, 5, 6\\]"},{"key":"c","text":"\\[2, 3\\] and \\[5, 6, 7\\]"},{"key":"d","text":"\\[5, 6, 7\\]"}],"correctAnswer":"c","explanation":"c) \\[2, 3\\] and \\[5, 6, 7\\]"},{"id":"2011A-Q98","session":"Autumn 2011","category":null,"questionNumber":98,"prompt":"**\\[Question C — Activity plan for a system switchover (Q97–Q100)\\]**\n\n| Activity number | Activity | Planned activity time (hours) | Preceding activity number |\n| :---- | :---- | :---- | :---- |\n| 1 | Shutdown of system services | 0.5 | None |\n| 2 | Backup of the system | 2.0 | 1 |\n| 3 | Extraction of migration data | 1.0 | 1 |\n| 4 | Installation of software | 3.0 | 2, 3 |\n| 5 | Setup of the system | 2.0 | 4 |\n| 6 | Input of migration data | 3.0 | 4 |\n| 7 | Preparation of an operation check list | 1.5 | 4 |\n| 8 | Operation check | 2.0 | 5, 6, 7 |\n\nIn consideration of the total activity time, Mr. F reviews the sequence of the activities listed in the table and the required time. Which of the following represents the sequence of the activities on the critical path? Here, the arrows are used to represent the sequence of the activities.","hasDiagram":false,"options":[{"key":"a","text":"1 → 2 → 4 → 5 → 8"},{"key":"b","text":"1 → 2 → 4 → 6 → 8"},{"key":"c","text":"1 → 3 → 4 → 6 → 8"},{"key":"d","text":"1 → 3 → 4 → 7 → 8"}],"correctAnswer":"b","explanation":"b) 1 → 2 → 4 → 6 → 8"},{"id":"2011A-Q99","session":"Autumn 2011","category":null,"questionNumber":99,"prompt":"**\\[Question C — Activity plan for a system switchover (Q97–Q100)\\]**\n\n| Activity number | Activity | Planned activity time (hours) | Preceding activity number |\n| :---- | :---- | :---- | :---- |\n| 1 | Shutdown of system services | 0.5 | None |\n| 2 | Backup of the system | 2.0 | 1 |\n| 3 | Extraction of migration data | 1.0 | 1 |\n| 4 | Installation of software | 3.0 | 2, 3 |\n| 5 | Setup of the system | 2.0 | 4 |\n| 6 | Input of migration data | 3.0 | 4 |\n| 7 | Preparation of an operation check list | 1.5 | 4 |\n| 8 | Operation check | 2.0 | 5, 6, 7 |\n\nMr. F calculates the minimum time required to complete all the activities listed in the table. How many hours is that time?","hasDiagram":false,"options":[{"key":"a","text":"10.0"},{"key":"b","text":"10.5"},{"key":"c","text":"11.0"},{"key":"d","text":"11.5"}],"correctAnswer":"b","explanation":"b) 10.5"},{"id":"2011A-Q100","session":"Autumn 2011","category":null,"questionNumber":100,"prompt":"**\\[Question C — Activity plan for a system switchover (Q97–Q100)\\]**\n\n| Activity number | Activity | Planned activity time (hours) | Preceding activity number |\n| :---- | :---- | :---- | :---- |\n| 1 | Shutdown of system services | 0.5 | None |\n| 2 | Backup of the system | 2.0 | 1 |\n| 3 | Extraction of migration data | 1.0 | 1 |\n| 4 | Installation of software | 3.0 | 2, 3 |\n| 5 | Setup of the system | 2.0 | 4 |\n| 6 | Input of migration data | 3.0 | 4 |\n| 7 | Preparation of an operation check list | 1.5 | 4 |\n| 8 | Operation check | 2.0 | 5, 6, 7 |\n\nMr. F calculates the total activity time, but the calculated time is longer than initially expected. His superior therefore instructs him to consider a method for reducing the time. Which of the following is the appropriate method that most reduces the total activity time listed in the table? Here, the activities that can be performed concurrently are all performed in parallel and simultaneously.","hasDiagram":false,"options":[{"key":"a","text":"Reducing the time of activity 2 by 1.5 hours"},{"key":"b","text":"Reducing the time of activity 4 by 1.5 hours"},{"key":"c","text":"Reducing the time of activity 5 by 1.5 hours"},{"key":"d","text":"Reducing the time of activity 6 by 2.0 hours"}],"correctAnswer":"b","explanation":"b) Reducing the time of activity 4 by 1.5 hours"}]};

(function () {
  "use strict";
  const QS = EXAM.questions;
  const BY_ID = new Map(QS.map((q) => [q.id, q]));
  const STORE_KEY = "philnits:" + EXAM.year + ":v1";
  const $ = (s) => document.querySelector(s);

  // ---------- persistence ----------
  const defaults = () => ({ answers: {}, revealed: {}, bookmarks: {}, view: "quiz", order: null, filters: { q: "", session: "", status: "all" } });
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && typeof s === "object") return Object.assign(defaults(), s);
    } catch (e) {}
    return defaults();
  }
  let state = load();
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- markdown + math rendering ----------
  const ESC_CHARS = "\\`*_{}[]()#+-.!<>$|~\"'=&";
  const htmlEsc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Source uses "\$\\checkmark\$" for escaped math; normalise to "$\checkmark$".
  const normalise = (s) => s.replace(/\\\$\\\\([a-zA-Z]+)\\\$/g, (_, c) => "$\\" + c + "$");

  // "$...$" is math only when not glued to letters/digits (keeps spreadsheet refs like $A$36 or B$3 literal).
  const RE_MATH = /(^|[^\\A-Za-z0-9$])\$([^$\n]+?)\$(?![A-Za-z0-9$])/g;

  function extractMath(s, store) {
    return s.replace(RE_MATH, (m, pre, tex) => {
      if (/^\s|\s$/.test(tex)) return m;
      store.push(tex);
      return pre + "\uE000" + (store.length - 1) + "\uE000";
    });
  }

  function renderTex(tex) {
    if (window.katex) {
      try { return katex.renderToString(tex, { throwOnError: false }); } catch (e) {}
    }
    return htmlEsc(texToPlain(tex));
  }

  function texToPlain(tex) {
    const map = { times: "×", rightarrow: "→", leftarrow: "←", Rightarrow: "⇒", leftrightarrow: "↔", checkmark: "✓", div: "÷", le: "≤", leq: "≤", ge: "≥", geq: "≥", ne: "≠", neq: "≠", cdot: "·", pm: "±", infty: "∞", approx: "≈", sqrt: "√" };
    return tex
      .replace(/\\([a-zA-Z]+)\s?/g, (m, c) => (c in map ? map[c] : m))
      .replace(/\^\{([^}]*)\}/g, "^$1").replace(/_\{([^}]*)\}/g, "_$1")
      .replace(/[{}]/g, "").replace(/\\ /g, " ");
  }

  function inline(src) {
    const math = [], escs = [], code = [];
    // `code` spans are shown verbatim (spreadsheet formulas etc.), so pull them out first.
    let s = src.replace(/`([^`\n]+)`/g, (_, c) => (code.push(c), "" + (code.length - 1) + ""));
    s = extractMath(normalise(s), math);
    s = s.replace(/\\(.)/g, (m, c) => (ESC_CHARS.includes(c) ? (escs.push(c), "\uE001" + (escs.length - 1) + "\uE001") : m));
    s = htmlEsc(s);
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1<em>$2</em>");
    s = s.replace(/\uE001(\d+)\uE001/g, (_, i) => htmlEsc(escs[+i]));
    s = s.replace(/\uE000(\d+)\uE000/g, (_, i) => renderTex(math[+i]));
    return s.replace(/\uE002(\d+)\uE002/g, (_, i) => "<code>" + htmlEsc(code[+i]) + "</code>");
  }

  function plain(src) {
    const math = [], code = [];
    let s = src.replace(/`([^`\n]+)`/g, (_, c) => (code.push(c), "\uE002" + (code.length - 1) + "\uE002"));
    s = extractMath(normalise(s), math);
    s = s.replace(/\*\*(.+?)\*\*/g, "$1").replace(/(^|[^*\\])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1$2");
    s = s.replace(/\\(.)/g, (m, c) => (ESC_CHARS.includes(c) ? c : m));
    s = s.replace(/\uE000(\d+)\uE000/g, (_, i) => texToPlain(math[+i]));
    return s.replace(/\uE002(\d+)\uE002/g, (_, i) => code[+i]);
  }

  const RE_BULLET = /^\s*[*-]\s+/, RE_NUM = /^\s*\d+\.\s+/, RE_TABLE = /^\s*\|/;
  function block(src) {
    const lines = src.split("\n"), out = [];
    let i = 0;
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) { i++; continue; }
      if (RE_TABLE.test(l)) {
        const rows = [];
        while (i < lines.length && RE_TABLE.test(lines[i])) rows.push(lines[i++]);
        out.push(table(rows));
      } else if (RE_BULLET.test(l) || RE_NUM.test(l)) {
        const ordered = RE_NUM.test(l), re = ordered ? RE_NUM : RE_BULLET, items = [];
        while (i < lines.length && re.test(lines[i])) items.push(lines[i++].replace(re, ""));
        const tag = ordered ? "ol" : "ul";
        out.push("<" + tag + ">" + items.map((t) => "<li>" + inline(t) + "</li>").join("") + "</" + tag + ">");
      } else {
        const para = [];
        while (i < lines.length && lines[i].trim() && !RE_TABLE.test(lines[i]) && !RE_BULLET.test(lines[i]) && !RE_NUM.test(lines[i])) para.push(lines[i++]);
        out.push("<p>" + para.map((t) => inline(t.trim())).join("<br>") + "</p>");
      }
    }
    return out.join("");
  }

  function table(rows) {
    const cells = (r) => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
    const body = rows.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r)).map(cells);
    if (!body.length) return "";
    const [head, ...rest] = body;
    return "<table><thead><tr>" + head.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
      rest.map((r) => "<tr>" + r.map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
  }

  const cache = new Map();
  function rendered(q) {
    let r = cache.get(q.id);
    if (!r) {
      r = {
        prompt: block(q.prompt),
        options: q.options.map((o) => inline(o.text)),
        explanation: inline(q.explanation || ""),
        search: ("#" + q.questionNumber + " " + q.id + " " + plain(q.prompt) + " " + q.options.map((o) => plain(o.text)).join(" ")).toLowerCase(),
      };
      cache.set(q.id, r);
    }
    return r;
  }

  // ---------- filtering ----------
  function ordered() {
    if (!state.order) return QS;
    const list = state.order.map((id) => BY_ID.get(id)).filter(Boolean);
    return list.length === QS.length ? list : QS;
  }

  function visible() {
    const f = state.filters, term = f.q.trim().toLowerCase();
    const num = /^#?(\d+)$/.exec(term);
    return ordered().filter((q) => {
      if (f.session && q.session !== f.session) return false;
      const a = state.answers[q.id];
      if (f.status === "unanswered" && a) return false;
      if (f.status === "incorrect" && (!a || a === q.correctAnswer)) return false;
      if (f.status === "bookmarked" && !state.bookmarks[q.id]) return false;
      if (!term) return true;
      if (num) return q.questionNumber === +num[1];
      return rendered(q).search.includes(term);
    });
  }

  // ---------- views ----------
  function quizCard(q) {
    const r = rendered(q), a = state.answers[q.id], revealed = !a && state.revealed[q.id];
    const done = !!a || revealed;
    const status = a ? (a === q.correctAnswer ? '<span class="tag ok">Correct</span>' : '<span class="tag bad">Incorrect</span>') : "";
    const opts = q.options.map((o, i) => {
      let cls = "", mark = "";
      if (done && o.key === q.correctAnswer) { cls = "correct"; mark = "✅"; }
      else if (a && o.key === a) { cls = "wrong"; mark = "❌"; }
      else if (done) cls = "dim";
      return '<button type="button" class="opt ' + cls + '" data-act="pick" data-key="' + o.key + '"' + (done ? " disabled" : "") + ">" +
        '<span class="k">' + o.key + '</span><span class="t">' + r.options[i] + '</span><span class="m">' + mark + "</span></button>";
    }).join("");
    const foot = done
      ? '<button type="button" class="linkbtn" data-act="clear">' + (a ? "Try again" : "Hide answer") + "</button>"
      : '<button type="button" class="linkbtn" data-act="reveal">Reveal answer</button>';
    return '<article class="q" data-id="' + q.id + '">' + head(q, status) +
      '<div class="prompt">' + r.prompt + "</div>" + figNote(q) +
      '<div class="opts">' + opts + "</div>" +
      '<div class="q-foot">' + foot + "</div>" +
      (done && r.explanation ? '<div class="explain"><strong>Answer:</strong> ' + r.explanation + "</div>" : "") +
      "</article>";
  }

  function docCard(q) {
    const r = rendered(q);
    const opts = q.options.map((o, i) => {
      const ok = o.key === q.correctAnswer;
      return '<li class="' + (ok ? "correct" : "") + '">[' + (ok ? "x" : "&nbsp;") + "] " + o.key + ") " + r.options[i] + (ok ? " ✅" : "") + "</li>";
    }).join("");
    return '<article class="q" data-id="' + q.id + '">' + head(q, "") +
      '<div class="prompt">' + r.prompt + "</div>" + figNote(q) +
      '<ul class="doc-opts">' + opts + "</ul>" +
      '<div class="doc-ans"><strong>Answer:</strong> ' + r.explanation + "</div></article>";
  }

  function head(q, status) {
    const bm = !!state.bookmarks[q.id];
    return '<div class="q-head"><span class="q-num">Question ' + q.questionNumber + '</span><span class="tag">' + htmlEsc(q.session || "") + "</span>" + status +
      '<button type="button" class="bm" data-act="bookmark" aria-pressed="' + bm + '" aria-label="Bookmark question ' + q.questionNumber + '" title="Bookmark">' + (bm ? "★" : "☆") + "</button></div>";
  }

  const figNote = (q) => (q.hasDiagram ? '<div class="note-fig">This question refers to a figure, graph or table that is not included in the source.</div>' : "");

  function render() {
    const list = visible(), box = $("#list"), doc = state.view === "doc";
    box.className = doc ? "doc" : "quiz";
    box.innerHTML = list.length ? list.map(doc ? docCard : quizCard).join("") : '<p class="empty">No questions match these filters.</p>';
    $("#count-line").textContent = "Showing " + list.length + " of " + QS.length + " questions" + (state.order ? " · shuffled" : "");
    $("#btn-copy").hidden = !doc || !list.length;
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
    $("#btn-shuffle").setAttribute("aria-pressed", String(!!state.order));
    stats();
  }

  function rerenderCard(id) {
    const el = document.querySelector('.q[data-id="' + id + '"]');
    if (!el) return;
    const q = BY_ID.get(id);
    el.outerHTML = state.view === "doc" ? docCard(q) : quizCard(q);
  }

  function stats() {
    let answered = 0, correct = 0;
    for (const q of QS) {
      const a = state.answers[q.id];
      if (a) { answered++; if (a === q.correctAnswer) correct++; }
    }
    $("#st-answered").textContent = answered + "/" + QS.length;
    $("#st-score").textContent = answered ? Math.round((correct / answered) * 100) + "%" : "–";
    $("#st-remaining").textContent = QS.length - answered;
    $("#progress-bar").style.width = (answered / QS.length) * 100 + "%";
    // Summary for the home page's year cards.
    try { localStorage.setItem("philnits:" + EXAM.year + ":summary", JSON.stringify({ answered, correct, total: QS.length })); } catch (e) {}
  }

  // ---------- copy (document view) ----------
  function copyText(list) {
    return list.map((q) => {
      const opts = q.options.map((o) => (o.key === q.correctAnswer ? "[x] " : "[ ] ") + o.key + ") " + plain(o.text) + (o.key === q.correctAnswer ? " ✅" : "")).join("\n");
      return "Question " + q.questionNumber + " (" + q.session + ")\n" + plain(q.prompt) + "\n\n" + opts + "\n\nAnswer: " + plain(q.explanation || "");
    }).join("\n\n");
  }

  async function copyVisible() {
    const text = copyText(visible());
    try {
      await navigator.clipboard.writeText(text);
      toast("Copied " + visible().length + " questions");
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Copied"); } catch (e2) { toast("Copy failed"); }
      ta.remove();
    }
  }

  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  // ---------- theme ----------
  function currentTheme() {
    return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function themeLabel() { $("#btn-theme").textContent = currentTheme() === "dark" ? "☀ Light" : "☾ Dark"; }

  // ---------- events ----------
  $("#list").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const id = btn.closest(".q").dataset.id;
    const act = btn.dataset.act;
    if (act === "pick") { state.answers[id] = btn.dataset.key; delete state.revealed[id]; }
    else if (act === "reveal") state.revealed[id] = true;
    else if (act === "clear") { delete state.answers[id]; delete state.revealed[id]; }
    else if (act === "bookmark") { if (state.bookmarks[id]) delete state.bookmarks[id]; else state.bookmarks[id] = true; }
    save(); rerenderCard(id); stats();
  });

  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => {
    state.view = b.dataset.view; save(); render();
  }));

  let searchTimer;
  $("#f-search").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.filters.q = e.target.value; save(); render(); }, 120);
  });
  $("#f-session").addEventListener("change", (e) => { state.filters.session = e.target.value; save(); render(); });
  $("#f-status").addEventListener("change", (e) => { state.filters.status = e.target.value; save(); render(); });

  $("#btn-shuffle").addEventListener("click", () => {
    if (state.order) state.order = null;
    else {
      const ids = QS.map((q) => q.id);
      for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
      state.order = ids;
    }
    save(); render(); window.scrollTo({ top: 0 });
  });

  $("#btn-reset").addEventListener("click", () => {
    if (!confirm("Clear all your answers and revealed answers for this exam? Bookmarks are kept.")) return;
    state.answers = {}; state.revealed = {}; state.order = null;
    save(); render(); toast("Progress cleared");
  });

  $("#btn-theme").addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("philnits:theme", next); } catch (e) {}
    themeLabel();
  });

  $("#btn-copy").addEventListener("click", copyVisible);

  // ---------- init ----------
  function init() {
    const sessions = [...new Set(QS.map((q) => q.session).filter(Boolean))];
    $("#f-session").insertAdjacentHTML("beforeend", sessions.map((s) => '<option value="' + htmlEsc(s) + '">' + htmlEsc(s) + "</option>").join(""));
    if (!sessions.includes(state.filters.session)) state.filters.session = "";
    $("#f-search").value = state.filters.q;
    $("#f-session").value = state.filters.session;
    $("#f-status").value = state.filters.status;
    $("#foot").textContent = QS.length + " questions · source: examQA-md · built " + EXAM.generatedAt.slice(0, 10);
    themeLabel();
    render();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
