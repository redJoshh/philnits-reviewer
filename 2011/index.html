<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --border: #dde1e7;
  --text: #1b1f24;
  --muted: #5d6673;
  --accent: #2f5bd3;
  --accent-soft: #e7edfc;
  --ok: #1f7a3d;
  --ok-bg: #e5f5ea;
  --ok-border: #86c99c;
  --bad: #b42323;
  --bad-bg: #fbe9e9;
  --bad-border: #e7a1a1;
  --warn: #8a5a00;
  --warn-bg: #fff4dc;
  --star: #d99a00;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .04);
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #171b21; --surface-2: #1f242c; --border: #2c333d;
    --text: #e6e9ee; --muted: #9aa4b2; --accent: #7b9cff; --accent-soft: #1e2a4a;
    --ok: #6fd18f; --ok-bg: #13301e; --ok-border: #2f7046;
    --bad: #ff8b8b; --bad-bg: #3a1717; --bad-border: #8a3434;
    --warn: #f0c060; --warn-bg: #33280f; --star: #f2c14e;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --surface-2: #1f242c; --border: #2c333d;
  --text: #e6e9ee; --muted: #9aa4b2; --accent: #7b9cff; --accent-soft: #1e2a4a;
  --ok: #6fd18f; --ok-bg: #13301e; --ok-border: #2f7046;
  --bad: #ff8b8b; --bad-bg: #3a1717; --bad-border: #8a3434;
  --warn: #f0c060; --warn-bg: #33280f; --star: #f2c14e;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.55 var(--font);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
.topbar .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 0; }
.brand { font-weight: 650; font-size: 1.02rem; margin-right: auto; }
.brand small { display: block; font-weight: 450; color: var(--muted); font-size: .78rem; }
.brand .home { display: block; font-weight: 500; font-size: .78rem; color: var(--accent); text-decoration: none; margin-bottom: 2px; }
.brand .home:hover { text-decoration: underline; }
.stats { display: flex; gap: 16px; font-size: .85rem; color: var(--muted); }
.stats b { color: var(--text); font-variant-numeric: tabular-nums; font-size: .98rem; }
.progress { height: 3px; background: var(--surface-2); }
.progress > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
  padding: 6px 12px; font-size: .88rem; line-height: 1.3; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.danger:hover { color: var(--bad); border-color: var(--bad-border); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: .88rem; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Filters */
.filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 0 6px; }
.filters input[type="search"] { flex: 1 1 240px; min-width: 0; }
.filters input, .filters select {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 10px; font-size: .92rem;
}
.meta-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; padding: 4px 0 12px; flex-wrap: wrap; }

/* Question cards */
main { padding-bottom: 64px; }
.q {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 14px;
}
.q-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.q-num { font-weight: 650; }
.tag { font-size: .74rem; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.bm { margin-left: auto; border: 0; background: none; font-size: 1.25rem; line-height: 1; color: var(--muted); padding: 2px 4px; }
.bm[aria-pressed="true"] { color: var(--star); }
.prompt p { margin: 0 0 .6em; }
.prompt ul, .prompt ol { margin: .2em 0 .7em; padding-left: 1.4em; }
.prompt table { border-collapse: collapse; margin: .4em 0 .8em; font-size: .9rem; display: block; overflow-x: auto; max-width: 100%; }
.prompt th, .prompt td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
.prompt th { background: var(--surface-2); }
.note-fig { font-size: .82rem; color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 6px 10px; margin: 4px 0 10px; }

.opts { display: grid; gap: 8px; margin-top: 8px; }
.opt {
  display: flex; align-items: flex-start; gap: 10px; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
}
.opt:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt .k {
  flex: none; width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); font-size: .82rem; font-weight: 600;
}
.opt .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .m { flex: none; }
.opt.correct { background: var(--ok-bg); border-color: var(--ok-border); }
.opt.correct .k { background: var(--ok); color: var(--surface); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad-border); }
.opt.wrong .k { background: var(--bad); color: var(--surface); }
.opt.dim { opacity: .62; }

.q-foot { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 2px 0; font-size: .88rem; }
.linkbtn + .linkbtn { margin-left: 12px; }
.explain {
  margin-top: 12px; padding: 10px 12px; border-left: 3px solid var(--ok-border);
  background: var(--surface-2); border-radius: 0 8px 8px 0; font-size: .94rem;
}

/* Document view */
.doc .q { box-shadow: none; padding: 16px 20px; }
.doc .doc-opts { list-style: none; padding: 0; margin: 6px 0 8px; }
.doc .doc-opts li { padding: 2px 0; }
.doc .doc-opts li.correct { font-weight: 600; color: var(--ok); }
.doc .doc-ans { font-size: .94rem; }

.empty { text-align: center; color: var(--muted); padding: 48px 0; }
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: .88rem;
  transition: .2s; pointer-events: none; z-index: 20;
}
.toast.show { opacity: 1; transform: translateX(-50%); }
footer { color: var(--muted); font-size: .8rem; text-align: center; padding: 8px 0 32px; }
.katex { font-size: 1.05em; }
code { font: .92em ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; background: var(--surface-2); border-radius: 4px; padding: 1px 5px; }

@media (max-width: 640px) {
  .stats { gap: 12px; width: 100%; order: 3; }
  .q { padding: 14px 14px; }
  .brand { flex-basis: 100%; }
}
</style>

[{"key":"a","text":"Each element in an array can be read in any order by using an index."},{"key":"b","text":"Arrays can be used to make the data structure independent from the algorithm."},{"key":"c","text":"Each element in a list can be searched for and updated using an index in lieu of a pointer."},{"key":"d","text":"When an element is inserted in a list or deleted from a list, existing elements must be moved."}],"correctAnswer":"a","explanation":"a) Each element in an array can be read in any order by using an index."},{"id":"2011S-Q06","session":"Spring 2011","category":null,"questionNumber":6,"prompt":"There is a program that displays text in accordance with the specifications below. When the original text described below is displayed, in what point size does the program display the underlined character string? Here, the first character of the original text is displayed in 10 points.\n**\\[Specifications\\]**\n\n* The characters between \\\u003cB\\> and \\\u003c/B\\> are displayed one point larger than the preceding character.\n* The characters between \\\u003cS\\> and \\\u003c/S\\> are displayed one point smaller than the preceding character.\n* Each of \\\u003cB\\> \\\u003c/B\\> and \\\u003cS\\> \\\u003c/S\\> must be used as a pair, and both of them can be nested with each other.\n\n**\\[Original text\\]**\nThe system administrator promotes and implements \\\u003cB\\>department-level\\\u003cB\\> or \\\u003cS\\>group-level\\\u003c/S\\> computerization\\\u003c/B\\> from a user \\\u003cS\\>standpoint\\\u003c/S\\>.\\\u003c/B\\>","hasDiagram":false,"options":[{"key":"a","text":"10"},{"key":"b","text":"11"},{"key":"c","text":"12"},{"key":"d","text":"13"}],"correctAnswer":"b","explanation":"b) 11"},{"id":"2011S-Q07","session":"Spring 2011","category":null,"questionNumber":7,"prompt":"Which of the following is an appropriate explanation of SGML?","hasDiagram":false,"options":[{"key":"a","text":"It is a language from which HTML and XML are derived and is used to describe the logical structure of a document."},{"key":"b","text":"It is an extended HTML-based language and is used for displaying images and documents on Web browsers."},{"key":"c","text":"It is a standard for communication between electronic musical instruments and is used for processing music data."},{"key":"d","text":"It is a standard page description language and is used for well-formed documents."}],"correctAnswer":"a","explanation":"a) It is a language from which HTML and XML are derived and is used to describe the logical structure of a document."},{"id":"2011S-Q08","session":"Spring 2011","category":null,"questionNumber":8,"prompt":"Which of the following is the method for describing the logical structure of a sentence in XML?","hasDiagram":false,"options":[{"key":"a","text":"Enclosing the sentence, clauses, and other elements with double quotes"},{"key":"b","text":"Separating the sentence, clauses, and other elements with commas"},{"key":"c","text":"Enclosing the sentence, clauses, and other elements with tags"},{"key":"d","text":"Separating the sentence, clauses, and other elements with tabs"}],"correctAnswer":"c","explanation":"c) Enclosing the sentence, clauses, and other elements with tags"},{"id":"2011S-Q09","session":"Spring 2011","category":null,"questionNumber":9,"prompt":"Which of the following is an appropriate explanation of some functional units implemented in a computer?","hasDiagram":false,"options":[{"key":"a","text":"The operation unit performs arithmetic processing at the direction of the control unit."},{"key":"b","text":"The operation unit exchanges data with the control unit, the input unit, and the output unit."},{"key":"c","text":"The memory unit requests the operation unit to perform arithmetic processing and stores the results."},{"key":"d","text":"The memory unit requests the output unit to read out data from the memory unit."}],"correctAnswer":"a","explanation":"a) The operation unit performs arithmetic processing at the direction of the control unit."},{"id":"2011S-Q10","session":"Spring 2011","category":null,"questionNumber":10,"prompt":"Which of the following is the latest interface that is widely used to transfer a large amount of data, such as 3D images or moving images, to graphics cards at higher speed?","hasDiagram":false,"options":[{"key":"a","text":"AGP"},{"key":"b","text":"ATA"},{"key":"c","text":"ISA"},{"key":"d","text":"PCI Express"}],"correctAnswer":"d","explanation":"d) PCI Express"},{"id":"2011S-Q11","session":"Spring 2011","category":null,"questionNumber":11,"prompt":"Which of the following is the standard that is used to exchange data, such as address book data, between cell phones by using infrared rays?","hasDiagram":false,"options":[{"key":"a","text":"IEEE 1394"},{"key":"b","text":"IrDA"},{"key":"c","text":"RFID"},{"key":"d","text":"RS-232C"}],"correctAnswer":"b","explanation":"b) IrDA"},{"id":"2011S-Q12","session":"Spring 2011","category":null,"questionNumber":12,"prompt":"Which of the following is an appropriate description of plug-and-play used on a PC?","hasDiagram":false,"options":[{"key":"a","text":"A mechanism to start applications"},{"key":"b","text":"A mechanism which performs required settings automatically when peripheral devices are connected"},{"key":"c","text":"A mechanism which starts up an OS automatically when the power is turned on"},{"key":"d","text":"A mechanism to run software developed for another OS"}],"correctAnswer":"b","explanation":"b) A mechanism which performs required settings automatically when peripheral devices are connected"},{"id":"2011S-Q13","session":"Spring 2011","category":null,"questionNumber":13,"prompt":"Which of the following is an appropriate description concerning a characteristic of RAID?","hasDiagram":false,"options":[{"key":"a","text":"It increases the data transfer rate of each hard disk drive."},{"key":"b","text":"It provides a larger capacity than the total capacity of individual hard disk drives."},{"key":"c","text":"It enhances the performance and reliability of the entire system by using multiple hard disk drives all together."},{"key":"d","text":"It increases data access time because it needs to access multiple hard disk drives."}],"correctAnswer":"c","explanation":"c) It enhances the performance and reliability of the entire system by using multiple hard disk drives all together."},{"id":"2011S-Q14","session":"Spring 2011","category":null,"questionNumber":14,"prompt":"Which of the following is an appropriate description of fail-safe?","hasDiagram":false,"options":[{"key":"a","text":"Keeping the system harmless, even in the event of a failure or an operation error"},{"key":"b","text":"Operating only the normal parts of the system, even in the event of a failure, so as not to make an impact on the entire system"},{"key":"c","text":"Preventing intrusion into the computer network of an organization from outside"},{"key":"d","text":"Accepting only the data that meets specific conditions"}],"correctAnswer":"a","explanation":"a) Keeping the system harmless, even in the event of a failure or an operation error"},{"id":"2011S-Q15","session":"Spring 2011","category":null,"questionNumber":15,"prompt":"There is a system consisting of two PCs, one file server, and one printer that are all connected to a LAN. The availability of the printer and file server are both 0.9, while the availability of each PC is 0.8. Which of the following is the appropriate expression to calculate the availability of the entire system? Here, the system is considered to be operating when at least one PC is running.","hasDiagram":false,"options":[{"key":"a","text":"$0.{9}^{2}\\times 0.{8}^{2}$"},{"key":"b","text":"$0.{9}^{2}\\times (1-(1-0.8{)}^{2})$"},{"key":"c","text":"$(1-0.9{)}^{2}\\times 0.{8}^{2}$"},{"key":"d","text":"$(1-0.{9}^{2})\\times (1-0.8{)}^{2}$"}],"correctAnswer":"b","explanation":"b) $0.{9}^{2}\\times (1-(1-0.8{)}^{2})$"},{"id":"2011S-Q16","session":"Spring 2011","category":null,"questionNumber":16,"prompt":"Which of the following is pertinent to the process of grouping multiple files into one, for the purpose of making effective use of storage media or promoting the efficiency of backup or distribution?","hasDiagram":false,"options":[{"key":"a","text":"Archive"},{"key":"b","text":"Allocate"},{"key":"c","text":"Patch"},{"key":"d","text":"Protect"}],"correctAnswer":"a","explanation":"a) Archive"},{"id":"2011S-Q17","session":"Spring 2011","category":null,"questionNumber":17,"prompt":"Which of the following is the purpose of the virtual memory system that is one of the functions provided by an OS?","hasDiagram":false,"options":[{"key":"a","text":"To prevent an application program from accessing the area on the main memory used by the OS"},{"key":"b","text":"To reduce electricity consumption while work is suspended, by turning off the power supply after data is written from the main memory to the hard disk"},{"key":"c","text":"To make it possible to execute a program even if the program requires more storage capacity than is available in the main memory"},{"key":"d","text":"To accelerate CPU processing through the intervention of a higher speed memory device than the main memory"}],"correctAnswer":"c","explanation":"c) To make it possible to execute a program even if the program requires more storage capacity than is available in the main memory"},{"id":"2011S-Q18","session":"Spring 2011","category":null,"questionNumber":18,"prompt":"Which of the following is an appropriate explanation of plug-in software?","hasDiagram":false,"options":[{"key":"a","text":"Plug-in software bridges differences between OSs, and provides more advanced and specific functions than the OSs."},{"key":"b","text":"Plug-in software is provided to replace parts of a program for the purpose of modifying functions or fixing bugs."},{"key":"c","text":"Plug-in software does not work as a standalone program, but can be integrated into applications, such as a Web browser, to enhance their functions."},{"key":"d","text":"Plug-in software is often included in applications such as spreadsheets, and allows the users to record and replay the series of operations performed."}],"correctAnswer":"c","explanation":"c) Plug-in software does not work as a standalone program, but can be integrated into applications, such as a Web browser, to enhance their functions."},{"id":"2011S-Q19","session":"Spring 2011","category":null,"questionNumber":19,"prompt":"An examination is conducted, and the results of the examination are grouped into four performance classes \"Excellent,\" \"Good,\" \"Passed,\" and \"Not passed,\" based on the scores by using spreadsheet software. To show the results of grouping in column C, an expression is entered in cell C1 and then copied to cells C2 through C35. Which of the following is the appropriate expression to be entered into cell C1? Here, the procedure for grouping is as shown below.\n**\\[Spreadsheet creation procedure\\]**\n\n1. Cells A1 through A35 contain scores.\n2. Cell A36 contains a function to calculate the average score.\n3. Cell B1 contains the expression below, and this expression is copied to cells B2 through B35: A1\\-$A$36\n4. Performance classes are defined as follows: if the score is above the average by 10 points or more, it is marked as \"Excellent\"; if it is above the average by less than 10 points, it is marked as \"Good\"; if it is below the average by 10 points or less, it is marked as \"Passed\"; all other scores are marked as \"Not passed.\"","hasDiagram":false,"options":[{"key":"a","text":"IF(B1\\>10, 'Passed', IF(B1\\>0, 'Not passed', IF(B1\\\u003c-10, 'Excellent', 'Good')))"},{"key":"b","text":"IF(B1\\>10, 'Excellent', IF(B1\\>0, 'Good', IF(B1\\\u003c-10, 'Passed', 'Not passed')))"},{"key":"c","text":"IF(B1\\>=10, 'Excellent', IF(B1\\>0, 'Good', IF(B1\\\u003c-10, 'Not passed', 'Passed')))"},{"key":"d","text":"IF(B1\\>=10, 'Excellent', IF(B1\\>=0, 'Good', IF(B1\\\u003c-10, 'Not passed', 'Passed')))"}],"correctAnswer":"d","explanation":"d) IF(B1\\>=10, 'Excellent', IF(B1\\>=0, 'Good', IF(B1\\\u003c-10, 'Not passed', 'Passed')))"},{"id":"2011S-Q20","session":"Spring 2011","category":null,"questionNumber":20,"prompt":"When a spreadsheet application is used to create a line graph based on actual sales in the table below, the scale range of the vertical axis is automatically set between 0 and 1,500,000 dollars. However, as the graph does not show clearly how sales have changed over time, the fluctuation of sales needs to be more clearly emphasized without changing the frame size of the graph. When the graph-editing features are used for this purpose, which of the following is the most appropriate operation to be done?\n*(Actual sales range between 1,063,000 and 1,220,000 dollars across all 12 months)*","hasDiagram":true,"options":[{"key":"a","text":"Changing the unit of the vertical axis to 1,000 dollars, which will make the range from 0 to 1,500 (Unit: thousands of dollars)"},{"key":"b","text":"Changing the display range of the vertical axis to 1,000,000 through 1,300,000 dollars"},{"key":"c","text":"Converting the line graph to a bar graph"},{"key":"d","text":"Inserting an auxiliary line parallel to the horizontal axis for the purpose of indicating average sales"}],"correctAnswer":"b","explanation":"b) Changing the display range of the vertical axis to 1,000,000 through 1,300,000 dollars"},{"id":"2011S-Q21","session":"Spring 2011","category":null,"questionNumber":21,"prompt":"As shown in the spreadsheet below, three types of examinations were conducted. Each type of examination has a different perfect score. Each resulting score is converted to a value assuming 100 points as the perfect score, and displayed in cells F3 through H10. Which of the following is the expression to be entered in cell F3? Here, the expression in cell F3 is copied to cells F3 through H10.\n*(Row 2 holds perfect scores for B, C, D; student scores begin on row 3\\)*","hasDiagram":false,"options":[{"key":"a","text":"100 \\* B3 / \\$B2"},{"key":"b","text":"100 \\* B3 / B\\$2"},{"key":"c","text":"100 \\* \\$B3 / \\$B2"},{"key":"d","text":"100 \\* B$3/B$2"}],"correctAnswer":"b","explanation":"b) 100 \\* B3 / B\\$2"},{"id":"2011S-Q22","session":"Spring 2011","category":null,"questionNumber":22,"prompt":"On a standalone PC, sequential access to a database is taking longer to process than before. When the number of records remains almost unchanged, which of the following can be considered to be the cause?","hasDiagram":false,"options":[{"key":"a","text":"Unnecessary records, such as already deleted data, are read."},{"key":"b","text":"Data has been added and deleted many times, so the record area in the database file is fragmented."},{"key":"c","text":"Access takes longer as free space in the database has increased."},{"key":"d","text":"Because of hardware deterioration, data transmission between the hard disk and the processor has become slower."}],"correctAnswer":"b","explanation":"b) Data has been added and deleted many times, so the record area in the database file is fragmented."},{"id":"2011S-Q23","session":"Spring 2011","category":null,"questionNumber":23,"prompt":"Which of the following is an appropriate policy for designing data entry screens?","hasDiagram":false,"options":[{"key":"a","text":"Related input items should be placed close to each other, in order to improve ease of operation on the screen."},{"key":"b","text":"A method of entering commands should be provided, in order to ensure ease of operation even for entry-level users."},{"key":"c","text":"A common message \"Input Error\" to all data entry errors should be displayed on the screen."},{"key":"d","text":"Detailed directions for use should be displayed on the screen, in order to ensure ease of operation for users."}],"correctAnswer":"a","explanation":"a) Related input items should be placed close to each other, in order to improve ease of operation on the screen."},{"id":"2011S-Q24","session":"Spring 2011","category":null,"questionNumber":24,"prompt":"Which of the following can provide accessible linkage between information items represented in text, still images, video, sound, music, and other forms so that associated information can be reached by visiting one link after another?","hasDiagram":false,"options":[{"key":"a","text":"Graphical user interface"},{"key":"b","text":"Groupware"},{"key":"c","text":"Cyberspace"},{"key":"d","text":"Hypermedia"}],"correctAnswer":"d","explanation":"d) Hypermedia"},{"id":"2011S-Q25","session":"Spring 2011","category":null,"questionNumber":25,"prompt":"When relational databases are used, which of the following is an appropriate purpose of normalizing data?","hasDiagram":false,"options":[{"key":"a","text":"To guarantee data compatibility between heterogeneous computers"},{"key":"b","text":"To prevent data duplication as well as occurrence of inconsistency at the time of updating data"},{"key":"c","text":"To eliminate characters that cannot be transmitted when a database is used over a network"},{"key":"d","text":"To handle data storage areas distributed over multiple media as a contiguous storage area"}],"correctAnswer":"b","explanation":"b) To prevent data duplication as well as occurrence of inconsistency at the time of updating data"},{"id":"2011S-Q26","session":"Spring 2011","category":null,"questionNumber":26,"prompt":"Under an environment where several users have access to a database simultaneously, a user tries to view the data while another user is updating it. In order to assure data integrity, which of the following is an appropriate control method in the database management system?","hasDiagram":false,"options":[{"key":"a","text":"Interrupting update processing and permitting the user to view the data"},{"key":"b","text":"Permitting the user to view the latest data while updating"},{"key":"c","text":"Permitting the user to view the data after completion of the update"},{"key":"d","text":"Discarding the updated data and permitting the user to view the data before the update"}],"correctAnswer":"c","explanation":"c) Permitting the user to view the data after completion of the update"},{"id":"2011S-Q27","session":"Spring 2011","category":null,"questionNumber":27,"prompt":"Which of the following is the network area that is provided by installing a firewall and is accessible from both the Internet and the intranet but not accessible to the intranet?","hasDiagram":false,"options":[{"key":"a","text":"DHCP"},{"key":"b","text":"DMZ"},{"key":"c","text":"DNS"},{"key":"d","text":"DoS"}],"correctAnswer":"b","explanation":"b) DMZ"},{"id":"2011S-Q28","session":"Spring 2011","category":null,"questionNumber":28,"prompt":"A Web server in Company A provides SSL communication using a digital certificate for the Web server generated by a certification authority. Which of the following is a procedure in which a PC accesses the Web server of Company A and after obtaining a digital certificate, uses the public key of the certification authority?","hasDiagram":false,"options":[{"key":"a","text":"Generating a common key used for encrypted communication and encrypting it by using the public key of the certification authority"},{"key":"b","text":"Using the public key of the certification authority to decrypt the common key used for encrypted communication"},{"key":"c","text":"Using the public key of the certification authority to verify the validity of the digital certificate"},{"key":"d","text":"Encrypting confidential data by using the public key of the certification authority"}],"correctAnswer":"c","explanation":"c) Using the public key of the certification authority to verify the validity of the digital certificate"},{"id":"2011S-Q29","session":"Spring 2011","category":null,"questionNumber":29,"prompt":"Which of the following is an appropriate combination of the protocols that are used for transmitting and receiving e-mail as shown in the diagram below?\n\n* (1) Send e-mail (Mail client $\\rightarrow$ Mail server)\n* (2) Receive e-mail (Mail server $\\rightarrow$ Mail client)\n* (3) Transfer e-mail (Mail server $\\rightarrow$ Mail server)","hasDiagram":true,"options":[{"key":"a","text":"(1) POP3, (2) POP3, (3) SMTP"},{"key":"b","text":"(1) POP3, (2) SMTP, (3) POP3"},{"key":"c","text":"(1) SMTP, (2) POP3, (3) SMTP"},{"key":"d","text":"(1) SMTP, (2) SMTP, (3) SMTP"}],"correctAnswer":"c","explanation":"c) (1) SMTP, (2) POP3, (3) SMTP"},{"id":"2011S-Q30","session":"Spring 2011","category":null,"questionNumber":30,"prompt":"Which of the following is a mechanism that enables a Web server to store user information in a browser in order to identify which PC is accessing the Web server?","hasDiagram":false,"options":[{"key":"a","text":"CGI"},{"key":"b","text":"Cookie"},{"key":"c","text":"SSL"},{"key":"d","text":"URL"}],"correctAnswer":"b","explanation":"b) Cookie"},{"id":"2011S-Q31","session":"Spring 2011","category":null,"questionNumber":31,"prompt":"When ten e-mail messages are sent successively from Company A to Company B, they may arrive at Company B in a different order from the order they are sent. Which of the following is an appropriate opinion on this matter?","hasDiagram":false,"options":[{"key":"a","text":"There is a problem with the setup of Company A's mail server."},{"key":"b","text":"There is a problem with the setup of Company B's firewall for e-mail."},{"key":"c","text":"There is a high possibility that e-mail delivered late is falsified on the way."},{"key":"d","text":"The arrival sequence is subject to change because of different transfer routes."}],"correctAnswer":"d","explanation":"d) The arrival sequence is subject to change because of different transfer routes."},{"id":"2011S-Q32","session":"Spring 2011","category":null,"questionNumber":32,"prompt":"Which of the following is an appropriate description concerning cryptography?","hasDiagram":false,"options":[{"key":"a","text":"The process of turning the encrypted text back into its original plain text is called reset."},{"key":"b","text":"In common key cryptography, the encrypted text and common key are transmitted together."},{"key":"c","text":"In public key cryptography, the key used for encryption is different from that for recovering the plain text from the encrypted text."},{"key":"d","text":"Common key cryptography is used for digital signature."}],"correctAnswer":"c","explanation":"c) In public key cryptography, the key used for encryption is different from that for recovering the plain text from the encrypted text."},{"id":"2011S-Q33","session":"Spring 2011","category":null,"questionNumber":33,"prompt":"Which of the following can be made possible by using a digital signature in electronic commerce?","hasDiagram":false,"options":[{"key":"a","text":"Preventing an unintended third party from accessing any confidential file"},{"key":"b","text":"Checking that a file is not infected with a virus"},{"key":"c","text":"Preventing the contents of a transaction from being leaked through wiretapping"},{"key":"d","text":"Authenticating the trading partner and checking that the contents of a transaction are not falsified"}],"correctAnswer":"d","explanation":"d) Authenticating the trading partner and checking that the contents of a transaction are not falsified"},{"id":"2011S-Q34","session":"Spring 2011","category":null,"questionNumber":34,"prompt":"Which of the following is the purpose of a DoS attack against a server?","hasDiagram":false,"options":[{"key":"a","text":"Takeover of server administrator's privileges"},{"key":"b","text":"Blocking of services"},{"key":"c","text":"Falsification of data"},{"key":"d","text":"Stealing of data"}],"correctAnswer":"b","explanation":"b) Blocking of services"},{"id":"2011S-Q35","session":"Spring 2011","category":null,"questionNumber":35,"prompt":"Which of the following is the self-propagating program that can send its replication attached to an e-mail message via a network, such as the Internet, or copy itself onto other computers in the network?","hasDiagram":false,"options":[{"key":"a","text":"Cookie"},{"key":"b","text":"Spyware"},{"key":"c","text":"Trojan horse"},{"key":"d","text":"Worm"}],"correctAnswer":"d","explanation":"d) Worm"},{"id":"2011S-Q36","session":"Spring 2011","category":null,"questionNumber":36,"prompt":"Which of the following is an appropriate explanation of spam mail?","hasDiagram":false,"options":[{"key":"a","text":"E-mail that is indiscriminately sent to users without their consent"},{"key":"b","text":"E-mail that is distributed to all participants registered previously for a specific purpose"},{"key":"c","text":"E-mail that is sent or forwarded with the same content by a receiver to multiple destinations and causes the number of receivers to continue increasing"},{"key":"d","text":"A message exchange system that provides a message posting function using e-mail or Web page to enable information exchange with the general public"}],"correctAnswer":"a","explanation":"a) E-mail that is indiscriminately sent to users without their consent"},{"id":"2011S-Q37","session":"Spring 2011","category":null,"questionNumber":37,"prompt":"Which of the following is a security incident categorized as being caused by a physical threat?","hasDiagram":false,"options":[{"key":"a","text":"The server room is flooded because of heavy rain, which causes the equipment to stop."},{"key":"b","text":"A large amount of data is sent from the external network to the public server, which causes the server to stop."},{"key":"c","text":"An attacker intrudes into the corporate server over the network and destroys files."},{"key":"d","text":"An employee makes an operational error on the computer, and data is destroyed."}],"correctAnswer":"a","explanation":"a) The server room is flooded because of heavy rain, which causes the equipment to stop."},{"id":"2011S-Q38","session":"Spring 2011","category":null,"questionNumber":38,"prompt":"A client application for a mission-critical business system built by the information systems department displayed an error message on the screen and stopped. Which of the following is the most appropriate action to be taken by the user in this situation?","hasDiagram":false,"options":[{"key":"a","text":"Restarting the PC and notifying the information systems department that a failure occurred"},{"key":"b","text":"Trying to resolve the problem on one's own, based on the error message or other information"},{"key":"c","text":"Checking the error message with the user manual and determining if the failure can be resolved on one's own, or if the information systems department should be consulted"},{"key":"d","text":"Informing other PC-based clients on this system of the failure and asking them to stop operations in progress"}],"correctAnswer":"c","explanation":"c) Checking the error message with the user manual and determining if the failure can be resolved on one's own, or if the information systems department should be consulted"},{"id":"2011S-Q39","session":"Spring 2011","category":null,"questionNumber":39,"prompt":"Which of the following describes a \"limit check\" that is a method of checking input data?","hasDiagram":false,"options":[{"key":"a","text":"Checking the data for either the minimum or maximum value"},{"key":"b","text":"Checking whether the data is in a certain order"},{"key":"c","text":"Checking whether the data is logically correct"},{"key":"d","text":"Checking the data code with the code registered in a table"}],"correctAnswer":"a","explanation":"a) Checking the data for either the minimum or maximum value"},{"id":"2011S-Q40","session":"Spring 2011","category":null,"questionNumber":40,"prompt":"A system, consisting of four subsystems a through d, is being developed. The chart below shows the cumulative number of bugs found during the test phase for each subsystem. Which subsystem can be regarded as being at the highest quality level? Here, all detected bugs have already been removed, and the development scale, development period, and the number of staff are almost the same for all subsystems.","hasDiagram":true,"options":[{"key":"a","text":"a"},{"key":"b","text":"b"},{"key":"c","text":"c"},{"key":"d","text":"d"}],"correctAnswer":"a","explanation":"a) a"},{"id":"2011S-Q41","session":"Spring 2011","category":null,"questionNumber":41,"prompt":"Which of the following is an appropriate description of programming?","hasDiagram":false,"options":[{"key":"a","text":"Consolidating individual programs and verifying that the software works as specified"},{"key":"b","text":"Performing a functional decomposition of software, based on its hierarchical structure"},{"key":"c","text":"Describing procedures in accordance with the grammar of a programming language, and then verifying that there is no error in the procedures"},{"key":"d","text":"Representing the procedure of a program schematically or graphically"}],"correctAnswer":"c","explanation":"c) Describing procedures in accordance with the grammar of a programming language, and then verifying that there is no error in the procedures"},{"id":"2011S-Q42","session":"Spring 2011","category":null,"questionNumber":42,"prompt":"Which of the following is an appropriate explanation of a white box test?","hasDiagram":false,"options":[{"key":"a","text":"Test data is prepared based on external specifications."},{"key":"b","text":"Test data is prepared by applying the equivalence partitioning technique."},{"key":"c","text":"Test data is prepared based on internal structure."},{"key":"d","text":"Test data is prepared by using the relationship between input and output."}],"correctAnswer":"c","explanation":"c) Test data is prepared based on internal structure."},{"id":"2011S-Q43","session":"Spring 2011","category":null,"questionNumber":43,"prompt":"Which of the following is an advantage of dividing the software development process into four phases—requirements definition, system design, programming, and testing—and then executing them in this order?","hasDiagram":false,"options":[{"key":"a","text":"It provides flexibility to handle changes in software specifications at any point of the development phases."},{"key":"b","text":"It contributes to the ease of understanding the progress status of development."},{"key":"c","text":"It requires fewer person-hours spent for reviews in the upstream phases."},{"key":"d","text":"It allows users to try the software at an early stage of development."}],"correctAnswer":"b","explanation":"b) It contributes to the ease of understanding the progress status of development."},{"id":"2011S-Q44","session":"Spring 2011","category":null,"questionNumber":44,"prompt":"Which of the following is the development model where a trial model or a pilot unit is developed at an early stage of system development so that users can verify their requirements in a tangible manner?","hasDiagram":false,"options":[{"key":"a","text":"Waterfall model"},{"key":"b","text":"Extreme programming"},{"key":"c","text":"Spiral model"},{"key":"d","text":"Prototyping"}],"correctAnswer":"d","explanation":"d) Prototyping"},{"id":"2011S-Q45","session":"Spring 2011","category":null,"questionNumber":45,"prompt":"Which of the following is the chart or diagram that is illustrated in length proportional to the time period required for each task, with time on the horizontal axis and the tasks on the vertical axis?","hasDiagram":true,"options":[{"key":"a","text":"E-R diagram"},{"key":"b","text":"Arrow diagram"},{"key":"c","text":"Gantt chart"},{"key":"d","text":"State transition diagram"}],"correctAnswer":"c","explanation":"c) Gantt chart"},{"id":"2011S-Q46","session":"Spring 2011","category":null,"questionNumber":46,"prompt":"In the arrow diagram below, what is the maximum number of days that can be accepted as a delay of the activity $C\\rightarrow F$ on condition that the total number of days required for activities from A through G is not affected?","hasDiagram":true,"options":[{"key":"a","text":"1"},{"key":"b","text":"2"},{"key":"c","text":"3"},{"key":"d","text":"4"}],"correctAnswer":"d","explanation":"d) 4"},{"id":"2011S-Q47","session":"Spring 2011","category":null,"questionNumber":47,"prompt":"Which of the following is the most appropriate description concerning the communication that a project manager performs with the parties involved in the project?","hasDiagram":false,"options":[{"key":"a","text":"It is decided at the start of the project what kind of report is to be created, and when, how, and to whom the report is to be presented."},{"key":"b","text":"When the progress of the project is reported to the ordering party, the progress report created by the development staff member is used as is."},{"key":"c","text":"Communication with members of the project team is performed orally, with the emphasis on promptness of contact."},{"key":"d","text":"All the internal and external parties involved in the project are convened regularly to hold a meeting to check on the progress, regardless of the scale of the project."}],"correctAnswer":"a","explanation":"a) It is decided at the start of the project what kind of report is to be created, and when, how, and to whom the report is to be presented."},{"id":"2011S-Q48","session":"Spring 2011","category":null,"questionNumber":48,"prompt":"In system development, which of the following is the most appropriate graph that shows the relationship between the phase where a defect is detected and the cost to resolve it?","hasDiagram":true,"options":[{"key":"a","text":"Graph a (exponential increase over Design $\\rightarrow$ Development $\\rightarrow$ Test $\\rightarrow$ Operations)"},{"key":"b","text":"Graph b"},{"key":"c","text":"Graph c"},{"key":"d","text":"Graph d"}],"correctAnswer":"a","explanation":"a) Graph a"},{"id":"2011S-Q49","session":"Spring 2011","category":null,"questionNumber":49,"prompt":"In a development project, after a software integration test is completed, a system test is being conducted to check the functions of a system. According to the system test report, there are many defects in a certain program. Which of the following is the most appropriate action that the project manager should take first?","hasDiagram":false,"options":[{"key":"a","text":"Suspending the system test and starting all over again from the software integration test"},{"key":"b","text":"Increasing the staff members who test the defective program so as not to delay the progress of the test"},{"key":"c","text":"Re-evaluating the quality of the defective program to identify its impact on the system test"},{"key":"d","text":"Removing the defective program from the test target list and creating the program again"}],"correctAnswer":"c","explanation":"c) Re-evaluating the quality of the defective program to identify its impact on the system test"},{"id":"2011S-Q50","session":"Spring 2011","category":null,"questionNumber":50,"prompt":"Which of the following is an appropriate characteristic of the single-step (or big bang) migration method?","hasDiagram":false,"options":[{"key":"a","text":"It requires an application that provides a connection between the new and old systems."},{"key":"b","text":"The new and old systems are operated in parallel, and then migration to the new system is performed at a certain point in time."},{"key":"c","text":"Problems during migration to the new system have a serious impact."},{"key":"d","text":"Operational costs are incurred from parallel operations."}],"correctAnswer":"c","explanation":"c) Problems during migration to the new system have a serious impact."},{"id":"2011S-Q51","session":"Spring 2011","category":null,"questionNumber":51,"prompt":"In the PDCA cycle model of ISMS, which of the following is performed as part of the \"Do\" phase?","hasDiagram":false,"options":[{"key":"a","text":"Correction of major nonconformity"},{"key":"b","text":"Security education"},{"key":"c","text":"Establishment of security policy"},{"key":"d","text":"Internal audit"}],"correctAnswer":"b","explanation":"b) Security education"},{"id":"2011S-Q52","session":"Spring 2011","category":null,"questionNumber":52,"prompt":"When a service desk receives a call regarding a system failure from a user, which of the following is an appropriate response from the perspective of incident management?","hasDiagram":false,"options":[{"key":"a","text":"Giving priority to implementing a fundamental solution to the problem to prevent recurrence in preference to system recovery"},{"key":"b","text":"Giving priority to the continuity of the system user's business and informing the user of any known workarounds first"},{"key":"c","text":"Reporting the recovery progress only to the user who called the service desk"},{"key":"d","text":"Identifying the severity and details of the failure, and then advising the user about an appropriate contact point"}],"correctAnswer":"b","explanation":"b) Giving priority to the continuity of the system user's business and informing the user of any known workarounds first"},{"id":"2011S-Q53","session":"Spring 2011","category":null,"questionNumber":53,"prompt":"Which of the following is the management system which imposes the costs of system operations on user departments fairly?","hasDiagram":false,"options":[{"key":"a","text":"Consigned computing system"},{"key":"b","text":"Outsourcing system"},{"key":"c","text":"Billing system"},{"key":"d","text":"Standard cost system"}],"correctAnswer":"c","explanation":"c) Billing system"},{"id":"2011S-Q54","session":"Spring 2011","category":null,"questionNumber":54,"prompt":"In the PDCA cycle of service management, which of the following is performed in the \"Act\" phase?","hasDiagram":false,"options":[{"key":"a","text":"Identifying the scope and necessary resources of service management"},{"key":"b","text":"Measuring the usage of resources and monitoring the processes"},{"key":"c","text":"Setting improvement goals related to the usage of resources and improving the processes"},{"key":"d","text":"Managing the allocated resources as well as the team ":"d) Sales or gross profits of goods are sorted in descending order, and then, according to its cumulative percentage of the total, the goods are classified into three ranks to identify hot-selling goods."},{"id":"2011S-Q60","session":"Spring 2011","category":null,"questionNumber":60,"prompt":"Two control charts below show the quality characteristics of products manufactured by Lines A and B in the factory for each day of manufacture. Which of the following is an appropriate response or reaction to Line A or Line B or both?\n*(Line A: values fluctuate up and down around the center line, within the upper and lower control limits. Line B: values stay within the control limits but rise steadily above the center line day after day.)*","hasDiagram":true,"options":[{"key":"a","text":"Since the daily fluctuation of values in Line A is larger than in Line B, the cause should be investigated."},{"key":"b","text":"Since values for both Lines A and B fall within the control limit range, it should be desirable to wait and see."},{"key":"c","text":"Since values for both Lines A and B deviate from the center line, the cause should be investigated."},{"key":"d","text":"Since the value for Line B continues to increase, the cause should be investigated."}],"correctAnswer":"d","explanation":"d) Since the value for Line B continues to increase, the cause should be investigated."},{"id":"2011S-Q61","session":"Spring 2011","category":null,"questionNumber":61,"prompt":"Which of the following is an appropriate description concerning the usage of diagrams or charts?","hasDiagram":true,"options":[{"key":"a","text":"A flowchart is used to show the relationship between the capacity and access speed of a storage device."},{"key":"b","text":"A Gantt chart is used to show the telephone tree for emergency calls."},{"key":"c","text":"A cause and effect diagram is used to understand the reasons for the slowing of a system development project."},{"key":"d","text":"An association diagram is used to mmunication with all related parties, and so on."},{"key":"b","text":"On the occasion of the design and construction of a building, it is used to investigate the procedures for carrying out multiple tasks in the shortest period of time."},{"key":"c","text":"On the occasion of establishing quality improvement measures, it is used to analyze the number of defects for each cause and select themes to be handled with high priority."},{"key":"d","text":"On the occasion of developing a sales plan for a product with a short lifecycle, it is used to prepare several alternative solutions in consideration of competitor's reactions."}],"correctAnswer":"c","explanation":"c) On the occasion of establishing quality improvement measures, it is used to analyze the number of defects for each cause and select themes to be handled with high priority."},{"id":"2011S-Q65","session":"Spring 2011","category":null,"questionNumber":65,"prompt":"Which of the following is the appropriate use of management science techniques?","hasDiagram":false,"options":[{"key":"a","text":"PERT (Program Evaluation and Review Technique) can be used to analyze the reliability of a machine."},{"key":"b","text":"A queueing model can be used to perform financial analysis."},{"key":"c","text":"A time series analysis can be used to forecast the sales of a product in the market."},{"key":"d","text":"A simplex method can be used to control the quality of a product."}],"correctAnswer":"c","explanation":"c) A time series analysis can be used to forecast the sales of a product in the market."},{"id":"2011S-Q66","session":"Spring 2011","category":null,"questionNumber":66,"prompt":"When corporate accounting is classified into financial accounting and management accounting, which of the following describes a characteristic of management accounting?","hasDiagram":false,"options":[{"key":"a","text":"The accounts need to be settled at the end of each accounting term, and the preparation of financial statements, such as balance "text":"A service in which a service provider lends out servers and communication equipment installed in the provider's own buildings to users"},{"key":"d","text":"A service in which a service provider operates customer's servers and communication equipment installed in the provider's own buildings"}],"correctAnswer":"d","explanation":"d) A service in which a service provider operates customer's servers and communication equipment installed in the provider's own buildings"},{"id":"2011S-Q87","session":"Spring 2011","category":null,"questionNumber":87,"prompt":"On January 1, 2009 which was the first day of the fiscal year, a company bought an air conditioner for the office at 6,000 dollars. How much was its book value in dollars on December 31, 2010? Here, the service life is six years, the yearly depreciation is computed using the straight-line method, and the residual value after six years is 10%.","hasDiagram":false,"options":[{"key":"a","text":"3,600"},{"key":"b","text":"4,000"},{"key":"c","text":"4,200"},{"key":"d","text":"5,100"}],"correctAnswer":"c","explanation":"c) 4,200"},{"id":"2011S-Q88","session":"Spring 2011","category":null,"questionNumber":88,"prompt":"When Company B procures an information system according to the flow shown in the figure below, which of the following is the term to be inserted in blank A?\n*(Figure: Company B management develops business and enterprise strategy → the IT department develops system requirements → the IT department develops vendor selection criteria, which management approves → the IT department creates and distributes \\[ A \\] → the vendor receives \\[ A \\] and creates a proposal → the vendor submits the proposal → the IT department compares and evaluates proposals and selects a vendor, which management approves → contract between Company B and the selected vendor.)*","hasDiagram":true,"options":[{"key":"a","text":"NDA"},{"key":"b","text":"RFI"},{"key":"c","text":"RFP"},{"key":"d","text":"SLA"}],"correctAnswer":"c","explanation":"c) RFP"},{"id":"2011S-Q89","session":"Spring 2011","category":null,"questionNumber":89,"prompt":"**\\[Question A — Development plan for an inventory control system (Q89–Q92)\\]**\nMr. S participates in a project for constructing an inventory control system (hereinafter called the system). After the deliverables and completion criteria for the project are identified, the development plan for the system is divided into five steps—activity breakdown, activity definition, activity sequencing, activity duration estimating, and schedule development—and these steps are performed sequentially.\n\n1. In activity breakdown, the activities involved in creating deliverables are broken down into smaller components by using the WBS (Work Breakdown Structure). In other words, the WBS is used for breaking down all the activities into components and organizing these components into a hierarchical structure.\n2. In activity definition, the deliverables and person-days of each broken down activity are defined.\n3. In activity sequencing, the time sequence of activities is determined.\n4. In activity duration estimating, the duration of each activity is obtained by dividing the person-days of each activity by the number of staff members.\n5. In schedule development, the start and finish dates are determined based on the duration of each activity.\n\nUnder the supervision of the senior staff member, Mr. S performs activity breakdown for the system by using the WBS shown in the figure below.\n*(Fig. Activity breakdown for the system by using the WBS: System → System requirements definition, (not shown), Subsystem 1, Subsystem 2, (not shown) … ; Subsystem 1 → (not shown), Software architecture design, Software detailed design, (not shown) … ; Software detailed design → (not shown), Software interface detailed design, Database detailed design, (not shown) … ; Software interface detailed design → Screen design (Screen list, Screen flow, Screen layout, Screen I/O items) and Form design (Form list, Form layout, …).)*\n\nMr. S is instructed by the senior staff member to ensure that the activities that concern the entire work of system development, such as system requirements definition, are listed at the same hierarchical level as Subsystems 1, 2, and so on in the figure of activity breakdown. Which of the following is appropriate as an activity that should be listed at the same hierarchical level as system requirements definition in the figure?","hasDiagram":true,"options":[{"key":"a","text":"System audit"},{"key":"b","text":"System integration"},{"key":"c","text":"Software integration"},{"key":"d","text":"Software coding and testing"}],"correctAnswer":"b","explanation":"b) System integration"},{"id":"2011S-Q90","session":"Spring 2011","category":null,"questionNumber":90,"prompt":"**\\[Question A — Development plan for an inventory control system (Q89–Q92)\\]**\nMr. S performs activity breakdown for an inventory control system by using a WBS. At the first level under \"System\", the activities are broken down into those that concern the entire work of system development (such as System requirements definition) and subsystems (Subsystem 1, Subsystem 2, …). Under Subsystem 1, the next level contains items such as Software architecture design and Software detailed design.\n\nIn the figure of activity breakdown, the activities are broken down at the first level, with the focus on those that concern the entire work of system development and subsystems. Which of the following is the appropriate explanation concerning the activity breakdown that Mr. S performs at the next lower level for each subsystem in the figure?","hasDiagram":true,"options":[{"key":"a","text":"Mr. S breaks down the activities for each phase or process of development."},{"key":"b","text":"Mr. S breaks down the activities for each item of system requirements definition."},{"key":"c","text":"Mr. S breaks down the activities for each type of software."},{"key":"d","text":"Mr. S breaks down the activities for each module."}],"correctAnswer":"a","explanation":"a) Mr. S breaks down the activities for each phase or process of development."},{"id":"2011S-Q91","session":"Spring 2011","category":null,"questionNumber":91,"prompt":"**\\[Question A — Development plan for an inventory control system (Q89–Q92)\\]**\nIn activity definition, a table is created by adding the staff members in charge and person-days, based on the WBS created in activity breakdown. The table below shows part of the entire table (Activities 1–3 are Subsystem 1 → Software detailed design → Software interface detailed design). When the time sequence shown in the diagram below exists among the activity items of Activity 5 for screen design, how many person-days are necessary for the critical path of screen design? In the diagram, the flow of activities is represented by arrows, and activity names are shown above or below the arrows.\n\n| Activity 4 | Activity 5 | Deliverable | Staff in charge | Person-days |\n| :---- | :---- | :---- | :---- | :---- |\n| Screen design | Screen list | Screen list table | Smith | 4 |\n| Screen design | Screen flow | Screen flow diagram | Smith | 6 |\n| Screen design | Screen layout | Screen layout diagram | Johnson | 3 |\n| Screen design | Screen I/O items | Screen I/O items definition document | Johnson | 2 |\n| Form design | Form list | Form list table | Nelson | 5 |\n| Form design | Form layout | Form layout diagram | Nelson, Smith | 10 |\n\n*(Note: No staff member has the same name. Diagram: Screen list is done first; after it, two paths run in parallel to the end — Screen flow alone, or Screen layout followed by Screen I/O items.)*","hasDiagram":true,"options":[{"key":"a","text":"5"},{"key":"b","text":"9"},{"key":"c","text":"10"},{"key":"d","text":"15"}],"correctAnswer":"c","explanation":"c) 10"},{"id":"2011S-Q92","session":"Spring 2011","category":null,"questionNumber":92,"prompt":"**\\[Question A — Development plan for an inventory control system (Q89–Q92)\\]**\nMr. S performs \"activity duration estimating\" and develops a schedule by determining the start and finish dates of the individual activities, based on their durations. The table below shows part of the schedule. The senior staff member checks the schedule and points out a mistake. Which of the following is appropriate as the mistake pointed out to Mr. S? No activity is done on Saturdays and Sundays. In the June calendar, June 1 is a Sunday (so June 2–6, 9–13, 16–20, 23–27 and 30 are weekdays).\n\n| Activity 5 | Deliverable | Staff in charge | Person-days | Start date | Finish date |\n| :---- | :---- | :---- | :---- | :---- | :---- |\n| Screen list | Screen list table | Smith | 4 | June 3 | (not shown) |\n| Screen flow | Screen flow diagram | Smith | 6 | June 9 | (not shown) |\n| Screen layout | Screen layout diagram | Johnson | 3 | June 9 | (not shown) |\n| Screen I/O items | Screen I/O items definition document | Johnson | 2 | June 12 | (not shown) |\n| Form list | Form list table | Nelson | 5 | June 6 | (not shown) |\n| Form layout | Form layout diagram | Nelson, Smith | 10 | June 13 | June 19 |\n\n*(Note: No staff member has the same name.)*","hasDiagram":true,"options":[{"key":"a","text":"Since the person-days for form layout are 10, the finish date is June 26."},{"key":"b","text":"Since Mr. Smith's activity of form layout overlaps his preceding activity, the finish date cannot be set to June 19."},{"key":"c","text":"Since two staff members are assigned to the activity of form layout, the finish date can be set to June 18."},{"key":"d","text":"Since the activity of form layout requires more person-days than the other activities, its activity duration should be estimated to be longer."}],"correctAnswer":"b","explanation":"b) Since Mr. Smith's activity of form layout overlaps his preceding activity, the finish date cannot be set to June 19."},{"id":"2011S-Q93","session":"Spring 2011","category":null,"questionNumber":93,"prompt":"**\\[Question B — Managing the loan-out of documents (Q93–Q96)\\]**\nThe data room of Company A's laboratory manages the loan-out of documents with a document loan-out management system (the document system) that uses PC-based database software. The database structure is as follows (\"Doc_No\" = document number, \"Doc_title\" = document title, \"Emp_No\" = employee number, \"Emp_name\" = employee name):\n\n* Employee table: Emp_No, Emp_name, E-mail_address\n* Document table: Doc_No, Doc_title\n* Loan-out table: Doc_No, Doc_title, Emp_No, Emp_name, E-mail_address, Loan-out_date, Return_date\n\n**\\[Conditions concerning the documents held and the loan-out\\]**\n\n1. Only one copy of the same document is held, and a unique document number is assigned to each document.\n2. The maximum loan-out period is two weeks including the day on which the document is loaned out. A document returned by an employee may be loaned out to another employee on the day the document is returned, but a returned document is not loaned out to the same employee on the day it is returned.\n\n**\\[Loan-out process\\]** The document table is searched by Doc_No to obtain Doc_title; the employee table is searched by Emp_No to obtain Emp_name and E-mail_address; a loan-out record is prepared with these values, the current date as Loan-out_date and a null Return_date, and added to the loan-out table.\n**\\[Return process\\]** The loan-out table is searched by Doc_No to retrieve the loan-out record whose Return_date is null; the current date is set as its Return_date and the loan-out table is updated.\n\nWhich of the following is the appropriate description concerning the database structure of the document system? Here, a primary key is a field or combination of fields that uniquely identifies each record in a table.","hasDiagram":false,"options":[{"key":"a","text":"The primary key of the loan-out table is the combination of \"Doc_No\" and \"Emp_No\"."},{"key":"b","text":"The primary key of the loan-out table is the combination of \"Doc_No\", \"Emp_No\", and \"Loan-out_date\"."},{"key":"c","text":"The primary key of the employee table and loan-out table is \"Emp_No\"."},{"key":"d","text":"The primary key of the document table and loan-out table is \"Doc_No\"."}],"correctAnswer":"b","explanation":"b) The primary key of the loan-out table is the combination of \"Doc_No\", \"Emp_No\", and \"Loan-out_date\"."},{"id":"2011S-Q94","session":"Spring 2011","category":null,"questionNumber":94,"prompt":"**\\[Question B — Managing the loan-out of documents (Q93–Q96)\\]**\nIn the document system, the **loan-out process** searches the document table and the employee table, then adds a new record (with a null Return_date) to the loan-out table. The **return process** searches the loan-out table by Doc_No for the record whose Return_date is null, sets the current date as Return_date, and updates the loan-out table.\n\nThe DFD shown below is created based on the loan-out process and return process for the document system. Which of the following is the appropriate combination of the terms to be inserted in blanks A through C in the DFD?\n*(DFD: \"Employee\" sends data to process \"\\[A\\] process\" and to process \"\\[C\\] process\". \"\\[A\\] process\" also reads from two data stores (not shown) and writes to the data store \"\\[B\\] table\". \"\\[C\\] process\" both reads from and writes to \"\\[B\\] table\".)*\n\n| | A | B | C |\n| :---- | :---- | :---- | :---- |\n| a) | Loan-out | Loan-out | Return |\n| b) | Loan-out | Document | Return |\n| c) | Return | Loan-out | Loan-out |\n| d) | Return | Document | Loan-out |","hasDiagram":false,"options":[{"key":"a","text":"A: Loan-out, B: Loan-out, C: Return"},{"key":"b","text":"A: Loan-out, B: Document, C: Return"},{"key":"c","text":"A: Return, B: Loan-out, C: Loan-out"},{"key":"d","text":"A: Return, B: Document, C: Loan-out"}],"correctAnswer":"a","explanation":"a) A: Loan-out, B: Loan-out, C: Return"},{"id":"2011S-Q95","session":"Spring 2011","category":null,"questionNumber":95,"prompt":"**\\[Question B — Managing the loan-out of documents (Q93–Q96)\\]**\nThe staff member receives many queries about documents from employees, so a document search function is to be added to the document system (tables: Document table with Doc_No and Doc_title; Loan-out table with Doc_No, Doc_title, Emp_No, Emp_name, E-mail_address, Loan-out_date, Return_date).\n\n**\\[Outline of the document search function\\]**\n\n1. The function does a fuzzy search in the document table by using the queried \"Doc_title\" and displays the result.\n2. The function checks whether the corresponding document exists and, if the document exists, determines whether it is available for loan-out. If the loan-out record is found with a null \"Return_date\", the corresponding document is out on loan.\n3. The function displays whether the document is currently out on loan or available for loan-out.\n\n*(Flowchart: Start → fuzzy search in the Document table by Doc_title and display the result → \"Is the corresponding document found?\" — No: display \"Document not found\" → End. Yes: \\[D\\] → \"Does the corresponding loan-out record exist?\" — Yes: \\[F\\]; No: \\[E\\] → End.)*\n\n* (i) Display \"Available for loan-out\"\n* (ii) Display \"Out on loan\"\n* (iii) Search the loan-out table by using \"Doc_No\", and retrieve the loan-out record that has a null value as \"Return_date\"\n* (iv) Search the loan-out table by using \"Doc_No\", and retrieve the loan-out record that has the oldest \"Loan-out_date\"\n\nWhich of the following is the appropriate combination of the phrases to be inserted in blanks D through F in the figure?","hasDiagram":true,"options":[{"key":"a","text":"D: (iii), E: (i), F: (ii)"},{"key":"b","text":"D: (iii), E: (ii), F: (i)"},{"key":"c","text":"D: (iv), E: (i), F: (ii)"},{"key":"d","text":"D: (iv), E: (ii), F: (i)"}],"correctAnswer":"a","explanation":"a) D: (iii), E: (i), F: (ii)"},{"id":"2011S-Q96","session":"Spring 2011","category":null,"questionNumber":96,"prompt":"**\\[Question B — Managing the loan-out of documents (Q93–Q96)\\]**\nIn the document system, each loan-out adds a record to the loan-out table with the current date as \"Loan-out_date\" and a null \"Return_date\"; when the document is returned, the current date is set as \"Return_date\". The maximum loan-out period is two weeks including the day on which the document is loaned out.\n\nAn investigation is done to contact the employees who have not returned documents within two weeks including the loan-out date. Which of the following is the appropriate method of retrieving these employees?","hasDiagram":false,"options":[{"key":"a","text":"Retrieving the records whose \"Loan-out_date\" in the loan-out table is a null value and whose \"Return_date\" is within two weeks from the investigation date"},{"key":"b","text":"Retrieving the records whose \"Loan-out_date\" in the loan-out table is two weeks ago from the investigation date or earlier"},{"key":"c","text":"Retrieving the records whose \"Return_date\" in the loan-out table is a null value and whose \"Loan-out_date\" is two weeks ago from the investigation date or earlier"},{"key":"d","text":"Retrieving the records whose \"Return_date\" in the loan-out table is a null value"}],"correctAnswer":"c","explanation":"c) Retrieving the records whose \"Return_date\" in the loan-out table is a null value and whose \"Loan-out_date\" is two weeks ago from the investigation date or earlier"},{"id":"2011S-Q97","session":"Spring 2011","category":null,"questionNumber":97,"prompt":"**\\[Question C — Enterprise strategy planning (Q97–Q100)\\]**\nThe planning department of Company S, a health food maker, is planning a strategy for the healthy confectionery business. It has classified the company's situation into strengths, weaknesses, opportunities, and threats through SWOT analysis, and created two draft policies.\n\n**\\[Situation of Company S\\]**\n\n1. The company has fewer business sites than competitors do.\n2. Company T, a competitor, has decided to withdraw from the healthy confectionery business.\n3. The company has greater product planning ability than that of competitors.\n4. A growing fitness trend is generating higher interest in healthy food.\n5. The company's factory is getting old.\n6. The number of children is decreasing because of the declining birthrate.\n7. Consumers are becoming more conscious about the safety of food.\n8. The company has gathered customer information by having customers enroll as members and succeeded in including rich people in its membership as well.\n\n\\[Situation of Company S\\] is summarized as shown in the table below. When (1) and (2) in \\[Situation of Company S\\] are categorized into cells A through D in the table, which of the following is the appropriate combination?\n\n| | Advantage | Disadvantage |\n| :---- | :---- | :---- |\n| Internal environment | A | B |\n| External environment | C | D |","hasDiagram":false,"options":[{"key":"a","text":"(1) → B, (2) → C"},{"key":"b","text":"(1) → B, (2) → D"},{"key":"c","text":"(1) → D, (2) → C"},{"key":"d","text":"(1) → D, (2) → D"}],"correctAnswer":"a","explanation":"a) (1) → B, (2) → C"},{"id":"2011S-Q98","session":"Spring 2011","category":null,"questionNumber":98,"prompt":"**\\[Question C — Enterprise strategy planning (Q97–Q100)\\]**\n**\\[Situation of Company S\\]** (a health food maker planning a strategy for the healthy confectionery business)\n\n1. The company has fewer business sites than competitors do.\n2. Company T, a competitor, has decided to withdraw from the healthy confectionery business.\n3. The company has greater product planning ability than that of competitors.\n4. A growing fitness trend is generating higher interest in healthy food.\n5. The company's factory is getting old.\n6. The number of children is decreasing because of the declining birthrate.\n7. Consumers are becoming more conscious about the safety of food.\n8. The company has gathered customer information by having customers enroll as members and succeeded in including rich people in its membership as well.\n\nAmong the items in \\[Situation of Company S\\], which of the following is the appropriate combination of the items that can be categorized as strengths?","hasDiagram":false,"options":[{"key":"a","text":"(1) and (5)"},{"key":"b","text":"(2) and (4)"},{"key":"c","text":"(3) and (8)"},{"key":"d","text":"(6) and (7)"}],"correctAnswer":"c","explanation":"c) (3) and (8)"},{"id":"2011S-Q99","session":"Spring 2011","category":null,"questionNumber":99,"prompt":"**\\[Question C — Enterprise strategy planning (Q97–Q100)\\]**\nCompany S, a health food maker, has greater product planning ability than its competitors and has gathered customer information by having customers enroll as members (including rich people). Its weaknesses include fewer business sites than competitors and an aging factory.\n\n**\\[Outline of the draft policies\\]**\nDraft policy 1: Company S will improve its information system to further develop its strengths.\nDraft policy 2: Company S will acquire the business from which Company T withdraws, in order to expand its own business.\n\nWhich of the following is the appropriate description concerning the measure to further develop the company's strengths according to draft policy 1?","hasDiagram":false,"options":[{"key":"a","text":"Introducing an Internet online shopping system that is little affected by the number of business sites"},{"key":"b","text":"Constructing a CRM system to analyze purchase data of customers and provide members with well tailored services"},{"key":"c","text":"Renovating the production management system in order to ensure thorough safety control in the production process of products"},{"key":"d","text":"Introducing a POS system with the aim of analyzing statistical data concerning the population distribution of each region when a plan is created for healthy confectionery targeted at adults"}],"correctAnswer":"b","explanation":"b) Constructing a CRM system to analyze purchase data of customers and provide members with well tailored services"},{"id":"2011S-Q100","session":"Spring 2011","category":null,"questionNumber":100,"prompt":"**\\[Question C — Enterprise strategy planning (Q97–Q100)\\]**\nDraft policy 2: Company S will acquire the business from which Company T withdraws, in order to expand its own business. The market shares that individual companies have maintained in healthy confectionery over the several past years are 25% for Company Q, 16% for Company R, 12% for Company S, 10% for Company T, and 37% for others. Company S has greater product planning ability than its competitors.\n\nWhen draft policy 2 is carried forward, the company can respond to (1) fewer business sites and (5) an aging factory, and is expected to secure almost all the market share held by Company T. When one of the strategies shown in the table below is adopted based on the market share, which of the following is the appropriate description concerning the strategy that Company S adopts after the acquisition of Company T?\n\n| Market share | Strategy to adopt |\n| :---- | :---- |\n| Company ranked first in market share | Expand the scale of the entire market |\n| Company ranked second in market share | Attack competitors by taking advantage of its strengths |\n| Company ranked third or lower in market share but having the largest market share for a specific product | Adapt to specific needs |\n| Other than the above | Cut costs through imitation |","hasDiagram":false,"options":[{"key":"a","text":"Creating a healthy confectionery product similar to the popular product of Company Q, and selling the product at a price lower than Company Q's product"},{"key":"b","text":"Specializing in producing allergy-free healthy confectionery, and aiming to provide high-price, high-profit products"},{"key":"c","text":"Promoting the fitness trend among people through advertising and other means, and increasing the demand itself for healthy confectionery"},{"key":"d","text":"Investing funds in the departments related to product planning, and planning and selling highly competitive and superior products"}],"correctAnswer":"d","explanation":"d) Investing funds in the departments related to product planning, and planning and selling highly competitive and superior products"},{"id":"2011A-Q01","session":"Autumn 2011","category":null,"questionNumber":1,"prompt":"Which of the following is an appropriate description concerning the Java language?","hasDiagram":false,"options":[{"key":"a","text":"It is a markup language used for describing Web pages."},{"key":"b","text":"It is a language developed for scientific and engineering calculations."},{"key":"c","text":"It is an object-oriented language that provides platform-independent portability."},{"key":"d","text":"It is a language developed for business-oriented calculations."}],"correctAnswer":"c","explanation":"c) It is an object-oriented language that provides platform-independent portability."},{"id":"2011A-Q02","session":"Autumn 2011","category":null,"questionNumber":2,"prompt":"Which of the following is an appropriate description concerning the usage of HTML (Hyper Text Markup Language) tags?","hasDiagram":false,"options":[{"key":"a","text":"\\\u003cLABEL\\> is used to define the title of a Web page."},{"key":"b","text":"\\\u003cBODY\\> is used to describe the text of a Web page."},{"key":"c","text":"\\\u003cBIG\\> is used to specify the size and style applied to each character in a Web page."},{"key":"d","text":"\\\u003cFORM\\> is used to divide a Web page into multiple frames."}],"correctAnswer":"b","explanation":"b) \\\u003cBODY\\> is used to describe the text of a Web page."},{"id":"2011A-Q03","session":"Autumn 2011","category":null,"questionNumber":3,"prompt":"Which of the following is an appropriate description concerning XML (eXtensible Markup Language)?","hasDiagram":false,"options":[{"key":"a","text":"It is an object-oriented language based on C++, but simplified to eliminate language features that cause common programming errors."},{"key":"b","text":"It is an interpreter language for text processing and also a standard language for CGI (Common Gateway Interface) programs that run on a Web server."},{"key":"c","text":"It is a page description language used in the electronic and desktop publishing areas for defining the contents and layout of a printed page."},{"key":"d","text":"It is a language that enables users to create their own tags in order to describe the structure and content of a document."}],"correctAnswer":"d","explanation":"d) It is a language that enables users to create their own tags in order to describe the structure and content of a document."},{"id":"2011A-Q04","session":"Autumn 2011","category":null,"questionNumber":4,"prompt":"When a relation between objects is abstracted, the relation from X to Y (called an order relation) is represented as $(X,Y)$ and illustrated as $X\\rightarrow Y$. Which of the following is the diagram that illustrates three sets of order relations \"$(A,B),(A,C),(B,D)$\"?","hasDiagram":true,"options":[{"key":"a","text":"Diagram a ($C\\rightarrow A$, $A\\rightarrow B$, $D\\rightarrow B$)"},{"key":"b","text":"Diagram b ($A\\rightarrow C$, $A\\rightarrow B$, $D\\rightarrow B$)"},{"key":"c","text":"Diagram c ($B\\rightarrow A$, $A\\rightarrow C$, $B\\rightarrow D$)"},{"key":"d","text":"Diagram d ($A\\rightarrow B$, $A\\rightarrow C$, $B\\rightarrow D$)"}],"correctAnswer":"d","explanation":"d) Diagram d"},{"id":"2011A-Q05","session":"Autumn 2011","category":null,"questionNumber":5,"prompt":"The data is exchanged between variable A and variable B. When variable TMP is used to temporarily store data, which of the following is the procedure for exchanging data correctly? Here, \"$x\\leftarrow y$\" indicates that the content of \"$x$\" is replaced with the data of \"$y$\".","hasDiagram":false,"options":[{"key":"a","text":"$TMP\\leftarrow A$; $A\\leftarrow B$; $B\\leftarrow A$"},{"key":"b","text":"$TMP\\leftarrow A$; $A\\leftarrow B$; $B\\leftarrow TMP$"},{"key":"c","text":"$TMP\\leftarrow B$; $A\\leftarrow B$; $B\\leftarrow TMP$"},{"key":"d","text":"$TMP\\leftarrow B$; $A\\leftarrow B$; $B\\leftarrow A$"}],"correctAnswer":"b","explanation":"b) $TMP\\leftarrow A$; $A\\leftarrow B$; $B\\leftarrow TMP$"},{"id":"2011A-Q06","session":"Autumn 2011","category":null,"questionNumber":6,"prompt":"When the reward for an improvement proposal concerning business operations is determined based on the decision table below, how much is the reward for an improvement proposal that results in an improvement of \\$20,000 and a turnaround time reduction of three days? Here, \"Y\" in the table means that each condition holds \"true\", and \"N\" means \"not true\". In addition, \"\\$\\\\checkmark\\$\" indicates the reward that applies to a specific combination of these conditions.\n\n| Condition | Rules |\n| :---- | :---- |\n| Improvement of less than \\$10,000 | Y Y N N |\n| Turnaround time reduction of less than one week | Y N Y N |\n| **Reward** |  |\n| \\$50 | \\$\\\\checkmark\\$ |\n| \\$100 | \\$\\\\checkmark\\$ |\n| \\$150 | \\$\\\\checkmark\\$ |\n| \\$300 | \\$\\\\checkmark\\$ |","hasDiagram":false,"options":[{"key":"a","text":"\\$50"},{"key":"b","text":"\\$100"},{"key":"c","text":"\\$150"},{"key":"d","text":"\\$300"}],"correctAnswer":"b","explanation":"b) \\$100"},{"id":"2011A-Q07","session":"Autumn 2011","category":null,"questionNumber":7,"prompt":"When a sound is recorded in a computer file, it is to be stored as a series of 8-bit encoded data. When the same sound source is sampled at the same sampling frequency and then encoded as a series of 16-bit data in lieu of 8-bit data, which of the following is an appropriate explanation concerning this encoding?","hasDiagram":false,"options":[{"key":"a","text":"The amplitude of the sound can be recorded more finely."},{"key":"b","text":"When the recording time is the sam
