}

  --bg: #0f1216; --surface: #171b21; --surface-2: #1f242c; --border: #2c333d;
  --text: #e6e9ee; --muted: #9aa4b2; --accent: #7b9cff; --accent-soft: #1e2a4a;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.55 var(--font);

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
.topbar .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 0; }
.brand { font-weight: 650; font-size: 1.02rem; margin-right: auto; }
.brand small { display: block; font-weight: 450; color: var(--muted); font-size: .78rem; }
.brand .home { display: block; font-weight: 500; font-size: .78rem; color: var(--accent); text-decoration: none; margin-bottom: 2px; }
.brand .home:hover { text-decoration: underline; }
.stats { display: flex; gap: 16px; font-size: .85rem; color: var(--muted); }
.stats b { color: var(--text); font-variant-numeric: tabular-nums; font-size: .98rem; }
.progress { height: 3px; background: var(--surface-2); }
.progress > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
  padding: 6px 12px; font-size: .88rem; line-height: 1.3; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.danger:hover { color: var(--bad); border-color: var(--bad-border); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: .88rem; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 0 6px; }
.filters input[type="search"] { flex: 1 1 240px; min-width: 0; }

}
.meta-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; padding: 4px 0 12px; flex-wrap: wrap; }

/* Question cards */
main { padding-bottom: 64px; }
.q {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);

.q-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.q-num { font-weight: 650; }
.tag { font-size: .74rem; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.bm { margin-left: auto; border: 0; background: none; font-size: 1.25rem; line-height: 1; color: var(--muted); padding: 2px 4px; }
.bm[aria-pressed="true"] { color: var(--star); }

.prompt th, .prompt td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
.prompt th { background: var(--surface-2); }
.note-fig { font-size: .82rem; color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 6px 10px; margin: 4px 0 10px; }

.opts { display: grid; gap: 8px; margin-top: 8px; }
.opt {
  display: flex; align-items: flex-start; gap: 10px; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
}
.opt:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt .k {
  flex: none; width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); font-size: .82rem; font-weight: 600;
}
.opt .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .m { flex: none; }
.opt.correct { background: var(--ok-bg); border-color: var(--ok-border); }
.opt.correct .k { background: var(--ok); color: var(--surface); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad-border); }
.opt.wrong .k { background: var(--bad); color: var(--surface); }
.opt.dim { opacity: .62; }

.q-foot { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 2px 0; font-size: .88rem; }
.linkbtn + .linkbtn { margin-left: 12px; }
.explain {
  margin-top: 12px; padding: 10px 12px; border-left: 3px solid var(--ok-border);
  background: var(--surface-2); border-radius: 0 8px 8px 0; font-size: .94rem;

.doc .q { box-shadow: none; padding: 16px 20px; }
.doc .doc-opts { list-style: none; padding: 0; margin: 6px 0 8px; }
.doc .doc-opts li { padding: 2px 0; }
.doc .doc-opts li.correct { font-weight: 600; color: var(--ok); }
.doc .doc-ans { font-size: .94rem; }

.empty { text-align: center; color: var(--muted); padding: 48px 0; }
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: .88rem;
  transition: .2s; pointer-events: none; z-index: 20;
}
.toast.show { opacity: 1; transform: translateX(-50%); }
footer { color: var(--muted); font-size: .8rem; text-align: center; padding: 8px 0 32px; }
.katex { font-size: 1.05em; }
code { font: .92em ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; background: var(--surface-2); border-radius: 4px; padding: 1px 5px; }

@media (max-width: 640px) {
  .stats { gap: 12px; width: 100%; order: 3; }
  .q { padding: 14px 14px; }
  .brand { flex-basis: 100%; }
}
</style>

g and also a backup system that is made on standby while performing batch processing. In the event of a failure in the currently used system, it switches to the backup system, starts the online processing on it, and continues the service."},{"key":"d","text":"It connects multiple devices in series and configures them in such a way that the load of each function is distributed among them, so that processing capability is high. But if any one of the devices fails, it becomes unable to provide the service."}],"correctAnswer":"a","explanation":"a) It provides two (2) sets of systems that perform the same processing and checks the correctness of the processing by comparing the results. If one of the systems fails, it isolates the failed system and continues the processing."},{"id":"2019S-Q17","session":"Spring 2019","category":null,"questionNumber":17,"prompt":"What is the minimum amount (in Mbytes) of virtual memory that is required under the conditions below?\n\n**[Conditions]**\n\n1. Memory required for the OS: 200 Mbytes\n2. Memory required for applications: An amount of 50 Mbytes is required for each application, and a total is calculated by multiplying it by the number of applications that run concurrently. Eight (8) applications run concurrently.\n3. Memory required for controlling main memory or other related functions: In addition to 512 Mbytes of main memory, a minimum amount of 20 Mbytes is required.\n4. Required virtual memory: The required amount is the sum of the above 1 through 3.","hasDiagram":false,"options":[{"key":"a","text":"762"},{"key":"b","text":"782"},{"key":"c","text":"1,112"},{"key":"d","text":"1,132"}],"correctAnswer":"d","explanation":"d) 1,132"},{"id":"2019S-Q18","session":"Spring 2019","category":null,"questionNumber":18,"prompt":"Which of the following explains the functions of an archiver, which is one (1) type of data management utility?","hasDiagram":false,"options":[{"key":"a","text":"It creates areas on hard disks for storing data and {"key":"a","text":"`$B$1*((1+$B2)^$A4 −1)`"},{"key":"b","text":"`$B$1*((1+$B2)^A$4 −1)`"},{"key":"c","text":"`$B$1*((1+B$2)^$A4 −1)`"},{"key":"d","text":"`$B$1*((1+B$2)^A$4 −1)`"}],"correctAnswer":"c","explanation":"c) `$B$1*((1+B$2)^$A4 −1)`"},{"id":"2019S-Q21","session":"Spring 2019","category":null,"questionNumber":21,"prompt":"Which of the following is the most appropriate purpose of installing a business application software package instead of developing own application software?","hasDiagram":false,"options":[{"key":"a","text":"To enhance the environment of development"},{"key":"b","text":"To reduce the cost of development"},{"key":"c","text":"To acquire the knowledge of software development methods"},{"key":"d","text":"To improve the skills of application developers"}],"correctAnswer":"b","explanation":"b) To reduce the cost of development"},{"id":"2019S-Q22","session":"Spring 2019","category":null,"questionNumber":22,"prompt":"Which of the following is an appropriate description about the function keys of a PC?","hasDiagram":false,"options":[{"key":"a","text":"They are the keys where specific functions are assigned for each application and OS."},{"key":"b","text":"They display a keyboard shape on a screen and enable input processing with software."},{"key":"c","text":"They have a security role and are keys for performing encryption and decryption."},{"key":"d","text":"They are information to identify specific lines uniquely in a database."}],"correctAnswer":"a","explanation":"a) They are the keys where specific functions are assigned for each application and OS."},{"id":"2019S-Q23","session":"Spring 2019","category":null,"questionNumber":23,"prompt":"Which of the following is a computer that is used for tasks such as global scale environmental simulations and DNA analysis, and was developed with the objective of processing large amount of calculations at ultra high speed?","hasDiagram":false,"options":[{"key":"a","text":"Virtual computer"},{"key":"b","text": ne sales"},{"key":"c","text":"A search process for library information"},{"key":"d","text":"A reservation process for train tickets"}],"correctAnswer":"c","explanation":"c) A search process for library information"},{"id":"2019S-Q27","session":"Spring 2019","category":null,"questionNumber":27,"prompt":"Which of the following is a term for an operation that extracts only the rows (records) with a price of 100 yen or more, from the “Product” table of a relational database?","hasDiagram":false,"options":[{"key":"a","text":"Join"},{"key":"b","text":"Projection"},{"key":"c","text":"Selection"},{"key":"d","text":"Union"}],"correctAnswer":"c","explanation":"c) Selection"},{"id":"2019S-Q28","session":"Spring 2019","category":null,"questionNumber":28,"prompt":"A customer name and his or her address, a product name and its unit price, the number of products ordered by the customer, and the date of order are to be managed by using a relational database. Which of the following is an appropriate table after normalization? Here, the underline represents primary keys, and there are same customer names and product names.","hasDiagram":false,"options":[{"key":"a","text":"CUSTOMER (CustomerNumber, CustomerName, Address), PRODUCT (ProductNumber, ProductName, UnitPrice), ORDER (OrderNumber, CustomerNumber, ProductNumber, Quantity, Date)"},{"key":"b","text":"CUSTOMER (CustomerNumber, CustomerName, Address), PRODUCT (ProductNumber, ProductName, UnitPrice), ORDER (OrderNumber, CustomerName, ProductName, Quantity, Date)"},{"key":"c","text":"CUSTOMER (CustomerNumber, CustomerName, Address, Date), ORDER (OrderNumber, CustomerName, ProductName, UnitPrice, Quantity)"},{"key":"d","text":"PRODUCT (ProductNumber, ProductName, UnitPrice, Quantity), ORDER (OrderNumber, ProductNumber, CustomerName, Address, Date)"}],"correctAnswer":"a","explanation":"a) CUSTOMER (CustomerNumber, CustomerName, Address), PRODUCT (ProductNumber, ProductName, UnitPrice), ORDER (OrderNumber, CustomerNumber, ProductNumber, Quantity, Date)"},{"id":"2019S-Q29","session":"Spring 2019","category":null,"questionNumber":29,"prompt":"When character strings are searched by using wildcard characters with expression “_A_.te??”, which of the following lists all and only the character strings that match the search condition among the character strings I through IV? Here, the wildcard character “?” represents any one (1) character and “\\*” represents a character string that consists of zero (0) or more of any characters.\n\nI. A.text\nII. AA.tex\nIII. B.Atex\nIV. BA.Btext","hasDiagram":false,"options":[{"key":"a","text":"I"},{"key":"b","text":"I, II"},{"key":"c","text":"II, III, IV"},{"key":"d","text":"III, IV"}],"correctAnswer":"a","explanation":"a) I"},{"id":"2019S-Q30","session":"Spring 2019","category":null,"questionNumber":30,"prompt":"Which of the following is an appropriate description concerning communications protocols?","hasDiagram":false,"options":[{"key":"a","text":"There are no communications protocols that are used in analog communication."},{"key":"b","text":"They are developed only by international organizations, and those developed independently by manufacturers are not called communications protocols."},{"key":"c","text":"In communications protocols, only the procedure of actions in normal cases are defined."},{"key":"d","text":"Devices that are provided by different manufacturers or have different OS can communicate with each other if they use the same communications protocol."}],"correctAnswer":"d","explanation":"d) Devices that are provided by different manufacturers or have different OS can communicate with each other if they use the same communications protocol."},{"id":"2019S-Q31","session":"Spring 2019","category":null,"questionNumber":31,"prompt":"When another network such as the Internet is accessed from a network in an office or a household, which of the following fulfills the role of an entrance or an exit to the other network?","hasDiagram":false,"options":[{"key":"a","text":"Splitter"},{"key":"b","text":"Default gateway"},{"key":"c","text":"Hub"},{"key":"d","text":"Repeater"}],"correctAnswer":"b","explanation":"b) Default gateway"},{"id":"2019S-Q32","session":"Spring 2019","category":null,"questionNumber":32,"prompt":"Which of the following is used to identify a wireless network?","hasDiagram":false,"options":[{"key":"a","text":"Bluetooth"},{"key":"b","text":"SSID"},{"key":"c","text":"LTE"},{"key":"d","text":"WPA2"}],"correctAnswer":"b","explanation":"b) SSID"},{"id":"2019S-Q33","session":"Spring 2019","category":null,"questionNumber":33,"prompt":"Which of the following network is a WAN?","hasDiagram":false,"options":[{"key":"a","text":"It is a network that uses a company’s own communication lines, and connects buildings within the same premises."},{"key":"b","text":"It is a network that connects the floors in a company’s building."},{"key":"c","text":"It is a network that uses a communications service provider’s communication lines, and connects a head office with branch offices."},{"key":"d","text":"It is a network that connects the PCs on one floor."}],"correctAnswer":"c","explanation":"c) It is a network that uses a communications service provider’s communication lines, and connects a head office with branch offices."},{"id":"2019S-Q34","session":"Spring 2019","category":null,"questionNumber":34,"prompt":"Mr. A sent an e-mail message to the recipients below. Which of the following is an appropriate explanation of the information that the recipients of the message can determine?\n\n**[Destinations]**\nTo: Mr. B, Mr. C\nCc: Mr. D\nBcc: Mr. E, Mr. F","hasDiagram":false,"options":[{"key":"a","text":"Mr. B can see that the same message was also sent to Mr. E."},{"key":"b","text":"Mr. C can see that the same message was also sent to Mr. B and Mr. D."},{"key":"c","text":"Mr. D can see that the same message was also sent to Mr. E."},{"key":"d","text":"Mr. E can see that the same message was also sent to Mr. C and Mr. F."}],"correctAnswer":"b","explanation":"b) Mr. C can see that the same message was also sent to Mr. B and Mr. D."},{"id":"2019S-Q35","session":"Spring 2019","category":null,"questionNumber":35,"prompt":"Which of the following is a term for software that encrypts files on a PC in order to make them unusable, and demands money or other valuables in exchange for the decryption key?","hasDiagram":false,"options":[{"key":"a","text":"Keylogger"},{"key":"b","text":"Ransomware"},{"key":"c","text":"Rootkit"},{"key":"d","text":"Worm"}],"correctAnswer":"b","explanation":"b) Ransomware"},{"id":"2019S-Q36","session":"Spring 2019","category":null,"questionNumber":36,"prompt":"When treatments against information security risks are categorized into risk transfer, risk avoidance, risk acceptance, and risk reduction, which of the following is the description that corresponds to risk acceptance?","hasDiagram":false,"options":[{"key":"a","text":"Taking security measures, and reducing the likelihood that problems will occur."},{"key":"b","text":"Without taking any special action, estimating the impact when damage occurs."},{"key":"c","text":"Shifting risk to a third party through insurance."},{"key":"d","text":"Removing the causes of a problem, and eliminating the likelihood that the risk will materialize."}],"correctAnswer":"b","explanation":"b) Without taking any special action, estimating the impact when damage occurs."},{"id":"2019S-Q37","session":"Spring 2019","category":null,"questionNumber":37,"prompt":"Which of the following is an appropriate description about password management?","hasDiagram":false,"options":[{"key":"a","text":"A password that is used for a business system should not be used for any private Internet services."},{"key":"b","text":"The initial password should not be changed until a user becomes familiar with the operation of login to the system."},{"key":"c","text":"Several passwords should be prepared and used in rotation."},{"key":"d","text":"A password should be stored in a plaintext file and saved on a PC."}],"correctAnswer":"a","explanation":"a) A password that is used for a business system should not be used for any private Internet services."},{"id":"2019S-Q38","session":"Spring 2019","category":null,"questionNumber":38,"prompt":"When a user accessed the URL in the body of an e-mail message with a PC, the message shown in the figure appeared on the screen and the PC was locked. What is used in this attack?\n\n_\"This PC is locked. To unlock the PC, you need a password. If you want to know the password, please transfer money within 48 hours. If you fail to make the payment within that period, you will no longer be able to unlock your PC. The payment method is as follows.\"_","hasDiagram":true,"options":[{"key":"a","text":"Keylogger"},{"key":"b","text":"Spyware"},{"key":"c","text":"Bot"},{"key":"d","text":"Ransomware"}],"correctAnswer":"d","explanation":"d) Ransomware"},{"id":"2019S-Q39","session":"Spring 2019","category":null,"questionNumber":39,"prompt":"Which of the following is **not** an example of a cyber attack?","hasDiagram":false,"options":[{"key":"a","text":"With a purpose of obtaining confidential information, looking for recorded media that were disposed of from an office."},{"key":"b","text":"By exploiting a vulnerability of a server, breaking into its Web site, and making unauthorized modification to its data."},{"key":"c","text":"By sending a large amount of requests at once, disrupting a service."},{"key":"d","text":"By using a back door, remotely controlling another person’s PC."}],"correctAnswer":"a","explanation":"a) With a purpose of obtaining confidential information, looking for recorded media that were disposed of from an office."},{"id":"2019S-Q40","session":"Spring 2019","category":null,"questionNumber":40,"prompt":"In a corporate network, which of the following is a server that should be installed in a corporate LAN rather than in the demilitarized zone (DMZ)?","hasDiagram":false,"options":[{"key":"a","text":"An e-mail server that receives e-mails from outside the company."},{"key":"b","text":"A DNS server where IP addresses of servers that are open to the public are registered."},{"key":"c","text":"A file server that stores confidential information of the company."},{"key":"d","text":"A Web server that publishes information to the outside of the company."}],"correctAnswer":"c","explanation":"c) A file server that stores confidential information of the company."},{"id":"2019S-Q41","session":"Spring 2019","category":null,"questionNumber":41,"prompt":"Among the information I through IV used for authentication, which of the following lists all and only the biometrics used for authentication?\n\nI. PIN (Personal Identification Number)\nII. Iris\nIII. Fingerprint\nIV. Vein","hasDiagram":false,"options":[{"key":"a","text":"I, II, III"},{"key":"b","text":"II, III"},{"key":"c","text":"II, III, IV"},{"key":"d","text":"IV"}],"correctAnswer":"c","explanation":"c) II, III, IV"},{"id":"2019S-Q42","session":"Spring 2019","category":null,"questionNumber":42,"prompt":"When information security management is based on the PDCA cycle, which of the following corresponds to **C** (Check)?","hasDiagram":false,"options":[{"key":"a","text":"The objectives, processes, and procedures for information security are established."},{"key":"b","text":"Improvement is made through corrective and preventive actions on the basis of an evaluation."},{"key":"c","text":"Processes and procedures are introduced and operated."},{"key":"d","text":"Effectiveness of the processes are measured and evaluated."}],"correctAnswer":"d","explanation":"d) Effectiveness of the processes are measured and evaluated."},{"id":"2019S-Q43","session":"Spring 2019","category":null,"questionNumber":43,"prompt":"Which of the following is appropriate as the characteristic of single sign-on?","hasDiagram":false,"options":[{"key":"a","text":"It is an effective countermeasure for information leakage because data is processed and cess includes system requirements definition, system design, programming, test, and software acceptance. When a new system is developed, which of the following is defined as a system requirement in the initial stage of development?","hasDiagram":false,"options":[{"key":"a","text":"Device configuration of the system"},{"key":"b","text":"Development standard of the system"},{"key":"c","text":"Scope of the system"},{"key":"d","text":"Test plan of the system"}],"correctAnswer":"c","explanation":"c) Scope of the system"},{"id":"2019S-Q47","session":"Spring 2019","category":null,"questionNumber":47,"prompt":"In the process of system requirements definition, which of the following is an appropriate evaluation criteria for system requirements?","hasDiagram":false,"options":[{"key":"a","text":"Consistency with results of system integration test"},{"key":"b","text":"Consistency with needs of system outsourcer"},{"key":"c","text":"Appropriateness of the design method used"},{"key":"d","text":"Coverage of test cases"}],"correctAnswer":"b","explanation":"b) Consistency with needs of system outsourcer"},{"id":"2019S-Q48","session":"Spring 2019","category":null,"questionNumber":48,"prompt":"Which of the following is an appropriate test for a user to confirm by himself/herself whether the delivered software satisfies the requirements?","hasDiagram":false,"options":[{"key":"a","text":"Acceptance test"},{"key":"b","text":"Integration test"},{"key":"c","text":"System test"},{"key":"d","text":"Unit test"}],"correctAnswer":"a","explanation":"a) Acceptance test"},{"id":"2019S-Q49","session":"Spring 2019","category":null,"questionNumber":49,"prompt":"It has been decided that a department will participate in the test of a newly developed business system as the user department. Which of the following is an appropriate matter that should be confirmed as the user department?","hasDiagram":false,"options":[{"key":"a","text":"Business requirements are satisfied."},{"key":"b","text":"Individual programs run according to the program specifications."},{"key":"c","text":"The network that is used by the system can be monitored according to the predetermined procedure."},{"key":"d","text":"Data is exchanged between the programs as specified in the design document."}],"correctAnswer":"a","explanation":"a) Business requirements are satisfied."},{"id":"2019S-Q50","session":"Spring 2019","category":null,"questionNumber":50,"prompt":"Software development models include the waterfall model, spiral model, prototyping model, and RAD, etc. Which of the following is the most appropriate explanation of the waterfall model?","hasDiagram":false,"options":[{"key":"a","text":"After all activities in each phase in the development are complete, the project proceeds to the next phase."},{"key":"b","text":"The functions to be developed are divided, and each function is efficiently and swiftly developed with the use of development tools and parts."},{"key":"c","text":"At an early phase in software development, a prototype is created that enables users to visually confirm requirements."},{"key":"d","text":"The functions of a software are divided, and the software is gradually completed through repeated design and development for each function so that feedback from users can be incorporated."}],"correctAnswer":"a","explanation":"a) After all activities in each phase in the development are complete, the project proceeds to the next phase."},{"id":"2019A-Q01","session":"Autumn 2019","category":null,"questionNumber":1,"prompt":"As shown in Figure 1, there is a box that generates a single output for two inputs. The input in this box is either “Agree” or “Disagree,” and the output of “Agree” is generated only when both inputs are “Agree,” while in other cases the output of “Disagree” is generated. When three inputs are entered into two boxes as shown in Figure 2, which of the following is the correct description concerning the output?","hasDiagram":true,"options":[{"key":"a","text":"The output of “Agree” is generated at all times when one or more inputs are “Agree.”"},{"key":"b","text":"The output of “Agree” is generated at all times when two or more inputs are “Agree.”"},{"key":"c","text":"The output of “Disagree” is generated only when two or more inputs are “Disagree.”"},{"key":"d","text":"The output of “Agree” is generated only when all three inputs are “Agree.”"}],"correctAnswer":"d","explanation":"d) The output of “Agree” is generated only when all three inputs are “Agree.”"},{"id":"2019A-Q02","session":"Autumn 2019","category":null,"questionNumber":2,"prompt":"When a sound is recorded in a computer file, it is to be stored as a series of 8-bit encoded data. When the same sound source is sampled at the same sampling frequency and then encoded as a series of 16-bit data in lieu of 8-bit data, which of the following is an appropriate explanation concerning this encoding?","hasDiagram":false,"options":[{"key":"a","text":"The amplitude of the sound can be recorded more finely."},{"key":"b","text":"When the recording time is the same, the amount of data becomes smaller."},{"key":"c","text":"The CPU load required to process the recorded data decreases."},{"key":"d","text":"The upper limit of the frequency that can be recorded becomes higher."}],"correctAnswer":"a","explanation":"a) The amplitude of the sound can be recorded more finely."},{"id":"2019A-Q03","session":"Autumn 2019","category":null,"questionNumber":3,"prompt":"A sound signal is digitized. Sampling is performed at Time 1 through Time 5 in the figure below, and four-level quantization is performed; in other words, the levels closest to the sampling point are selected. After that, two-bit encoding is performed. The result is “11 01 00 10 11”. When digitization is performed in the same way, which of the following figures represents the sound signal that results in “01 00 10 11 01”?\n  _(Note: Figures omitted in source text)_","hasDiagram":true,"options":[{"key":"a","text":"[Figure A]"},{"key":"b","text":"[Figure B]"},{"key":"c","text":"[Figure C]"},{"key":"d","text":"[Figure D]"}],"correctAnswer":"b","explanation":"b) [Figure B]"},{"id":"2019A-Q04","session":"Autumn 2019","category":null,"questionNumber":4,"prompt":"Which of the following is the appropriate combination of compression technology standards for still images, moving images, and audio?","hasDiagram":false,"options":[{"key":"a","text":"Still images: MP3 · Moving images: JPEG · Audio: GIF"},{"key":"b","text":"Still images: GIF · Moving images: MPEG · Audio: MP3"},{"key":"c","text":"Still images: MPEG · Moving images: GIF · Audio: MP3"},{"key":"d","text":"Still images: JPEG · Moving images: MP3 · Audio: GIF"}],"correctAnswer":"b","explanation":"b) Still images: GIF · Moving images: MPEG · Audio: MP3"},{"id":"2019A-Q05","session":"Autumn 2019","category":null,"questionNumber":5,"prompt":"Which of the following is a term for commands to a computer that are written in a programming language?","hasDiagram":false,"options":[{"key":"a","text":"PIN code"},{"key":"b","text":"Source code"},{"key":"c","text":"Binary code"},{"key":"d","text":"Character code"}],"correctAnswer":"b","explanation":"b) Source code"},{"id":"2019A-Q06","session":"Autumn 2019","category":null,"questionNumber":6,"prompt":"In the data structure called a queue that is suitable for performing first-in first-out (FIFO) processing, values are stored in the order of “8”, “1”, “6”, and “3”, and then a value is removed twice continuously. Which of the following is the value that is obtained by the second removal?","hasDiagram":false,"options":[{"key":"a","text":"1"},{"key":"b","text":"3"},{"key":"c","text":"6"},{"key":"d","text":"8"}],"correctAnswer":"a","explanation":"a) 1"},{"id":"2019A-Q07","session":"Autumn 2019","category":null,"questionNumber":7,"prompt":"As shown in Figure 1, there is a processing unit which reads two positive integer input values A1 and A2, and then writes two integer output values B1 and B2. B1 is equal to A2, and B2 is the remainder of A1 divided by A2. In Figure 2, two processing units with the same function as the above are connected in series. When A1=15 and A2=6 are given to the left-hand unit in Figure 2, what is the output value of B1 for the right-hand unit?","hasDiagram":true,"options":[{"key":"a","text":"0"},{"key":"b","text":"3"},{"key":"c","text":"6"},{"key":"d","text":"15"}],"correctAnswer":"b","explanation":"b) 3"},{"id":"2019A-Q08","session":"Autumn 2019","category":null,"questionNumber":8,"prompt":"A markup language specifies the character color according to the “Syntax and meaning of the markup language definition section” below. When an element (parent) contains another element (child), the child inherits the parent’s specifications, but priority is given to the child-specific specifications if the child and the parent have different values specified for the same attribute. When the text in the “Example” below is displayed according to this rule, which of the following is the appropriate display attribute for the underlined character string? Here, “\u003cstrong>character string\u003c/strong>” specifies the character string to be emphasized, for example by using bold font.\n\n**[Syntax and meaning of the markup language definition section]**\n(1) Syntax of the definition section: `. name {color specification}`\n(2) Meaning: Assigns a color attribute to “name” to display the character string (element) between `\u003cname>` and `\u003c/name>` in the specified color.\n\n**[Example]**\nDefinition: `.color1 {blue}` `.color2 {red}`\nBody text: `\u003cstrong>The role of the system administrator is \u003ccolor1>to promote the use of computers and other information technology to end-user departments. \u003ccolor2>Increased use of information technology improves the work efficiency of each user,\u003c/color2> and can also lead to operational improvements across the entire organization.\u003c/color1>\u003c/strong>`","hasDiagram":false,"options":[{"key":"a","text":"Blue characters, emphasized"},{"key":"b","text":"Red characters, emphasized"},{"key":"c","text":"Blue characters, not emphasized"},{"key":"d","text":"Red characters, not emphasized"}],"correctAnswer":"b","explanation":"b) Red characters, emphasized"},{"id":"2019A-Q09","session":"Autumn 2019","category":null,"questionNumber":9,"prompt":"Which of the following is usually created using HTML?","hasDiagram":false,"options":[{"key":"a","text":"Web browser"},{"key":"b","text":"Web page"},{"key":"c","text":"Cookie"},{"key":"d","text":"SQL program"}],"correctAnswer":"b","explanation":"b) Web page"},{"id":"2019A-Q10","session":"Autumn 2019","category":null,"questionNumber":10,"prompt":"Which of the following is an appropriate description concerning the primary and secondary cache memory that a CPU is equipped with?","hasDiagram":false,"options":[{"key":"a","text":"The primary cache memory has larger capacity than the secondary cache memory."},{"key":"b","text":"The secondary cache memory is slower than the main memory in writing and reading."},{"key":"c","text":"When the CPU reads data, it first accesses the primary cache memory, and then it accesses the secondary cache memory if no data is available."},{"key":"d","text":"All of the data that is required for a process needs to be present on the primary or secondary cache memory when a program starts."}],"correctAnswer":"c","explanation":"c) When the CPU reads data, it first accesses the primary cache memory, and then it accesses the secondary cache memory if no data is available."},{"id":"2019A-Q11","session":"Autumn 2019","category":null,"questionNumber":11,"prompt":"In the description below concerning the connection between a PC and a peripheral device, which of the following is an appropriate combination of words to be inserted into blanks A and B?\n\n\"The connection of a new peripheral device to a PC requires [A], but if a peripheral device that supports [B] function is connected, the [A] is installed automatically and the device can be used.\"","hasDiagram":false,"options":[{"key":"a","text":"A: Device drivers · B: Plug and play"},{"key":"b","text":"A: Device drivers · B: Plug in"},{"key":"c","text":"A: Malware · B: Plug and play"},{"key":"d","text":"A: Malware · B: Plug in"}],"correctAnswer":"a","explanation":"a) A: Device drivers · B: Plug and play"},{"id":"2019A-Q12","session":"Autumn 2019","category":null,"questionNumber":12,"prompt":"Which of the following is the most appropriate description concerning a compatible CPU?","hasDiagram":false,"options":[{"key":"a","text":"It can run the OS or the application software that can be run on the original CPU."},{"key":"b","text":"It must not be developed nor manufactured as long as the patents of the original CPU are valid."},{"key":"c","text":"A compatible CPU for single-core CPU has been developed, while one for multi-core CPU does not exist."},{"key":"d","text":"It is a CPU that is intended to improve the performance of an outdated PC, and is not adopted for a new model of PC."}],"correctAnswer":"a","explanation":"a) It can run the OS or the application software that can be run on the original CPU."},{"id":"2019A-Q13","session":"Autumn 2019","category":null,"questionNumber":13,"prompt":"Which of the following is an appropriate explanation of HDMI?","hasDiagram":false,"options":[{"key":"a","text":"It is an interface for an AV device that handles the input and output of video, audio, and control signals through a single cable."},{"key":"b","text":"It is an interface that makes use of the infrared rays used in the exchange of information between cell phones."},{"key":"c","text":"It is a serial interface that connects an external hard disk or such other devices through a cable."},{"key":"d","text":"It is a wireless interface that makes use of radio waves and can perform communication even when there is a slight shielding."}],"correctAnswer":"a","explanation":"a) It is an interface for an AV device that handles the input and output of video, audio, and control signals through a single cable."},{"id":"2019A-Q14","session":"Autumn 2019","category":null,"questionNumber":14,"prompt":"Two (2) HDDs are connected to a server. If only one (1) of the HDDs fails, the operation needs to be able to continue. Which of the following is an appropriate configuration that should be used?","hasDiagram":false,"options":[{"key":"a","text":"Striping"},{"key":"b","text":"Data mining"},{"key":"c","text":"Tethering"},{"key":"d","text":"Mirroring"}],"correctAnswer":"d","explanation":"d) Mirroring"},{"id":"2019A-Q15","session":"Autumn 2019","category":null,"questionNumber":15,"prompt":"Which of the following includes all the appropriate measures to enable the normal execution of processing even in the event of a failure in part of a system?\n\n(1) The configuration of HDDs with mirroring\n(2) The minimization of the frequency of maintenance and inspections after stable operation of the system starts\n(3) The grouping of multiple redundant network lines into a single high-speed line\n(4) The redundancy of power supply with the use of UPS (Uninterrupted Power Supply) etc.","hasDiagram":false,"options":[{"key":"a","text":"(1), (3)"},{"key":"b","text":"(1), (4)"},{"key":"c","text":"(2), (3)"},{"key":"d","text":"(2), (4)"}],"correctAnswer":"b","explanation":"b) (1), (4)"},{"id":"2019A-Q16","session":"Autumn 2019","category":null,"questionNumber":16,"prompt":"Which of the following is an appropriate explanation of the hot standby system?","hasDiagram":false,"options":[{"key":"a","text":"It is a system configuration where a collection of various types of hardware, software, and data on the Internet is provided to the user."},{"key":"b","text":"It is a system configuration where a high level of reliability can be obtained by simultaneously operating the two sets of equipment and by always performing the same processing while cross-checking the results."},{"key":"c","text":"It is a system configuration where a backup machine is always kept ready in an operable state and is immediately switched into operation at the occurrence of a failure."},{"key":"d","text":"It is a system configuration where a backup machine is arranged, and at the occurrence of a failure, the operator in charge starts up the backup machine to switch the production machine to the backup machine."}],"correctAnswer":"c","explanation":"c) It is a system configuration where a backup machine is always kept ready in an operable state and is immediately switched into operation at the occurrence of a failure."},{"id":"2019A-Q17","session":"Autumn 2019","category":null,"questionNumber":17,"prompt":"The tax-inclusive prices of products A and B are calculated by using two (2) tax rates that are set in cells D2 and E2 below. The correct formula that should be entered in cell D4 is `$B4*(1.0+D$2)`, but a wrong formula `$B4*(1.0+$D$2)` was entered. When the formula that was entered in cell D4 is copied to cells D5, E4, and E5, which of the following is the numeric value that is displayed in cell E5?\n\n|     | A            | B                   | C        | D                     | E                     |\n| --- | ------------ | ------------------- | -------- | --------------------- | --------------------- |\n| 1   |              |                     |          | Tax rate 1            | Tax rate 2            |\n| 2   |              |                     | Tax rate | 0.05                  | 0.1                   |\n| 3   | Product name | Tax-exclusive price |          | Tax-inclusive price 1 | Tax-inclusive price 2 |\n| 4   | Product A    | 500                 |          |                       |                       |\n| 5   | Product B    | 600                 |          |                       |                       |","hasDiagram":false,"options":[{"key":"a","text":"525"},{"key":"b","text":"550"},{"key":"c","text":"630"},{"key":"d","text":"660"}],"correctAnswer":"c","explanation":"c) 630"},{"id":"2019A-Q18","session":"Autumn 2019","category":null,"questionNumber":18,"prompt":"Which of the following is an appropriate description concerning Open Source Software (OSS)?","hasDiagram":false,"options":[{"key":"a","text":"Source code can be edited and then redistributed."},{"key":"b","text":"Source code is free of charge, but maintenance and support are charged."},{"key":"c","text":"Copyrights are waived, so it can be used without permission."},{"key":"d","text":"If the copyright is not waived, the operability must be warranted."}],"correctAnswer":"a","explanation":"a) Source code can be edited and then redistributed."},{"id":"2019A-Q19","session":"Autumn 2019","category":null,"questionNumber":19,"prompt":"There is a system where a full backup is made after closing time every Sunday, and an incremental backup is made after closing time on Monday through Saturday. On a Wednesday, a failure happened during business hours, so a decision was made to restore data to the state at the time of closing on Tuesday by using backup files. Which of the following lists all the necessary backup files for restoring data? Here, an incremental backup file means a backup file that contains only the data that has been modified since the previous backup file (a full backup file or an incremental backup file) was made.","hasDiagram":false,"options":[{"key":"a","text":"A full backup file on Sunday, incremental backup files on Monday and Tuesday"},{"key":"b","text":"A full backup file on Sunday, an incremental backup file on Tuesday"},{"key":"c","text":"Incremental backup files on Monday and Tuesday"},{"key":"d","text":"An incremental backup file on Tuesday"}],"correctAnswer":"a","explanation":"a) A full backup file on Sunday, incremental backup files on Monday and Tuesday"},{"id":"2019A-Q20","session":"Autumn 2019","category":null,"questionNumber":20,"prompt":"Which of the following is the most appropriate method for displaying the content of database to a limited extent in accordance with each user’s business operations?","hasDiagram":false,"options":[{"key":"a","text":"Setting up access rights based on the combination of data and user"},{"key":"b","text":"Distributing a copy of the database limited to each user"},{"key":"c","text":"Setting up a set of data items (columns) dedicated to each user"},{"key":"d","text":"Setting up a password for each record in order to protect data"}],"correctAnswer":"a","explanation":"a) Setting up access rights based on the combination of data and user"},{"id":"2019A-Q21","session":"Autumn 2019","category":null,"questionNumber":21,"prompt":"When a spreadsheet application to create a line graph based on actual sales in the table below is used, the scale range of the vertical axis was automatically set between 0 and 1,500,000 yen. However, as the graph does not show clearly the change of sales over time, the change of sales needs to be more clearly shown without changing the frame size. Which of the following is the most appropriate chart editing operation?\n\n**Unit: Yen**\n| Month | Actual sales |\n|---|---|\n| January | 1,124,000 |\n| February | 1,063,000 |\n| March | 1,092,000 |\n| April | 1,159,000 |\n| May | 1,103,000 |\n| June | 1,201,000 |\n| July | 1,098,000 |\n| August | 1,182,000 |\n| September | 1,135,000 |\n| October | 1,093,000 |\n| November | 1,142,000 |\n| December | 1,220,000 |","hasDiagram":true,"options":[{"key":"a","text":"Change the unit of the vertical axis to 1,000 yen, which will make the range from 0 to 1,500 (Unit: Thousand yen)."},{"key":"b","text":"Change the display range of the vertical axis to 1,000,000–1,300,000 yen."},{"key":"c","text":"Convert the line graph to a bar graph."},{"key":"d","text":"Add an auxiliary line indicating average sales parallel to the horizontal axis."}],"correctAnswer":"b","explanation":"b) Change the display range of the vertical axis to 1,000,000–1,300,000 yen."},{"id":"2019A-Q22","session":"Autumn 2019","category":null,"questionNumber":22,"prompt":"As shown in the directory structure below, when D3 marked by an asterisk (\\*) is the current directory, which of the following is the appropriate directory path that can designate file A under directory D4 marked by an arrow? Here, a file is designated as follows:\n\n**[Method of file designation]**\n(1) A file is referenced as “directory name\\···\\directory name\\file name”, where the directory names on the path are listed and separated with “\\” in sequence, followed by the file name.\n(2) The current directory is represented by a period “.”.\n(3) A directory that is one level higher is represented by two periods “..”.\n(4) When the path name string begins with a backslash “\\”, it is assumed that the root directory is omitted from the beginning of the string.\n(5) When the path name string does not begin with “\\”, “.”, or “..”, it is assumed that “. \\” for the current directory is omitted from the beginning of the string.\n  _(Note: Directory structure diagram omitted in source text)_","hasDiagram":true,"options":[{"key":"a","text":"`..\\..\\D2\\D4\\A`"},{"key":"b","text":"`..\\D2\\D4\\A`"},{"key":"c","text":"`D1\\D2\\D4\\A`"},{"key":"d","text":"`D2\\D4\\A`"}],"correctAnswer":"b","explanation":"b) `..\\D2\\D4\\A`"},{"id":"2019A-Q23","session":"Autumn 2019","category":null,"questionNumber":23,"prompt":"Which of the following is a device that is used to recognize handwritten characters and convert them into character codes?","hasDiagram":false,"options":[{"key":"a","text":"BD-R"},{"key":"b","text":"CD-R"},{"key":"c","text":"OCR"},{"key":"d","text":"OMR"}],"correctAnswer":"c","explanation":"c) OCR"},{"id":"2019A-Q24","session":"Autumn 2019","category":null,"questionNumber":24,"prompt":"With regard to the colors printed by a printer, what color is formed logically when cyan, magenta, and yellow are mixed together by subtractive color mixing?","hasDiagram":false,"options":[{"key":"a","text":"Blue"},{"key":"b","text":"Red"},{"key":"c","text":"Black"},{"key":"d","text":"Green"}],"correctAnswer":"c","explanation":"c) Black"},{"id":"2019A-Q25","session":"Autumn 2019","category":null,"questionNumber":25,"prompt":"Which of the following is an appropriate explanation of raster graphics, which is a method of handling the graphics that is used as a collection of points called pixels in painting software?","hasDiagram":false,"options":[{"key":"a","text":"It is widely used in CAD."},{"key":"b","text":"The type and brightness of a color can be adjusted for each pixel."},{"key":"c","text":"The file capacity is constant regardless of the level of resolution."},{"key":"d","text":"No jaggies are visible at the edges of shapes even upon enlargement."}],"correctAnswer":"b","explanation":"b) The type and brightness of a color can be adjusted for each pixel."},{"id":"2019A-Q26","session":"Autumn 2019","category":null,"questionNumber":26,"prompt":"Which of the following is an appropriate description of a rollback in transaction processing?","hasDiagram":false,"options":[{"key":"a","text":"When a transaction attempts to update shared data, it prohibits another transaction from updating that data."},{"key":"b","text":"When a transaction has been successfully processed, it commits an update to the database."},{"key":"c","text":"When a transaction has not been successfully processed for some reason, it reverts the database to the state that was present before the transaction was started."},{"key":"d","text":"It combines multiple tables into one (1) table by using mutually related columns as keys."}],"correctAnswer":"c","explanation":"c) When a transaction has not been successfully processed for some reason, it reverts the database to the state that was present before the transaction was started."},{"id":"2019A-Q27","session":"Autumn 2019","category":null,"questionNumber":27,"prompt":"By joining tables “Employees in charge”, “Regions”, and “Customers” that are managed in a relational database, the table A that is shown below is obtained. Which of the following is the table “Customers” that is used for the joining? Here, a solid underline indicates a primary key and a dotted underline indicates a foreign key.\n\n_(Note: Source tables omitted for brevity, see original exam for visual layout)_","hasDiagram":false,"options":[{"key":"a","text":"[Table A]"},{"key":"b","text":"[Table B]"},{"key":"c","text":"[Table C]"},{"key":"d","text":"[Table D]"}],"correctAnswer":"d","explanation":"d) [Table D]"},{"id":"2019A-Q28","session":"Autumn 2019","category":null,"questionNumber":28,"prompt":"The result of the Information-Technology Engineers Examination by some of the employees of a company is shown below. In order to manage this table with a relational database, which of the following is an appropriate method to partition the table into two (2) tables? Here, this company has employees with the same family name and first name.","hasDiagram":false,"options":[{"key":"a","text":"Table 1: (Employee_ID, Employee_name, Date_of_birth), Table 2: (Employee_ID, Examination_category, Examination_date, Pass_or_fail)"},{"key":"b","text":"Table 1: (Employee_ID, Employee_name, Date_of_birth), Table 2: (Employee_name, Examination_category, Examination_date, Pass_or_fail)"},{"key":"c","text":"Table 1: (Employee_ID, Employee_name, Date_of_birth, Examination_date), Table 2: (Employee_ID, Employee_name, Examination_category, Pass_or_fail)"},{"key":"d","text":"Table 1: (Employee_ID, Date_of_birth, Examination_date), Table 2: (Employee_ID, Employee_name, Examination_category, Pass_or_fail)"}],"correctAnswer":"a","explanation":"a) Table 1: (Employee_ID, Employee_name, Date_of_birth), Table 2: (Employee_ID, Examination_category, Examination_date, Pass_or_fail)"},{"id":"2019A-Q29","session":"Autumn 2019","category":null,"questionNumber":29,"prompt":"In the description below concerning a relational database, which of the following is an appropriate combination of terms to be inserted into blanks A through C?\n\n\"Analyze the target business operations, identify the data which is used there, and create [A], consisting of entities and [B]. On the basis of the created [A], design [C].\"","hasDiagram":false,"options":[{"key":"a","text":"A: instances · B: E-R diagram · C: functions"},{"key":"b","text":"A: instances · B: flowchart · C: tables"},{"key":"c","text":"A: relationships · B: E-R diagram · C: tables"},{"key":"d","text":"A: relationships · B: flowchart · C: functions"}],"correctAnswer":"c","explanation":"c) A: relationships · B: E-R diagram · C: tables"},{"id":"2019A-Q30","session":"Autumn 2019","category":null,"questionNumber":30,"prompt":"Which of the following is an appropriate description of online storage?","hasDiagram":false,"options":[{"key":"a","text":"A virtual private network that is established via the Internet"},{"key":"b","text":"A service that lends disk space for storing data via the Internet"},{"key":"c","text":"Software that is distributed or sold via the Internet"},{"key":"d","text":"A computer game that multiple users can simultaneously play via the Internet"}],"correctAnswer":"b","explanation":"b) A service that lends disk space for storing data via the Internet"},{"id":"2019A-Q31","session":"Autumn 2019","category":null,"questionNumber":31,"prompt":"Which of the following is an appropriate description of a SIM card?","hasDiagram":false,"options":[{"key":"a","text":"A card-type device that is used for the purpose of ensuring security in Internet banking and generates a password that can be used only once when a password is required"},{"key":"b","text":"An IC card that is inserted into a mobile phone for its use and that the phone number and subscriber ID are recorded on"},{"key":"c","text":"A large-capacity memory card that is used in digital music players or digital cameras for storing contents"},{"key":"d","text":"A card that is provided with a receiver for digital broadcasting and is used for decoding scrambled digital broadcasting"}],"correctAnswer":"b","explanation":"b) An IC card that is inserted into a mobile phone for its use and that the phone number and subscriber ID are recorded on"},{"id":"2019A-Q32","session":"Autumn 2019","category":null,"questionNumber":32,"prompt":"Which of the following is a protocol that is used for synchronization of the internal clock of a computer via a network with a server that holds a reference clock?","hasDiagram":false,"options":[{"key":"a","text":"FTP"},{"key":"b","text":"NTP"},{"key":"c","text":"POP"},{"key":"d","text":"SMTP"}],"correctAnswer":"b","explanation":"b) NTP"},{"id":"2019A-Q33","session":"Autumn 2019","category":null,"questionNumber":33,"prompt":"Which of the following is the most appropriate description of a WAN?","hasDiagram":false,"options":[{"key":"a","text":"A virtual private network that uses the Internet"},{"key":"b","text":"A network that connects countries, rather than a network that connects various regions within a country"},{"key":"c","text":"A network that uses a network service from a network operator for connecting geographically separated locations, for example, a head office and its branch"},{"key":"d","text":"A brand name that is granted only to devices where interconnectivity has been confirmed, by the industrial association that promotes products that support the IEEE 802.11 standard that is used in wireless LANs"}],"correctAnswer":"c","explanation":"c) A network that uses a network service from a network operator for connecting geographically separated locations, for example, a head office and its branch"},{"id":"2019A-Q34","session":"Autumn 2019","category":null,"questionNumber":34,"prompt":"Which of the following is an appropriate description of LTE in wireless communications?","hasDiagram":false,"options":[{"key":"a","text":"A wireless LAN communication method that enables devices to communicate directly with each other without using any access point"},{"key":"b","text":"A small-scale network that connects PCs and peripheral devices within a range of several meters"},{"key":"c","text":"A wireless communication standard for mobile phones to enable faster data communication than 3G"},{"key":"d","text":"A small base station system for mobile phones to be installed in households and offices where it is difficult for radio waves to penetrate"}],"correctAnswer":"c","explanation":"c) A wireless communication standard for mobile phones to enable faster data communication than 3G"},{"id":"2019A-Q35","session":"Autumn 2019","category":null,"questionNumber":35,"prompt":"A private key and a public key were generated as a key pair when a digital certificate was issued. Which of the following is an appropriate action that should be taken when the private key is leaked?","hasDiagram":false,"options":[{"key":"a","text":"Reissuing the digital certificate with the key pair that was used"},{"key":"b","text":"Requesting to the certification authority for invalidation of the digital certificate"},{"key":"c","text":"Using a key pair that is newly created at the time of reissuing due to the expiration of the validity period"},{"key":"d","text":"Using the digital certificate as it is, because it is only the private key that was leaked"}],"correctAnswer":"b","explanation":"b) Requesting to the certification authority for invalidation of the digital certificate"},{"id":"2019A-Q36","session":"Autumn 2019","category":null,"questionNumber":36,"prompt":"Risks on information assets are assessed on the basis of threats and vulnerabilities. Which of the following falls under a threat?","hasDiagram":false,"options":[{"key":"a","text":"Unencrypted communication"},{"key":"b","text":"An inconsistency in procedures for handling confidential documents"},{"key":"c","text":"A door that cannot be locked"},{"key":"d","text":"An unexpected power failure due to a disaster such as a thunderbolt"}],"correctAnswer":"d","explanation":"d) An unexpected power failure due to a disaster such as a thunderbolt"},{"id":"2019A-Q37","session":"Autumn 2019","category":null,"questionNumber":37,"prompt":"Which of the following is an a (function () {
  "use strict";
  const QS = EXAM.questions;
  const BY_ID = new Map(QS.map((q) => [q.id, q]));
  const STORE_KEY = "philnits:" + EXAM.year + ":v1";
  const $ = (s) => document.querySelector(s);

  // ---------- persistence ----------
  const defaults = () => ({ answers: {}, revealed: {}, bookmarks: {}, view: "quiz", order: null, filters: { q: "", session: "", status: "all" } });
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && typeof s === "object") return Object.assign(defaults(), s);
    } catch (e) {}
    return defaults();
  }
  let state = load();
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- markdown + math rendering ----------
  const ESC_CHARS = "\\`*_{}[]()#+-.!<>$|~\"'=&";
  const htmlEsc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Source uses "\$\\checkmark\$" for escaped math; normalise to "$\checkmark$".
  const normalise = (s) => s.replace(/\\\$\\\\([a-zA-Z]+)\\\$/g, (_, c) => "$\\" + c + "$");

  // "$...$" is math only when not glued to letters/digits (keeps spreadsheet refs like $A$36 or B$3 literal).
  const RE_MATH = /(^|[^\\A-Za-z0-9$])\$([^$\n]+?)\$(?![A-Za-z0-9$])/g;

  function extractMath(s, store) {
    return s.replace(RE_MATH, (m, pre, tex) => {
      if (/^\s|\s$/.test(tex)) return m;
      store.push(tex);
      return pre + "\uE000" + (store.length - 1) + "\uE000";
    });
  }

  function renderTex(tex) {
    if (window.katex) {
      try { return katex.renderToString(tex, { throwOnError: false }); } catch (e) {}
    }
    return htmlEsc(texToPlain(tex));
  }

  function texToPlain(tex) {
    const map = { times: "×", rightarrow: "→", leftarrow: "←", Rightarrow: "⇒", leftrightarrow: "↔", checkmark: "✓", div: "÷", le: "≤", leq: "≤", ge: "≥", geq: "≥", ne: "≠", neq: "≠", cdot: "·", pm: "±", infty: "∞", approx: "≈", sqrt: "√" };
    return tex
      .replace(/\\([a-zA-Z]+)\s?/g, (m, c) => (c in map ? map[c] : m))
      .replace(/\^\{([^}]*)\}/g, "^$1").replace(/_\{([^}]*)\}/g, "_$1")
      .replace(/[{}]/g, "").replace(/\\ /g, " ");
  }

  function inline(src) {
    const math = [], escs = [], code = [];
    // `code` spans are shown verbatim (spreadsheet formulas etc.), so pull them out first.
    let s = src.replace(/`([^`\n]+)`/g, (_, c) => (code.push(c), "" + (code.length - 1) + ""));
    s = extractMath(normalise(s), math);
    s = s.replace(/\\(.)/g, (m, c) => (ESC_CHARS.includes(c) ? (escs.push(c), "\uE001" + (escs.length - 1) + "\uE001") : m));
    s = htmlEsc(s);
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1<em>$2</em>");
    s = s.replace(/\uE001(\d+)\uE001/g, (_, i) => htmlEsc(escs[+i]));
    s = s.replace(/\uE000(\d+)\uE000/g, (_, i) => renderTex(math[+i]));
    return s.replace(/\uE002(\d+)\uE002/g, (_, i) => "<code>" + htmlEsc(code[+i]) + "</code>");
  }

  function plain(src) {
    const math = [], code = [];
    let s = src.replace(/`([^`\n]+)`/g, (_, c) => (code.push(c), "\uE002" + (code.length - 1) + "\uE002"));
    s = extractMath(normalise(s), math);
    s = s.replace(/\*\*(.+?)\*\*/g, "$1").replace(/(^|[^*\\])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1$2");
    s = s.replace(/\\(.)/g, (m, c) => (ESC_CHARS.includes(c) ? c : m));
    s = s.replace(/\uE000(\d+)\uE000/g, (_, i) => texToPlain(math[+i]));
    return s.replace(/\uE002(\d+)\uE002/g, (_, i) => code[+i]);
  }

  const RE_BULLET = /^\s*[*-]\s+/, RE_NUM = /^\s*\d+\.\s+/, RE_TABLE = /^\s*\|/;
  function block(src) {
    const lines = src.split("\n"), out = [];
    let i = 0;
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) { i++; continue; }
      if (RE_TABLE.test(l)) {
        const rows = [];
        while (i < lines.length && RE_TABLE.test(lines[i])) rows.push(lines[i++]);
        out.push(table(rows));
      } else if (RE_BULLET.test(l) || RE_NUM.test(l)) {
        const ordered = RE_NUM.test(l), re = ordered ? RE_NUM : RE_BULLET, items = [];
        while (i < lines.length && re.test(lines[i])) items.push(lines[i++].replace(re, ""));
        const tag = ordered ? "ol" : "ul";
        out.push("<" + tag + ">" + items.map((t) => "<li>" + inline(t) + "</li>").join("") + "</" + tag + ">");
      } else {
        const para = [];
        while (i < lines.length && lines[i].trim() && !RE_TABLE.test(lines[i]) && !RE_BULLET.test(lines[i]) && !RE_NUM.test(lines[i])) para.push(lines[i++]);
        out.push("<p>" + para.map((t) => inline(t.trim())).join("<br>") + "</p>");
      }
    }
    return out.join("");
  }

  function table(rows) {
    const cells = (r) => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
    const body = rows.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r)).map(cells);
    if (!body.length) return "";
    const [head, ...rest] = body;
    return "<table><thead><tr>" + head.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
      rest.map((r) => "<tr>" + r.map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
  }

  const cache = new Map();
  function rendered(q) {
    let r = cache.get(q.id);
    if (!r) {
      r = {
        prompt: block(q.prompt),
        options: q.options.map((o) => inline(o.text)),
        explanation: inline(q.explanation || ""),
        search: ("#" + q.questionNumber + " " + q.id + " " + plain(q.prompt) + " " + q.options.map((o) => plain(o.text)).join(" ")).toLowerCase(),
      };
      cache.set(q.id, r);
    }
    return r;
  }

  // ---------- filtering ----------
  function ordered() {
    if (!state.order) return QS;
    const list = state.order.map((id) => BY_ID.get(id)).filter(Boolean);
    return list.length === QS.length ? list : QS;
  }

  function visible() {
    const f = state.filters, term = f.q.trim().toLowerCase();
    const num = /^#?(\d+)$/.exec(term);
    return ordered().filter((q) => {
      if (f.session && q.session !== f.session) return false;
      const a = state.answers[q.id];
      if (f.status === "unanswered" && a) return false;
      if (f.status === "incorrect" && (!a || a === q.correctAnswer)) return false;
      if (f.status === "bookmarked" && !state.bookmarks[q.id]) return false;
      if (!term) return true;
      if (num) return q.questionNumber === +num[1];
      return rendered(q).search.includes(term);
    });
  }

  // ---------- views ----------
  function quizCard(q) {
    const r = rendered(q), a = state.answers[q.id], revealed = !a && state.revealed[q.id];
    const done = !!a || revealed;
    const status = a ? (a === q.correctAnswer ? '<span class="tag ok">Correct</span>' : '<span class="tag bad">Incorrect</span>') : "";
    const opts = q.options.map((o, i) => {
      let cls = "", mark = "";
      if (done && o.key === q.correctAnswer) { cls = "correct"; mark = "✅"; }
      else if (a && o.key === a) { cls = "wrong"; mark = "❌"; }
      else if (done) cls = "dim";
      return '<button type="button" class="opt ' + cls + '" data-act="pick" data-key="' + o.key + '"' + (done ? " disabled" : "") + ">" +
        '<span class="k">' + o.key + '</span><span class="t">' + r.options[i] + '</span><span class="m">' + mark + "</span></button>";
    }).join("");
    const foot = done
      ? '<button type="button" class="linkbtn" data-act="clear">' + (a ? "Try again" : "Hide answer") + "</button>"
      : '<button type="button" class="linkbtn" data-act="reveal">Reveal answer</button>';
    return '<article class="q" data-id="' + q.id + '">' + head(q, status) +
      '<div class="prompt">' + r.prompt + "</div>" + figNote(q) +
      '<div class="opts">' + opts + "</div>" +
      '<div class="q-foot">' + foot + "</div>" +
      (done && r.explanation ? '<div class="explain"><strong>Answer:</strong> ' + r.explanation + "</div>" : "") +
      "</article>";
  }

  function docCard(q) {
    const r = rendered(q);
    const opts = q.options.map((o, i) => {
      const ok = o.key === q.correctAnswer;
      return '<li class="' + (ok ? "correct" : "") + '">[' + (ok ? "x" : "&nbsp;") + "] " + o.key + ") " + r.options[i] + (ok ? " ✅" : "") + "</li>";
    }).join("");
    return '<article class="q" data-id="' + q.id + '">' + head(q, "") +
      '<div class="prompt">' + r.prompt + "</div>" + figNote(q) +
      '<ul class="doc-opts">' + opts + "</ul>" +
      '<div class="doc-ans"><strong>Answer:</strong> ' + r.explanation + "</div></article>";
  }

  function head(q, status) {
    const bm = !!state.bookmarks[q.id];
    return '<div class="q-head"><span class="q-num">Question ' + q.questionNumber + '</span><span class="tag">' + htmlEsc(q.session || "") + "</span>" + status +
      '<button type="button" class="bm" data-act="bookmark" aria-pressed="' + bm + '" aria-label="Bookmark question ' + q.questionNumber + '" title="Bookmark">' + (bm ? "★" : "☆") + "</button></div>";
  }

  const figNote = (q) => (q.hasDiagram ? '<div class="note-fig">This question refers to a figure, graph or table that is not included in the source.</div>' : "");

  function render() {
    const list = visible(), box = $("#list"), doc = state.view === "doc";
    box.className = doc ? "doc" : "quiz";
    box.innerHTML = list.length ? list.map(doc ? docCard : quizCard).join("") : '<p class="empty">No questions match these filters.</p>';
    $("#count-line").textContent = "Showing " + list.length + " of " + QS.length + " questions" + (state.order ? " · shuffled" : "");
    $("#btn-copy").hidden = !doc || !list.length;
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
    $("#btn-shuffle").setAttribute("aria-pressed", String(!!state.order));
    stats();
  }

  function rerenderCard(id) {
    const el = document.querySelector('.q[data-id="' + id + '"]');
    if (!el) return;
    const q = BY_ID.get(id);
    el.outerHTML = state.view === "doc" ? docCard(q) : quizCard(q);
  }

  function stats() {
    let answered = 0, correct = 0;
    for (const q of QS) {
      const a = state.answers[q.id];
      if (a) { answered++; if (a === q.correctAnswer) correct++; }
    }
    $("#st-answered").textContent = answered + "/" + QS.length;
    $("#st-score").textContent = answered ? Math.round((correct / answered) * 100) + "%" : "–";
    $("#st-remaining").textContent = QS.length - answered;
    $("#progress-bar").style.width = (answered / QS.length) * 100 + "%";
    // Summary for the home page's year cards.
    try { localStorage.setItem("philnits:" + EXAM.year + ":summary", JSON.stringify({ answered, correct, total: QS.length })); } catch (e) {}
  }

  // ---------- copy (document view) ----------
  function copyText(list) {
    return list.map((q) => {
      const opts = q.options.map((o) => (o.key === q.correctAnswer ? "[x] " : "[ ] ") + o.key + ") " + plain(o.text) + (o.key === q.correctAnswer ? " ✅" : "")).join("\n");
      return "Question " + q.questionNumber + " (" + q.session + ")\n" + plain(q.prompt) + "\n\n" + opts + "\n\nAnswer: " + plain(q.explanation || "");
    }).join("\n\n");
  }

  async function copyVisible() {
    const text = copyText(visible());
    try {
      await navigator.clipboard.writeText(text);
      toast("Copied " + visible().length + " questions");
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Copied"); } catch (e2) { toast("Copy failed"); }
      ta.remove();
    }
  }

  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  // ---------- theme ----------
  function currentTheme() {
    return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function themeLabel() { $("#btn-theme").textContent = currentTheme() === "dark" ? "☀ Light" : "☾ Dark"; }

  // ---------- events ----------
  $("#list").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const id = btn.closest(".q").dataset.id;
    const act = btn.dataset.act;
    if (act === "pick") { state.answers[id] = btn.dataset.key; delete state.revealed[id]; }
    else if (act === "reveal") state.revealed[id] = true;
    else if (act === "clear") { delete state.answers[id]; delete state.revealed[id]; }
    else if (act === "bookmark") { if (state.bookmarks[id]) delete state.bookmarks[id]; else state.bookmarks[id] = true; }
    save(); rerenderCard(id); stats();
  });

  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => {
    state.view = b.dataset.view; save(); render();
  }));

  let searchTimer;
  $("#f-search").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.filters.q = e.target.value; save(); render(); }, 120);
  });
  $("#f-session").addEventListener("change", (e) => { state.filters.session = e.target.value; save(); render(); });
  $("#f-status").addEventListener("change", (e) => { state.filters.status = e.target.value; save(); render(); });

  $("#btn-shuffle").addEventListener("click", () => {
    if (state.order) state.order = null;
    else {
      const ids = QS.map((q) => q.id);
      for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
      state.order = ids;
    }
    save(); render(); window.scrollTo({ top: 0 });
  });

  $("#btn-reset").addEventListener("click", () => {
    if (!confirm("Clear all your answers and revealed answers for this exam? Bookmarks are kept.")) return;
    state.answers = {}; state.revealed = {}; state.order = null;
    save(); render(); toast("Progress cleared");
  });

  $("#btn-theme").addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("philnits:theme", next); } catch (e) {}
    themeLabel();
  });

  $("#btn-copy").addEventListener("click", copyVisible);

  // ---------- init ----------
  function init() {
    const sessions = [...new Set(QS.map((q) => q.session).filter(Boolean))];
    $("#f-session").insertAdjacentHTML("beforeend", sessions.map((s) => '<option value="' + htmlEsc(s) + '">' + htmlEsc(s) + "</option>").join(""));
    if (!sessions.includes(state.filters.session)) state.filters.session = "";
    $("#f-search").value = state.filters.q;
    $("#f-session").value = state.filters.session;
    $("#f-status").value = state.filters.status;
    $("#foot").textContent = QS.length + " questions · source: examQA-md · built " + EXAM.generatedAt.slice(0, 10);
    themeLabel();
    render();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
